/* Tappe del piano incidenti: il facilitatore le segna quando accadono; il debriefing ne misura le distanze. */
function Tappe({ d, ops }) {
  const tappe = d.tappe.slice().sort((a, b) => a.ordine - b.ordine);
  if (!tappe.length) return null;
  const set = (k, at) => ops.run(sb.from('tappe').update({ at }).eq('chiave', k), ['tappe'], at ? 'Tappa segnata' : 'Tappa azzerata');
  return html`<div className="section"><h2>Tappe del piano</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Segnale quando accadono: nel debriefing si leggono i tempi tra una tappa e l'altra.</p>
    <div className="tbl-wrap"><table><thead><tr><th>Tappa</th><th>Ora</th><th>Dalla tappa precedente</th><th></th></tr></thead><tbody>
      ${tappe.map((t, i) => { const p = tappe[i - 1]; return html`<tr key=${t.chiave}><td>${t.nome}</td><td className="n">${t.at ? oraSec(t.at) : '—'}</td>
        <td className="n">${t.at && p && p.at ? durata(p.at, t.at) : ''}</td>
        <td><span style=${{ display: 'flex', gap: '6px' }}>${t.at
          ? html`<button className="btn plain small" onClick=${() => { if (window.confirm('Azzerare «' + t.nome + '»?')) set(t.chiave, null); }}>Azzera</button>`
          : html`<button id=${'tappa-' + t.chiave} className="btn small" onClick=${() => set(t.chiave, new Date().toISOString())}>Segna adesso</button>`}</span></td></tr>`; })}
    </tbody></table></div>
  </div>`;
}

/* Bivi: la scelta guida quali versioni del copione inviare. */
function Bivi({ d, ops }) {
  const bivi = d.bivi.slice().sort((a, b) => a.numero - b.numero);
  if (!bivi.length) return null;
  const set = (n, scelta) => ops.run(sb.from('bivi').update({ scelta }).eq('numero', n), ['bivi']);
  const noInf = d.flows.filter(nonInformata).length;
  return html`<div className="section"><h2>Bivi</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Segna come si è chiuso ogni bivio: nel copione le versioni che non servono più si attenuano.</p>
    <div className="cards">${bivi.map(b => html`<div key=${b.numero} className="card" style=${{ '--c': b.scelta === 'si' ? 'var(--ok)' : b.scelta === 'no' ? 'var(--no)' : '#98A2B0' }}>
      <div className="ch"><span className="t">${b.numero}. ${b.titolo}</span>
        <div className="seg" role="group" aria-label=${'Bivio ' + b.numero}>
          ${[['si', 'Sì'], ['no', 'No']].map(([k, l]) => html`<button key=${k} aria-pressed=${b.scelta === k} onClick=${() => set(b.numero, b.scelta === k ? null : k)}>${l}</button>`)}
        </div>
        ${b.numero === 6 ? html`<span className=${'tag' + (noInf ? ' warn' : '')}>${noInf ? noInf + ' invii in autonomia senza informativa' : 'Tutti gli invii in autonomia sono stati riferiti'}</span>` : null}</div>
      <div className="note"><b>Sì:</b> ${b.si}</div>
      <div className="note"><b>No:</b> ${b.no}</div>
    </div>`)}</div>
  </div>`;
}

/* ---------- scaletta del copione: situazioni e voci del monitor in passi ---------- */
const fattoCop = c => (c.tipo === 'monitor' ? c.inviato_at : c.inviato_flow);
function statoBivioDi(d, c) {
  if (!c.bivio || !c.ramo) return null;
  const sc = (d.bivi.find(b => b.numero === c.bivio) || {}).scelta;
  return !sc ? 'aperto' : sc === c.ramo ? 'attivo' : 'escluso';
}
// le decine dell'ordine formano il passo; in Avvio o in Pausa il prossimo passo è nella fase successiva
function buildScaletta(d, cfg) {
  const fasi = Array.from(new Set(cfg.fasi.map(f => f.nome).concat(d.copione.map(c => c.fase))));
  const fase = (d.campaign && d.campaign.fase) || '';
  const statoBivio = c => statoBivioDi(d, c);
  const pendente = c => !fattoCop(c) && !c.saltato_at && statoBivio(c) !== 'escluso';
  const passi = fn => {
    const m = new Map();
    d.copione.filter(c => c.fase === fn).sort((a, b) => a.ordine - b.ordine || a.id - b.id)
      .forEach(c => { const k = Math.floor((c.ordine || 0) / 10); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
    return Array.from(m.values()).map((items, i) => ({ n: i + 1, items, quando: (items.find(c => c.quando) || {}).quando || '' }));
  };
  const scaletta = fasi.map(fn => ({ fn, ps: passi(fn) })).filter(f => f.ps.length);
  const corrente = scaletta.find(f => fasi.indexOf(f.fn) >= fasi.indexOf(fase));
  const passo = corrente ? corrente.ps.find(p => p.items.some(pendente)) || null : null;
  return { fasi, fase, scaletta, pendente, statoBivio, faseP: corrente ? corrente.fn : '', passo, prossimo: passo ? passo.n : null,
    dopo: passo ? corrente.ps.filter(p => p.n > passo.n && p.items.some(pendente)).slice(0, 3) : [] };
}
// le situazioni diventano flussi; le voci del monitor compaiono sullo schermo della squadra
async function rilascia(c, d, who, ops) {
  if (c.tipo === 'monitor') {
    const meta = c.meta || {};
    const r = await ops.run(sb.from('monitor').insert({ team_id: c.team_id, fonte: c.voce, testo: c.testo, fase: (d.campaign && d.campaign.fase) || '',
      canale: meta.canale || 'social', sentiment: meta.sentiment || 'neutro', portata: meta.portata == null ? null : meta.portata }),
      ['monitor'], 'Sul monitor di ' + who.teamName(c.team_id));
    if (!r.error && c.id) await ops.run(sb.from('copione').update({ inviato_at: new Date().toISOString() }).eq('id', c.id), ['copione']);
    return r;
  }
  return ops.run(sb.rpc('send_situazione', { p_team: c.team_id, p_voce: c.voce, p_titolo: c.titolo, p_testo: c.testo, p_copione: c.id || null }),
    ['flows', 'copione'], 'Inviata a ' + who.teamName(c.team_id));
}

/* ---------- indizi sui bivi: cosa dicono già i dati della sessione ---------- */
const STOP = new Set(['dei', 'del', 'della', 'delle', 'degli', 'tra', 'per', 'con', 'sui', 'sul', 'sulla', 'agli', 'alle', 'allo', 'nel', 'nella', 'una', 'uno', 'che']);
const normT = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const paroleChiave = s => normT(s).split(' ').filter(w => w.length > 2 && !STOP.has(w));
function previstaDi(d, f) {
  const v = d.valutazioni.find(x => x.flow_id === f.id);
  return v && v.prevista_id != null ? v.prevista_id : guessPrevista(f, d.previste);
}
// la fase di una comunicazione prevista è scritta come «2» o «1–2»: conta l'ultima
function faseIdxDi(cfg, x) {
  const i = cfg.fasi.findIndex(f => f.nome === x); if (i >= 0) return i;
  const m = String(x || '').match(/(\d+)(?!.*\d)/);
  return m ? cfg.fasi.findIndex(f => new RegExp('(^|\\D)' + m[1] + '(\\D|$)').test(faseBreve(f.nome))) : -1;
}
function indizioBivio(b, d, cfg, who) {
  if (/informativ.*stanz|autonomia/i.test(b.titolo)) {
    const aut = d.flows.filter(f => autonoma(f) && f.stato === 'inviato');
    const no = aut.filter(f => !f.informata_at);
    if (!aut.length) return { testo: 'Nessun invio in autonomia finora.' };
    return no.length ? { testo: no.length + (no.length === 1 ? ' invio in autonomia senza informativa.' : ' invii in autonomia senza informativa.'), scelta: 'no', flow: no[0].id }
      : { testo: 'Tutti gli invii in autonomia sono stati riferiti.', scelta: 'si' };
  }
  const chiave = paroleChiave(b.titolo).slice(0, 2);
  const p = chiave.length ? d.previste.find(x => chiave.every(w => normT(x.tipo).includes(w))) : null;
  if (p) {
    const fs = d.flows.filter(f => f.kind !== 'situazione' && previstaDi(d, f) === p.id).sort(byTime);
    const inv = fs.filter(f => f.inviato_at).sort((a, c) => ms(a.inviato_at) - ms(c.inviato_at))[0];
    if (inv) return { testo: '«' + inv.titolo + '» inviata alle ' + ora(inv.inviato_at) + ' (' + (faseBreve(faseAt(d.campaign_fasi, inv.inviato_at)) || 'prima dell\'avvio') + '): valuta se è chiara, completa e in tempo.', scelta: 'si', flow: inv.id };
    if (fs.length) return { testo: 'In preparazione: «' + fs[0].titolo + '», non ancora inviata.', flow: fs[0].id };
    const fi = faseIdxDi(cfg, p.fase), cur = cfg.fasi.findIndex(f => f.nome === ((d.campaign && d.campaign.fase) || ''));
    if (fi >= 0 && cur > fi) return { testo: 'Prevista entro ' + cfg.fasi[fi].nome + ' e mai preparata.', scelta: 'no' };
    return { testo: 'Non ancora preparata (prevista: ' + p.tipo + ').' };
  }
  // senza una comunicazione prevista: se ne parla nei registri o nei flussi?
  const rad = chiave[0] ? chiave[0].slice(0, 5) : '';
  if (!rad) return { testo: '' };
  const hit = d.registro.map(r => ({ t: r.created_at, s: r.testo, team: r.team_id }))
    .concat(d.flows.filter(f => f.kind !== 'situazione' || f.richiesta).map(f => ({ t: f.created_at, s: f.titolo + ' — ' + (f.motivo || ''), team: f.from_team || f.to_team, flow: f.id })))
    .filter(x => normT(x.s).includes(rad)).sort((a, c) => ms(a.t) - ms(c.t))[0];
  if (!hit) return { testo: 'Nei registri e nei flussi non se ne parla ancora.' };
  const s = String(hit.s); const i = Math.max(0, normT(s).indexOf(rad) - 40);
  return { testo: who.teamName(hit.team) + ' alle ' + ora(hit.t) + ': «' + (i ? '…' : '') + s.slice(i, i + 110).trim() + (s.length > i + 110 ? '…' : '') + '»', flow: hit.flow };
}
function Indizio({ b, d, cfg, who, goFlow }) {
  const I = indizioBivio(b, d, cfg, who);
  if (!I.testo) return null;
  return html`<div className="indizio">${I.testo}
    ${I.scelta && b.scelta !== I.scelta ? html` Suggerito: <b>${I.scelta === 'si' ? 'sì' : 'no'}</b>.` : null}
    ${I.flow && goFlow ? html` <button className="link" onClick=${() => goFlow(I.flow)}>apri</button>` : null}</div>`;
}

/* ---------- conduzione: il prossimo passo, i bivi da segnare, cosa aspetta la regia ---------- */
function Conduzione({ d, cfg, who, ops, gestire, goFlow }) {
  const S = buildScaletta(d, cfg);
  const now = useNow(15000);
  const fase = S.fase;
  const [tempo, setTempo] = useState((d.campaign && d.campaign.tempo_sim) || '');
  useEffect(() => { setTempo((d.campaign && d.campaign.tempo_sim) || ''); }, [d.campaign && d.campaign.tempo_sim]);
  const [busy, setBusy] = useState(false);
  const setFase = (nome, t) => ops.run(sb.rpc('set_fase', { p_fase: nome, p_tempo: t }), ['campaign', 'campaign_fasi'], 'Ora in corso: ' + nome);
  const inizio = (d.campaign_fasi.slice().sort(byTime).filter(s => s.fase === fase).pop() || {}).created_at;
  const minuti = inizio ? Math.max(0, Math.floor((now - ms(inizio)) / 60000)) : 0;
  const durataFase = (cfg.fasi.find(f => f.nome === fase) || {}).durata || 0;
  const corrente = S.scaletta.find(f => f.fn === fase);
  const restano = corrente ? corrente.ps.filter(p => p.items.some(S.pendente)).length : 0;
  const ritmo = !durataFase || !inizio ? null : minuti > durataFase ? 'late' : durataFase - minuti <= 10 && restano > 2 ? 'warn' : 'ok';
  const succ = cfg.fasi[cfg.fasi.findIndex(f => f.nome === fase) + 1];
  const P = S.passo;
  const items = P ? P.items : [];
  const pronte = items.filter(c => S.pendente(c) && S.statoBivio(c) !== 'aperto');
  const biviAperti = Array.from(new Set(items.filter(c => S.pendente(c) && S.statoBivio(c) === 'aperto').map(c => c.bivio)))
    .map(n => d.bivi.find(b => b.numero === n)).filter(Boolean);
  const setBivio = (n, scelta) => ops.run(sb.from('bivi').update({ scelta }).eq('numero', n), ['bivi']);
  const salta = list => ops.run(sb.from('copione').update({ saltato_at: new Date().toISOString() }).in('id', list.map(c => c.id)), ['copione'], list.length > 1 ? 'Passo saltato' : 'Saltata');
  const rilasciaPasso = async () => {
    setBusy(true);
    for (const c of pronte) { const r = await rilascia(c, d, who, ops); if (r.error) break; }
    setBusy(false);
    ops.say(pronte.length > 1 ? 'Passo ' + P.n + ' rilasciato' : 'Rilasciata');
  };
  const tappa = d.tappe.slice().sort((a, b) => a.ordine - b.ordine).find(t => !t.at);
  const bivi = d.bivi.slice().sort((a, b) => a.numero - b.numero);
  const dove = c => (c.tipo === 'monitor' ? 'sul monitor di ' : 'a ') + who.teamName(c.team_id);
  const stato = c => fattoCop(c) ? 'rilasciata' : c.saltato_at ? 'saltata' : ({ escluso: 'esclusa dal bivio', aperto: 'aspetta il bivio ' + c.bivio, attivo: 'versione giusta del bivio ' + c.bivio })[S.statoBivio(c)] || '';

  return html`<div className="cockpit">
    <div>
      <div className="ck-top">
        <div className="ck-clock"><b>${fase || 'Non iniziata'}</b>
          <span>${inizio ? 'in corso da ' + durata(inizio, now) + (durataFase ? ' su ' + durataFase + ' min' : '') : 'scegli la fase per partire'}</span></div>
        ${ritmo ? html`<span className=${'ck-ritmo ' + ritmo}>${ritmo === 'late' ? 'Oltre il tempo di ' + (minuti - durataFase) + ' min' : ritmo === 'warn' ? 'Mancano ' + (durataFase - minuti) + ' min e ' + restano + ' passi: accelera o salta i facoltativi' : 'Nei tempi'}</span>` : null}
        ${corrente ? html`<span className="ck-ritmo">${restano ? (restano === 1 ? 'Resta 1 passo' : 'Restano ' + restano + ' passi') + ' in questa fase' : 'Fase completata'}</span>` : null}
        <span style=${{ flex: 1 }}></span>
        <span style=${{ display: 'flex', gap: '6px', alignItems: 'center' }}>
          <input id="ck-tempo" type="text" style=${{ width: '190px' }} value=${tempo} placeholder="Tempo simulato" aria-label="Tempo simulato mostrato alle squadre" onChange=${e => setTempo(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter') setFase(fase, tempo); }}/>
          <button className="btn plain small" disabled=${!fase || tempo === ((d.campaign && d.campaign.tempo_sim) || '')} onClick=${() => setFase(fase, tempo)}>Aggiorna</button></span>
        ${succ ? html`<button id="ck-succ" className="btn small" onClick=${() => { if (window.confirm('Passare a «' + succ.nome + '»?')) setFase(succ.nome, succ.tempo); }}>Passa a ${succ.nome} →</button>` : null}
      </div>

      ${P ? html`<section className="ck-next" id="ck-next">
        <div className="ck-next-h"><span className="n">Passo ${P.n}</span><b>${S.faseP}</b>
          ${S.faseP !== fase ? html`<span className="tag warn">${fase ? 'si apre con la fase successiva' : 'primo passo'}</span>` : null}</div>
        ${P.quando ? html`<p className="ck-q">${P.quando}</p>` : null}
        ${biviAperti.map(b => html`<div key=${b.numero} className="ck-bivio">
          <b>Prima segna il bivio ${b.numero}: ${b.titolo}</b>
          <div className="note"><b>Sì:</b> ${b.si}</div><div className="note"><b>No:</b> ${b.no}</div>
          <${Indizio} b=${b} d=${d} cfg=${cfg} who=${who} goFlow=${goFlow}/>
          <div className="actions"><button className="btn ok small" onClick=${() => setBivio(b.numero, 'si')}>Sì</button><button className="btn no small" onClick=${() => setBivio(b.numero, 'no')}>No</button></div>
        </div>`)}
        ${items.map(c => { const st = stato(c); const off = !S.pendente(c);
          return html`<div key=${c.id} className=${'ck-item' + (off ? ' off' : '')} data-ck=${c.id}>
            <${Avatar} nome=${c.voce} lg=${true}/>
            <div>
              <div className="ttl">${c.tipo === 'monitor' ? html`<${Icon} n="monitor"/> ` : null}${c.titolo}</div>
              <div className="hint">${c.voce} · ${dove(c)}${st ? ' · ' + st : ''}</div>
              <details><summary>Testo${c.note ? ' e note di regia' : ''}</summary><div className="x">${c.testo}</div>${c.note ? html`<div className="note">Regia: ${c.note}</div>` : null}</details>
              ${pronte.length > 1 && pronte.includes(c) ? html`<div className="actions" style=${{ marginTop: '6px' }}>
                <button className="btn plain small" disabled=${busy} onClick=${() => rilascia(c, d, who, ops)}>Rilascia solo questa</button>
                <button className="btn plain small" disabled=${busy} onClick=${() => salta([c])}>Salta</button></div>` : null}
            </div></div>`; })}
        <div className="actions" style=${{ marginTop: '14px' }}>
          <button id="btn-rilascia" className="btn send" disabled=${busy || !pronte.length} onClick=${rilasciaPasso}><${Icon} n="play"/> ${pronte.length > 1 ? 'Rilascia il passo (' + pronte.length + ')' : 'Rilascia'}</button>
          <button className="btn plain" disabled=${busy} onClick=${() => { const rest = items.filter(S.pendente); if (rest.length && window.confirm('Saltare il passo ' + P.n + '? Le voci restano nel copione e puoi rimetterle in scaletta.')) salta(rest); }}>Salta il passo</button>
          ${!pronte.length && biviAperti.length ? html`<span className="hint">Segna prima il bivio: poi si rilascia la versione giusta.</span>` : null}
        </div>
      </section>` : html`<section className="ck-next">
        <h2>${S.scaletta.length ? 'Nessun passo da rilasciare' + (fase ? ' in ' + fase : '') : 'Il copione è vuoto'}</h2>
        <p className="hint" style=${{ marginTop: '6px' }}>${succ ? 'Quando le stanze sono pronte, passa alla fase successiva.' : 'La scaletta è finita: è il momento del debriefing.'}</p>

      ${S.dopo.length ? html`<div className="ck-box" style=${{ marginTop: '14px' }}><h3>Dopo</h3>
        <ol className="ck-dopo">${S.dopo.map(p => html`<li key=${p.n}><b>${p.n}.</b> ${p.items.filter(S.pendente).map(c => c.titolo).join(' · ')}
          ${p.quando ? html`<div className="hint">${p.quando}</div>` : null}</li>`)}</ol></div>` : null}
    </div>

    <aside className="ck-side">
      <div className="ck-box"><h3><${Icon} n="situazione"/> Da gestire in regia${gestire.length ? ' · ' + gestire.length : ''}</h3>
        ${gestire.length ? html`<div className="ck-list">${gestire.slice(0, 8).map(f => html`<button key=${f.id} style=${{ '--c': railOf(f, who) }} onClick=${() => goFlow(f.id)}>
          <b>${f.titolo}</b><br/><span className="hint">${f.kind === 'esterna' ? 'Risponde: ' + destText(f) : f.richiesta ? 'Scrivono a ' + f.voce : 'Aspettano ' + (f.voce || 'una risposta')}</span></button>`)}
          ${gestire.length > 8 ? html`<button className="link" onClick=${() => goFlow(gestire[8].id)}>e altri ${gestire.length - 8} in Flussi</button>` : null}</div>`
          : html`<p className="empty">Niente in attesa della regia.</p>`}
      </div>
      ${tappa ? html`<div className="ck-box"><h3><${Icon} n="check"/> Prossima tappa del piano</h3>
        <p>${tappa.nome}</p>
        <div className="actions"><button className="btn small" onClick=${() => ops.run(sb.from('tappe').update({ at: new Date().toISOString() }).eq('chiave', tappa.chiave), ['tappe'], 'Tappa segnata')}>Segna adesso</button></div>
      </div>` : null}
      ${bivi.length ? html`<div className="ck-box"><h3>Bivi</h3>
        ${bivi.map(b => html`<div key=${b.numero} className="ck-bv">
          <div className="ck-bv-h"><span>${b.numero}. ${b.titolo}</span>
            <span className="seg" role="group" aria-label=${'Bivio ' + b.numero}>${[['si', 'Sì'], ['no', 'No']].map(([k, l]) => html`<button key=${k} aria-pressed=${b.scelta === k} onClick=${() => setBivio(b.numero, b.scelta === k ? null : k)}>${l}</button>`)}</span></div>
          <${Indizio} b=${b} d=${d} cfg=${cfg} who=${who} goFlow=${goFlow}/>
        </div>`)}
      </div>` : null}
      <div className="ck-box"><h3><${Icon} n="nota"/> Note di osservazione</h3><${NoteRapide} d=${d} who=${who} ops=${ops} compact=${true}/></div>
    </aside>
  </div>`;
}

/* Note rapide della regia: una frase, l'orario, se serve il punto dei piani e la stanza. Finiscono nel debriefing e nel report. */
// me: l'osservatore che scrive (toglie solo le sue note); senza me è la regia, che le gestisce tutte
function NoteRapide({ d, who, ops, compact, me, defTeam, onSaved }) {
  const [t, setT] = useState('');
  const [punto, setPunto] = useState('');
  const [team, setTeam] = useState(defTeam || '');
  const punti = d.punti.slice().sort((a, b) => a.ordine - b.ordine);
  const nomePunto = id => { const p = d.punti.find(x => x.id === id); return p ? p.ordine + '. ' + p.punto : ''; };
  const autore = o => { const x = d.osservatori.find(a => a.user_id === o.autore); return x ? x.nome : me && o.autore === me ? 'tu' : ''; };
  const add = async () => {
    if (!t.trim()) return;
    const r = await ops.run(sb.from('osservazioni').insert({ testo: t.trim(), punto_id: punto ? Number(punto) : null, team_id: team || null,
      fase: (d.campaign && d.campaign.fase) || '', tempo_sim: (d.campaign && d.campaign.tempo_sim) || '' }), ['osservazioni'], 'Nota salvata');
    if (!r.error) { setT(''); if (onSaved) onSaved(); }
  };
  const list = d.osservazioni.slice().sort((a, b) => byTime(b, a));
  return html`<div>
    <textarea id="oss-testo" value=${t} placeholder="Cosa hai visto? Ctrl+Invio per salvare" style=${{ minHeight: '64px' }} onChange=${e => setT(e.target.value)}
      onKeyDown=${e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } }}></textarea>
    <div className=${compact ? '' : 'grid2'} style=${{ display: compact ? 'grid' : null, gap: '6px', marginTop: '6px' }}>
      ${punti.length ? html`<select id="oss-punto" value=${punto} aria-label="Punto dei piani" onChange=${e => setPunto(e.target.value)}>
        <option value="">Nessun punto dei piani</option>${punti.map(p => html`<option key=${p.id} value=${p.id}>${p.ordine}. ${p.punto}</option>`)}</select>` : null}
      <select id="oss-team" value=${team} aria-label="Stanza" onChange=${e => setTeam(e.target.value)}>
        <option value="">Tutte le stanze</option>${who.teams.map(x => html`<option key=${x.id} value=${x.id}>${x.nome}</option>`)}</select>
    </div>
    <div className="actions"><button id="oss-add" className="btn small" disabled=${!t.trim()} onClick=${add}>Salva la nota</button></div>
    ${(compact ? list.slice(0, 4) : list).map(o => html`<div key=${o.id} className="oss"><time>${ora(o.created_at)}</time>${o.testo}
      <div className="hint">${[autore(o), o.team_id ? who.teamName(o.team_id) : '', nomePunto(o.punto_id), faseBreve(o.fase)].filter(Boolean).join(' · ')}
        ${!compact && (!me || o.autore === me) ? html` · <button className="link" onClick=${() => { if (window.confirm('Togliere questa nota?')) ops.run(sb.from('osservazioni').delete().eq('id', o.id), ['osservazioni']); }}>togli</button>` : null}</div></div>`)}
    ${compact && list.length > 4 ? html`<p className="hint" style=${{ marginTop: '6px' }}>Tutte le ${list.length} note sono nel Debriefing.</p>` : null}
  </div>`;
}

const EMPTY_SIT = { fase: '', ordine: 0, titolo: '', voce: '', team_id: '', testo: '', condizione: '', note: '', tipo: 'situazione', quando: '' };
function SituazioneForm({ init, cfg, who, onSave, onSend, onCancel }) {
  const defTeam = (who.teams.find(t => !t.autorizza) || who.teams[0] || {}).id || '';
  const [s, setS] = useState({ ...EMPTY_SIT, team_id: defTeam, fase: cfg.fasi[0] ? cfg.fasi[0].nome : '', voce: cfg.voci[0], ...init });
  const set = k => e => setS({ ...s, [k]: e.target.value });
  const ok = s.titolo.trim() && s.testo.trim() && s.voce.trim();
  return html`<div className="card" id="sit-form" style=${{ '--c': who.teamColor(s.team_id) }}>
    <div className="grid2">
      <${Field} label="Fase"><select value=${s.fase} onChange=${set('fase')}>${cfg.fasi.map(f => html`<option key=${f.nome}>${f.nome}</option>`)}
        ${s.fase && !cfg.fasi.some(f => f.nome === s.fase) ? html`<option>${s.fase}</option>` : null}</select><//>
      <${Field} label="Arriva a"><select id="sit-team" value=${s.team_id} onChange=${set('team_id')}>${who.ids.map(t => html`<option key=${t} value=${t}>${who.teamName(t)}</option>`)}</select><//>
      <${Field} label="Voce"><input id="sit-voce" type="text" list="voci-list" value=${s.voce} onChange=${set('voce')}/>
        <datalist id="voci-list">${cfg.voci.map(v => html`<option key=${v} value=${v}/>`)}</datalist><//>
      <${Field} label="Ordine nella fase" hint="Le decine sono il passo della scaletta: 10–19 passo 1, 20–29 passo 2…"><input type="number" value=${s.ordine} onChange=${e => setS({ ...s, ordine: parseInt(e.target.value, 10) || 0 })}/><//>
      <${Field} label="Tipo"><select id="sit-tipo" value=${s.tipo || 'situazione'} onChange=${set('tipo')}><option value="situazione">Situazione nel portale</option><option value="monitor">Voce del monitor (la voce è la fonte)</option></select><//>
    </div>
    <${Field} label="Titolo"><input id="sit-titolo" type="text" value=${s.titolo} onChange=${set('titolo')}/><//>
    <${Field} label="Testo che arriva alla squadra"><textarea id="sit-testo" className="big" value=${s.testo} onChange=${set('testo')}></textarea><//>
    <${Field} label="Quando farla partire" hint="Facoltativo: compare nella scaletta accanto al passo."><input type="text" value=${s.quando || ''} onChange=${set('quando')}/><//>
    <${Field} label="Condizione (bivio)" hint="Facoltativa: quando usare questa versione."><input type="text" value=${s.condizione} onChange=${set('condizione')}/><//>
    <${Field} label="Note di regia" hint="Le vedi solo tu."><textarea value=${s.note} onChange=${set('note')}></textarea><//>
    <div className="actions">
      ${onSave ? html`<button id="sit-save" className="btn" disabled=${!ok} onClick=${() => onSave(s)}>Salva nel copione</button>` : null}
      ${onSend ? html`<button id="sit-send" className="btn send" disabled=${!ok} onClick=${() => onSend(s)}>Invia ora</button>` : null}
      <button className="btn plain" onClick=${onCancel}>Annulla</button>
    </div>
  </div>`;
}

function Copione({ d, cfg, who, ops, goFlow }) {
  const [edit, setEdit] = useState(null);   // id | 'nuova'
  const send = (s, copioneId) => rilascia({ ...s, id: copioneId }, d, who, ops);
  const cfgCita = c => cfg.monitor_parole.some(p => ((c.testo || '') + ' ' + (c.voce || '')).toLowerCase().includes(p.toLowerCase()));
  const save = async (s, id) => {
    const row = { fase: s.fase, ordine: s.ordine, titolo: s.titolo.trim(), voce: s.voce.trim(), team_id: s.team_id, testo: s.testo, condizione: s.condizione, note: s.note, tipo: s.tipo || 'situazione', quando: (s.quando || '').trim() };
    const r = await ops.run(id ? sb.from('copione').update(row).eq('id', id) : sb.from('copione').insert(row), ['copione'], 'Salvata');
    if (!r.error) setEdit(null);
  };
  const { fase, scaletta, faseP, prossimo, pendente, statoBivio } = buildScaletta(d, cfg);
  const fatto = fattoCop;
  const ripristina = c => ops.run(sb.from('copione').update({ saltato_at: null }).eq('id', c.id), ['copione'], 'Di nuovo in scaletta');
  const vai = id => { const el = document.querySelector('[data-copione="' + id + '"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  const statoTxt = c => (fatto(c) ? '✓ ' : c.saltato_at ? '↷ ' : '') + (c.bivio && c.ramo ? 'B' + c.bivio + (c.ramo === 'si' ? ' sì · ' : ' no · ') : '');
  return html`<div className="page">
    <h2>Copione</h2>
    <p className="hint" style=${{ marginTop: '4px', maxWidth: '70ch' }}>Le situazioni e i post del monitor nell'ordine in cui rilasciarli, passo per passo. Le voci dello stesso passo partono insieme, oppure sono le versioni alternative di un bivio: segna la scelta in Sessione e quelle escluse si attenuano. «Invia ora» fa arrivare la situazione solo alla squadra indicata; «Mostra sul monitor» fa comparire post e notizie sullo schermo della stanza.</p>
    <div className="actions">
      <button id="btn-new-sit" className="btn" onClick=${() => setEdit('nuova')}>+ Nuova situazione o voce del monitor</button>
    </div>
    <details className="panel regia" id="scaletta" open=${true} style=${{ maxWidth: '980px' }}>
      <summary><b>Scaletta</b> <span className="hint">· tutto l'ordine di rilascio in una pagina${prossimo ? ' · prossimo: passo ' + prossimo + ' di ' + faseP : ''}</span></summary>
      ${scaletta.map(f => html`<div key=${f.fn} className="scaletta-fase">
        <h3>${f.fn}${f.fn === fase ? ' (in corso)' : ''}</h3>
        <ol className="scaletta">${f.ps.map(p => html`<li key=${p.n} className=${(p.items.some(pendente) ? '' : 'ok') + (f.fn === faseP && p.n === prossimo ? ' next' : '')}>
          <span className="pn">${p.n}</span>
          <div>${p.quando ? html`<div className="q">${p.quando}</div>` : null}
            <div className="its">${p.items.map(c => html`<button key=${c.id} type="button" className=${'it' + (statoBivio(c) === 'escluso' ? ' off' : '')} style=${{ '--c': c.tipo === 'monitor' ? '#C78A12' : who.teamColor(c.team_id) }}
              title=${(c.tipo === 'monitor' ? 'Monitor di ' : 'A ') + who.teamName(c.team_id)} onClick=${() => vai(c.id)}>${statoTxt(c)}${c.tipo === 'monitor' ? '▤ ' : ''}${c.titolo}</button>`)}</div></div>
        </li>`)}</ol></div>`)}
      <p className="hint">Colore: la stanza che la riceve (ocra = monitor). ✓ già rilasciata · ↷ saltata · B1 sì / B1 no: versione legata a un bivio · barrata: esclusa dalla scelta del bivio. Per rilasciare un passo alla volta usa la scheda Conduzione.</p>
    </details>
    <${MonitorRegia} d=${d} who=${who} ops=${ops}/>
    ${edit === 'nuova' ? html`<div className="cards"><${SituazioneForm} cfg=${cfg} who=${who} init=${{ fase: fase || EMPTY_SIT.fase }}
      onSave=${s => save(s)} onSend=${async s => { const r = await send(s); if (!r.error) setEdit(null); }} onCancel=${() => setEdit(null)}/></div>` : null}
    ${scaletta.map(({ fn, ps }) => {
      const card = c => { const sb_ = statoBivio(c); const isMon = c.tipo === 'monitor'; const fatto = isMon ? c.inviato_at : c.inviato_flow;
        return edit === c.id
          ? html`<${SituazioneForm} key=${c.id} init=${c} cfg=${cfg} who=${who} onSave=${s => save(s, c.id)} onCancel=${() => setEdit(null)}/>`
          : html`<div key=${c.id} className=${'card' + (fatto || c.saltato_at || sb_ === 'escluso' ? ' done' : '')} style=${{ '--c': isMon ? '#C78A12' : who.teamColor(c.team_id) }} data-copione=${c.id}>
            <div className="ch"><span className="t">${c.titolo}</span><span className="placard">${c.voce}</span><span>${isMon ? 'sul monitor di' : 'a'} ${who.teamName(c.team_id)}</span>
              ${c.saltato_at && !fatto ? html`<span className="tag">saltata alle ${ora(c.saltato_at)} · <button className="link" onClick=${() => ripristina(c)}>rimetti in scaletta</button></span>` : null}
              ${isMon && c.meta ? html`<span className="tag">${((CANALI_MEDIA.find(x => x[0] === c.meta.canale) || [])[1]) || 'Social'} · ${c.meta.sentiment || 'neutro'} · ${fmtPortata(c.meta.portata)}</span>` : null}
              ${isMon ? html`<span className=${'tag' + (cfgCita(c) ? ' warn' : '')}>${cfgCita(c) ? 'cita l\'azienda' : 'non cita l\'azienda'}</span>` : null}
              ${c.condizione ? html`<span className=${'tag' + (sb_ === 'attivo' ? '' : sb_ === 'escluso' ? '' : ' warn')}>${c.condizione}${sb_ === 'attivo' ? ' · da usare' : sb_ === 'escluso' ? ' · esclusa' : ''}</span>` : null}</div>
            <div className="x">${c.testo}</div>
            ${c.note ? html`<div className="note">Regia: ${c.note}</div>` : null}
            <div className="actions">
              ${isMon
                ? (c.inviato_at
                  ? html`<span className="hint">Sul monitor dalle ${ora(c.inviato_at)}</span>
                    <button className="btn plain small" onClick=${() => { if (window.confirm('Mostrarla di nuovo?')) send(c, c.id); }}>Mostra di nuovo</button>`
                  : html`<button className="btn send small" onClick=${() => send(c, c.id)}>Mostra sul monitor</button>`)
                : c.inviato_flow
                ? html`<span className="hint">Inviata alle ${ora((d.flows.find(f => f.id === c.inviato_flow) || {}).created_at)}</span>
                  <button className="btn plain small" onClick=${() => goFlow(c.inviato_flow)}>Apri</button>
                  <button className="btn plain small" onClick=${() => { if (window.confirm('Inviarla di nuovo?')) send(c, c.id); }}>Invia di nuovo</button>`
                : html`<button className="btn send small" onClick=${() => send(c, c.id)}>Invia ora</button>`}
              <button className="btn plain small" onClick=${() => setEdit(c.id)}>Modifica</button>
              <button className="btn plain small" onClick=${() => { if (window.confirm('Eliminare «' + c.titolo + '» dal copione?')) ops.run(sb.from('copione').delete().eq('id', c.id), ['copione'], 'Eliminata'); }}>Elimina</button>
            </div>
          </div>`; };
      return html`<section key=${fn}><h3 className="phase-h">${fn}${fn === fase ? ' (in corso)' : ''}</h3>
        ${ps.map(p => html`<div key=${p.n} className="passo">
          <h4 className="passo-h">Passo ${p.n}${p.quando ? html` <span className="hint">· ${p.quando}</span>` : null}
            ${fn === faseP && p.n === prossimo ? html` <span className="tag warn">prossimo</span>` : !p.items.some(pendente) ? html` <span className="tag">fatto</span>` : null}</h4>
          <div className="cards">${p.items.map(card)}</div>
        </div>`)}
      </section>`;
    })}
  </div>`;
}

/* Post liberi sul monitor e ciò che è già comparso, con la possibilità di toglierlo. */
function MonitorRegia({ d, who, ops }) {
  const defTeam = (who.teams.find(t => t.autorizza) || who.teams[0] || {}).id || '';
  const [team, setTeam] = useState(defTeam);
  const [fonte, setFonte] = useState('');
  const [testo, setTesto] = useState('');
  const [canale, setCanale] = useState('social');
  const [tono, setTono] = useState('negativo');
  const [portata, setPortata] = useState('');
  const items = d.monitor.slice().sort((a, b) => byTime(b, a));
  const add = async () => {
    const r = await ops.run(sb.from('monitor').insert({ team_id: team, fonte: fonte.trim() || 'Social', testo: testo.trim(), fase: (d.campaign && d.campaign.fase) || '',
      canale, sentiment: tono, portata: portata ? parseInt(portata, 10) || null : null }),
      ['monitor'], 'Sul monitor di ' + who.teamName(team));
    if (!r.error) { setTesto(''); }
  };
  return html`<details className="panel regia" style=${{ maxWidth: '980px' }}>
    <summary><b>Monitor delle stanze</b> <span className="hint">· ${items.length} voci mostrate · aggiungi un post fuori copione</span></summary>
    <div className="grid2">
      <${Field} label="Su quale monitor"><select id="mon-team" value=${team} onChange=${e => setTeam(e.target.value)}>${who.teams.map(t => html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}</select><//>
      <${Field} label="Fonte"><input id="mon-fonte" type="text" value=${fonte} placeholder="Per esempio: @utente · X, oppure il nome di una testata" onChange=${e => setFonte(e.target.value)}/><//>
      <${Field} label="Canale"><select id="mon-canale" value=${canale} onChange=${e => setCanale(e.target.value)}>${CANALI_MEDIA.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Tono"><select id="mon-tono" value=${tono} onChange=${e => setTono(e.target.value)}>${TONI.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Portata stimata" hint="Visualizzazioni o lettori; vuoto se non nota."><input id="mon-portata" type="number" value=${portata} onChange=${e => setPortata(e.target.value)}/><//>
    </div>
    <${Field} label="Testo"><textarea id="mon-testo" value=${testo} onChange=${e => setTesto(e.target.value)}></textarea><//>
    <div className="actions"><button id="mon-add" className="btn send small" disabled=${!team || !testo.trim()} onClick=${add}>Mostra sul monitor</button></div>
    ${items.length ? html`<div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Monitor</th><th>Fonte</th><th>Canale e tono</th><th>Testo</th><th></th></tr></thead><tbody>
      ${items.map(m => html`<tr key=${m.id}><td className="n">${ora(m.created_at)}</td><td>${who.teamName(m.team_id)}</td><td>${m.fonte}</td>
        <td>${((CANALI_MEDIA.find(x => x[0] === m.canale) || [])[1]) || 'Social'} · ${m.sentiment || 'neutro'}</td><td>${m.testo}</td>
        <td><button className="link" onClick=${() => { if (window.confirm('Togliere questa voce dal monitor?')) ops.run(sb.from('monitor').delete().eq('id', m.id), ['monitor'], 'Tolta dal monitor'); }}>Togli</button></td></tr>`)}
    </tbody></table></div>` : null}
  </details>`;
}

function Fiducia({ d, ops }) {
  const [motivo, setMotivo] = useState('');
  const [delta, setDelta] = useState('');
  const serie = fiduciaSerie(d.fiducia);
  const valore = serie.length ? serie[serie.length - 1].valore : 100;
  const fase = (d.campaign && d.campaign.fase) || '';
  const add = async n => {
    if (!n) return;
    const r = await ops.run(sb.from('fiducia').insert({ delta: n, motivo: motivo.trim(), fase }), ['fiducia'], 'Fiducia ' + (n > 0 ? '+' : '') + n);
    if (!r.error) { setMotivo(''); setDelta(''); }
  };
  return html`<div className="page">
    <h2>Fiducia dei clienti</h2>
    <p className="hint" style=${{ marginTop: '4px', maxWidth: '70ch' }}>Parte da 100 e si muove con la qualità delle comunicazioni e con gli impegni mantenuti. Le squadre non la vedono: se ne legge l'andamento nella discussione finale.</p>
    <div style=${{ display: 'flex', gap: '28px', alignItems: 'flex-end', flexWrap: 'wrap', marginTop: '16px' }}>
      <div><div className="big-num" id="fiducia-val">${valore}</div><span className="hint">su 100</span></div>
      <div style=${{ flex: '1', minWidth: '260px', maxWidth: '520px' }}>
        <${Field} label="Perché cambia"><input id="fiducia-motivo" type="text" value=${motivo} placeholder="Per esempio: avviso ai 41 clienti chiaro e puntuale" onChange=${e => setMotivo(e.target.value)}/><//>
        <div className="actions">
          ${[-10, -5, 5, 10].map(n => html`<button key=${n} className=${'btn small ' + (n < 0 ? 'no' : 'ok')} onClick=${() => add(n)}>${n > 0 ? '+' + n : n}</button>`)}
          <input type="number" style=${{ width: '90px' }} value=${delta} placeholder="±" onChange=${e => setDelta(e.target.value)}/>
          <button className="btn plain small" onClick=${() => add(parseInt(delta, 10) || 0)}>Applica</button>
        </div>
      </div>

    <div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Fase</th><th>Variazione</th><th>Valore</th><th>Motivo</th><th></th></tr></thead><tbody>
      ${serie.slice().reverse().map(x => html`<tr key=${x.id}><td className="n">${ora(x.created_at)}</td><td>${x.fase}</td><td className="n">${x.delta > 0 ? '+' : ''}${x.delta}</td><td>${x.valore}</td><td>${x.motivo}</td>
        <td><button className="link" onClick=${() => { if (window.confirm('Togliere questa variazione?')) ops.run(sb.from('fiducia').delete().eq('id', x.id), ['fiducia']); }}>Togli</button></td></tr>`)}
      ${!serie.length ? html`<tr><td colSpan="6" className="hint">Nessuna variazione.</td></tr>` : null}
    </tbody></table></div>
  </div>`;
}

function cronologia(d, who) {
  const flow = id => d.flows.find(f => f.id === id) || {};
  const rows = [];
  d.flow_events.forEach(e => { const f = flow(e.flow_id); rows.push({ t: e.created_at, fase: e.fase || faseAt(d.campaign_fasi, e.created_at), cosa: EVENTI[e.evento] || e.evento,
    squadra: e.team_id === 'regia' ? 'Regia' : who.teamName(e.team_id), chi: e.team_id === 'regia' && f.kind === 'situazione' ? f.voce : who.name(e.user_id),
    ruolo: (who.member(e.user_id) || {}).ruolo || '', flusso: f.titolo || '', verso: f.kind === 'esterna' ? destText(f) : '', tipo: KIND_LABEL[f.kind] || '',
    testo: e.evento === 'aperto' || e.evento === 'situazione' ? f.motivo : (e.nota || ''), team: e.team_id }); });
  d.messages.forEach(m => { const f = flow(m.flow_id); rows.push({ t: m.created_at, fase: faseAt(d.campaign_fasi, m.created_at), cosa: m.voce ? 'Risposta di una voce' : 'Messaggio',
    squadra: m.voce ? 'Regia' : who.teamName(m.team_id), chi: m.voce || who.name(m.author), ruolo: m.ruolo || '', flusso: f.titolo || '', verso: f.destinatario || '',
    tipo: KIND_LABEL[f.kind] || '', testo: m.testo, team: m.team_id || 'regia' }); });
  d.registro.forEach(r => rows.push({ t: r.created_at, fase: r.fase || '', cosa: 'Registro', squadra: who.teamName(r.team_id), chi: who.name(r.author), ruolo: r.ruolo || '',
    flusso: '', verso: '', tipo: 'Registro', testo: r.testo, team: r.team_id }));
  return rows.sort((a, b) => ms(a.t) - ms(b.t));
}

const mediaVal = v => { const xs = CRITERI.map(([k]) => v[k]).filter(Boolean); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
// per ogni comunicazione prevista: la prima versione preparata, autorizzata e inviata, con deleghe e media delle valutazioni
function previsteStato(d) {
  const valOf = f => d.valutazioni.find(v => v.flow_id === f.id) || {};
  return d.previste.slice().sort((a, b) => a.ordine - b.ordine).map(c => {
    const fs = d.flows.filter(f => f.kind !== 'situazione' && previstaDi(d, f) === c.id).sort(byTime);
    const aut = fs.filter(f => f.decided_at && f.stato !== 'respinto').sort((a, b) => ms(a.decided_at) - ms(b.decided_at))[0];
    const inv = fs.filter(f => f.inviato_at).sort((a, b) => ms(a.inviato_at) - ms(b.inviato_at))[0];
    const vs = fs.map(f => d.valutazioni.find(v => v.flow_id === f.id)).filter(Boolean).map(mediaVal).filter(x => x != null);
    const deleghe = fs.map(f => valOf(f).delega).filter(Boolean);
    return { c, fs, prep: fs[0], aut, inv, deleghe, media: vs.length ? (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1) : '' };
  });
}
function exportSessione(d) {
  download('sessione-' + new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-') + '.json', JSON.stringify({
    esportato: new Date().toISOString(), campaign: d.campaign, campaign_fasi: d.campaign_fasi, teams: d.teams, members: d.members, flows: d.flows,
    messages: d.messages, registro: d.registro, flow_events: d.flow_events, valutazioni: d.valutazioni, fiducia: d.fiducia, copione: d.copione,
    monitor: d.monitor, previste: d.previste, tappe: d.tappe, bivi: d.bivi, punti: d.punti, osservazioni: d.osservazioni }, null, 2), 'application/json');
}

/* Report finale per il cliente: si stampa o si salva in PDF dal browser, oppure si scarica per Word. */
const REPORT_CSS_WORD = 'body{font-family:Arial,sans-serif;font-size:11pt;color:#152030}h1{font-size:24pt}h2{font-size:15pt;border-bottom:2px solid #152030;margin-top:18pt}'
  + 'table{border-collapse:collapse;width:100%}th,td{border:1px solid #C8D0DA;padding:4px 6px;vertical-align:top;font-size:9.5pt;text-align:left}th{background:#EEF1F4}.hint{color:#5A6576}';
// eventi della sessione per corsia (scenario o squadra), con il tipo: servono al report e alla revisione in plenaria
function reportEventi(d, who, opz) {
  opz = opz || {};
  const ev = [];
  const add = (t, lane, testo, k, extra) => { if (t) ev.push({ t, lane, testo, k, ...extra }); };
  d.campaign_fasi.forEach(s => add(s.created_at, 'scenario', 'Inizia ' + s.fase + (s.tempo_sim ? ' (' + s.tempo_sim + ')' : ''), 'fase'));
  d.tappe.forEach(t => add(t.at, 'scenario', 'Tappa: ' + t.nome, 'tappa'));
  d.flows.forEach(f => {
    if (f.kind === 'situazione' && !f.richiesta) { add(f.created_at, 'scenario', f.voce + ' → ' + who.teamName(f.to_team) + ': ' + f.titolo, 'situazione', { voce: f.voce, titolo: f.titolo, dettaglio: f.motivo }); return; }
    if (f.kind === 'situazione') { add(f.created_at, f.to_team, 'Scrive a ' + f.voce + ': ' + f.titolo, 'richiesta', { titolo: f.titolo, dettaglio: f.motivo }); return; }
    if (f.kind === 'canale') {
      add(f.created_at, f.from_team, (f.tipo === 'Informativa' ? 'Informativa a ' : 'Richiesta a ') + who.teamName(f.to_team) + ': ' + f.titolo, f.tipo === 'Informativa' ? 'informativa' : 'richiesta', { titolo: f.titolo, dettaglio: f.motivo });
      if (f.decided_at && f.tipo !== 'Informativa') add(f.decided_at, f.to_team, (f.stato === 'respinto' ? 'Respinge: ' : 'Approva: ') + f.titolo, 'decisione', { titolo: f.titolo, dettaglio: f.nota_decisione });
      return;
    }
    if (!f.diretta) add(f.created_at, f.from_team, 'Prepara «' + f.titolo + '» per ' + destText(f), 'prepara', { titolo: f.titolo, dettaglio: f.motivo });
    if (f.decided_at && !f.diretta) add(f.decided_at, f.to_team || f.from_team, (f.stato === 'respinto' ? 'Non autorizza: ' : 'Autorizza: ') + f.titolo, 'decisione', { titolo: f.titolo, dettaglio: f.nota_decisione });
    if (f.inviato_at) add(f.inviato_at, f.from_team, (f.diretta ? 'Invia senza autorizzazione «' : 'Invia «') + f.titolo + '» a ' + destText(f), 'invio', { titolo: f.titolo, dettaglio: f.motivo, warn: !!f.diretta });
    if (f.informata_at) add(f.informata_at, f.from_team, 'Informa ' + who.teamName(f.to_team) + ' dell\'invio «' + f.titolo + '»', 'informativa');
  });
  d.registro.forEach(r => add(r.created_at, r.team_id, ((who.team(r.team_id) || {}).autorizza ? 'Log: ' : 'Registro: ') + r.testo, 'registro'));
  if (opz.media) d.monitor.forEach(m => add(m.created_at, 'scenario', m.fonte + ': ' + m.testo, 'media', { canale: m.canale }));
  if (opz.note) d.osservazioni.forEach(o => add(o.created_at, o.team_id || 'scenario', 'Osservato: ' + o.testo, 'nota'));
  return ev.sort((a, b) => ms(a.t) - ms(b.t));
}

/* Revisione in plenaria: la sessione rivista un evento alla volta, con le corsie delle stanze affiancate. */
const CHIAVE = ['fase', 'tappa', 'situazione', 'decisione', 'invio', 'informativa'];
const TIPO_EV = { fase: 'Fase', tappa: 'Tappa', situazione: 'Situazione', richiesta: 'Richiesta', informativa: 'Informativa', decisione: 'Decisione',
  prepara: 'Prepara', invio: 'Invio', registro: 'Registro', media: 'Media', nota: 'Osservazione' };
function Replay({ d, cfg, who, onClose }) {
  const [soloChiave, setSoloChiave] = useState(false);
  const [media, setMedia] = useState(true);
  const [note, setNote] = useState(false);
  const [i, setI] = useState(0);
  const [play, setPlay] = useState(false);
  const tutti = reportEventi(d, who, { media, note });
  const ev = soloChiave ? tutti.filter(e => CHIAVE.includes(e.k)) : tutti;
  const n = ev.length;
  const cur = ev[Math.min(i, n - 1)];
  const vai = j => setI(Math.max(0, Math.min(n - 1, j)));
  useEffect(() => { if (i > n - 1) setI(Math.max(0, n - 1)); }, [n]);
  useEffect(() => {
    if (!play) return;
    const t = setInterval(() => setI(x => { if (x >= n - 1) { setPlay(false); return x; } return x + 1; }), 3500);
    return () => clearInterval(t);
  }, [play, n]);
  useEffect(() => {
    const k = e => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); setI(x => Math.min(n - 1, x + 1)); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); setI(x => Math.max(0, x - 1)); }
      else if (e.key === 'Home') setI(0);
      else if (e.key === 'End') setI(n - 1);
    };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  }, [n]);
  const lanes = [['scenario', 'Scenario e media', '#7D8FA3']].concat(who.teams.map(t => [t.id, t.nome, t.colore]));
  const storico = d.campaign_fasi.slice().sort(byTime);
  const tempoA = ts => { let s = ''; storico.forEach(x => { if (ms(x.created_at) <= ms(ts)) s = x.tempo_sim || s; }); return s; };
  const visti = ev.slice(0, i + 1);
  return ReactDOM.createPortal(html`<div className="replay" role="dialog" aria-label="Revisione della sessione">
    <header className="rp-head">
      <div><div className="rp-t">Rivediamo la sessione</div><div className="rp-sub">${cfg.titolo}</div></div>
      ${cur ? html`<div className="rp-clock"><div className="f">${faseAt(d.campaign_fasi, cur.t) || 'Prima dell\'avvio'}${tempoA(cur.t) ? ' · ' + tempoA(cur.t) : ''}</div><div className="t">${ora(cur.t)}</div></div>` : null}
    </header>
    <div className="rp-bar">
      <button className="btn-light" disabled=${i <= 0} onClick=${() => vai(i - 1)}>← Indietro</button>
      <button id="rp-play" className="btn-light" aria-pressed=${play} onClick=${() => setPlay(!play)}>${play ? 'Pausa' : 'Riproduci'}</button>
      <button id="rp-next" className="btn-light" disabled=${i >= n - 1} onClick=${() => vai(i + 1)}>Avanti →</button>
      <input type="range" min="0" max=${Math.max(0, n - 1)} value=${Math.min(i, Math.max(0, n - 1))} aria-label="Posizione nella sessione" onChange=${e => vai(Number(e.target.value))}/>
      <span className="rp-n">${n ? Math.min(i, n - 1) + 1 : 0} / ${n}</span>
      <label><input type="checkbox" checked=${soloChiave} onChange=${e => { setSoloChiave(e.target.checked); setI(0); }}/> Solo i momenti chiave</label>
      <label><input type="checkbox" checked=${media} onChange=${e => setMedia(e.target.checked)}/> Media</label>
      <label><input type="checkbox" checked=${note} onChange=${e => setNote(e.target.checked)}/> Note di regia</label>
      <span style=${{ flex: 1 }}></span>
      <button className="btn-light" onClick=${onClose}>Chiudi · Esc</button>
    </div>
    ${n ? html`<div className="rp-grid" style=${{ gridTemplateColumns: 'repeat(' + lanes.length + ', minmax(0, 1fr))' }}>
      ${lanes.map(([k, nome, col]) => { const qui = visti.filter(e => e.lane === k).slice(-5);
        return html`<section key=${k} className="rp-lane" style=${{ '--c': col }}>
          <h3>${nome}</h3>
          ${qui.map(e => { const attuale = e === cur;
            return html`<div key=${ms(e.t) + e.testo} className=${'rp-ev k-' + e.k + (attuale ? ' cur' : '') + (e.warn ? ' warn' : '')}>
              <div className="h"><span className="tp">${TIPO_EV[e.k] || ''}</span><time>${ora(e.t)}</time></div>
              <div className="x">${e.testo}</div>
              ${attuale && e.dettaglio ? html`<div className="det">${e.dettaglio}</div>` : null}
            </div>`; })}
        </section>`; })}
    </div>` : html`<p style=${{ padding: '30px 36px', color: '#8FA0B3' }}>Nessun evento da rivedere.</p>`}
    <p className="rp-help">Frecce o barra spaziatrice per scorrere · Esc per uscire</p>
  </div>`, document.body);
}
function ReportView({ d, cfg, who, onClose }) {

  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    const fine = () => document.body.classList.remove('printing');

    return () => { document.removeEventListener('keydown', k); window.removeEventListener('afterprint', fine); fine(); };
  }, []);
  const storico = d.campaign_fasi.slice().sort(byTime);
  const ev = reportEventi(d, who);
  const inizio = storico.length ? storico[0].created_at : (ev[0] || {}).t;
  const fine = ev.length ? ev[ev.length - 1].t : null;

  const criteri = CRITERI.map(([k, l]) => { const xs = d.valutazioni.map(v => v[k]).filter(Boolean); return [l, xs.length ? (xs.reduce((a, b) => a + b, 0) / xs.length).toFixed(1) : '—', xs.length]; });
  const previste = previsteStato(d);

  const conFase = ts => ts ? ora(ts) + ' · ' + (faseBreve(faseAt(d.campaign_fasi, ts)) || '') : '';
  const lanes = [['scenario', 'Scenario']].concat(who.teams.map(t => [t.id, t.nome]));
  const stampa = () => { document.body.classList.add('printing'); setTimeout(() => window.print(), 60); };
  const word = () => {
    const el = document.getElementById('report');
    download('report-' + (cfg.azienda || 'esercitazione').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.doc',

        <div><b>${serie.length ? serie[serie.length - 1].valore : 100}</b><span>fiducia dei clienti a fine sessione</span></div>
      </div>

      <h2>Chi ha partecipato</h2>
      <table><thead><tr>${who.teams.map(t => html`<th key=${t.id}>${t.nome}</th>`)}</tr></thead><tbody><tr>
        ${who.teams.map(t => html`<td key=${t.id}>${d.members.filter(m => m.team_id === t.id).sort((a, b) => a.nome.localeCompare(b.nome)).map(m => html`<div key=${m.user_id}>${m.nome}${m.ruolo ? html` <span className="hint">— ${m.ruolo}</span>` : null}</div>`)}</td>`)}
      </tr></tbody></table>

      ${tappe.length ? html`<h2>Tempi del piano incidenti</h2>

        </tbody></table>` : null}

      ${bivi.length ? html`<h2>I momenti decisivi</h2>

          ${bivi.map(b => html`<tr key=${b.numero}><td>${b.numero}. ${b.titolo}</td><td>${b.scelta === 'si' ? 'Sì' : b.scelta === 'no' ? 'No' : 'Non segnato'}</td><td>${b.scelta === 'si' ? b.si : b.scelta === 'no' ? b.no : ''}</td></tr>`)}

      ${previste.length ? html`<h2>Comunicazioni attese e comunicazioni fatte</h2>

          ${previste.map(p => html`<tr key=${p.c.id}><td>${p.c.tipo}</td><td>${p.c.destinatario}</td><td>${p.c.termine}</td>
            <td>${p.prep ? conFase(p.prep.created_at) : 'mai'}</td><td>${p.aut && !p.aut.diretta ? conFase(p.aut.decided_at) : p.inv && p.inv.diretta ? 'senza autorizzazione' : ''}</td>
            <td>${p.inv ? conFase(p.inv.inviato_at) : p.prep && p.prep.kind === 'esterna' ? 'non inviata' : ''}</td><td>${p.media}</td></tr>`)}

      ${autonome.length ? html`<h2>Invii in autonomia e informative</h2>
        <table><thead><tr><th>Inviata</th><th>Da</th><th>Comunicazione</th><th>A</th><th>Informativa all'altra stanza</th></tr></thead><tbody>
          ${autonome.map(f => html`<tr key=${f.id}><td>${conFase(f.inviato_at)}</td><td>${who.teamName(f.from_team)}</td><td>${f.titolo}${f.diretta ? ' (senza autorizzazione)' : ''}</td><td>${destText(f)}</td>
            <td>${f.informata_at ? ora(f.informata_at) + ', dopo ' + durata(f.inviato_at, f.informata_at) : 'non inviata'}</td></tr>`)}
        </tbody></table>` : null}

      ${vals.length ? html`<h2>Qualità delle comunicazioni</h2>
        <table><thead><tr><th>Criterio</th><th>Media (1–5)</th><th>Comunicazioni valutate</th></tr></thead><tbody>
          ${criteri.map(([l, m, n]) => html`<tr key=${l}><td>${l}</td><td>${m}</td><td>${n}</td></tr>`)}
        </tbody></table>` : null}

      ${serie.length ? html`<h2>Fiducia dei clienti</h2><${FiduciaChart} serie=${serie}/>` : null}

      <h2>Punti di miglioramento</h2>
      ${(puntiPieni.length ? puntiPieni : punti).map(({ p, note }) => html`<div key=${p.id} style=${{ marginTop: '12px', breakInside: 'avoid' }}>
        <h3>${p.ordine}. ${p.punto}</h3>${p.dove ? html`<p className="hint">${p.dove}</p>` : null}

        ${note.length ? html`<p style=${{ marginTop: '4px' }}><b>Osservato in sala:</b> ${note.map(o => ora(o.created_at) + ' ' + o.testo).join(' · ')}</p>` : null}

      ${libere.length ? html`<h3 style=${{ marginTop: '16px' }}>Altre osservazioni</h3><ul>${libere.map(o => html`<li key=${o.id}>${ora(o.created_at)}${o.team_id ? ' · ' + who.teamName(o.team_id) : ''} — ${o.testo}</li>`)}</ul>` : null}

      </tbody></table>` : html`<p className="hint">Nessun evento registrato.</p>`}
    </article>
  </div>`, document.body);
}

  ['cronologia', ['id'], {}],
  ['deleghe', ['id'], {}],
  ['copione', ['id', 'created_at', 'inviato_flow', 'inviato_at', 'saltato_at'], {}],
];
// per svuotare una tabella serve un filtro che prenda tutte le righe
const TUTTE = { bivi: q => q.gte('numero', -1000000), tappe: q => q.not('chiave', 'is', null), attori: q => q.not('nome', 'is', null) };
function pacchettoScenario(d) {
  const cfg = (d.campaign && d.campaign.config) || {};
  const pulisci = (rows, via, azzera) => rows.map(r => { const x = { ...r, ...azzera }; via.forEach(k => { delete x[k]; }); return x; });
  return { formato: 'portale-tabletop-scenario', versione: 1, esportato: new Date().toISOString(), titolo: cfg.titolo || '', config: cfg,
    teams: d.teams.map(t => ({ id: t.id, nome: t.nome, colore: t.colore, autorizza: !!t.autorizza, ordine: t.ordine || 0 })),
    tabelle: Object.fromEntries(PACCHETTO.map(([t, via, az]) => [t, pulisci(d[t] || [], via, az)])) };
}
const nomeFile = s => (s || 'scenario').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function ScenarioPacchetto({ d, ops, load }) {
  const [busy, setBusy] = useState(false);
  const scarica = () => { const p = pacchettoScenario(d); download('scenario-' + nomeFile(p.titolo) + '.json', JSON.stringify(p, null, 2), 'application/json'); };
  const carica = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    let p;
    try { p = JSON.parse(await file.text()); } catch (er) { ops.say('Il file non è un JSON leggibile.', 'err'); return; }
    if (!p || p.formato !== 'portale-tabletop-scenario' || !p.tabelle || !Array.isArray(p.teams)) { ops.say('Il file non è uno scenario esportato dal portale.', 'err'); return; }
    if (d.flows.length || d.registro.length) { ops.say('Prima azzera la simulazione: la sessione in corso fa riferimento allo scenario attuale.', 'err'); return; }
    const conta = PACCHETTO.map(([t]) => (p.tabelle[t] || []).length);
    if (!window.confirm('Caricare «' + (p.titolo || file.name) + '»?\n\nSostituisce copione (' + conta[7] + ' voci), comunicazioni previste, attori, punti dei piani, tappe, bivi, cronologia e deleghe, e aggiorna squadre e configurazione. Prima scarico una copia dello scenario attuale.')) return;
    scarica();
    setBusy(true);
    const passi = [
      sb.from('teams').upsert(p.teams.map(t => ({ id: t.id, nome: t.nome, colore: t.colore, autorizza: !!t.autorizza, ordine: t.ordine || 0 }))),
      sb.from('campaign').update({ config: p.config || {} }).eq('id', 1),
    ];
    // si svuota in ordine inverso (il copione prima dei bivi) e si riempie nell'ordine del pacchetto
    PACCHETTO.slice().reverse().forEach(([t]) => passi.push((TUTTE[t] || (q => q.gte('id', 0)))(sb.from(t).delete())));
    PACCHETTO.forEach(([t]) => { const rows = p.tabelle[t] || []; if (rows.length) passi.push(sb.from(t).insert(rows)); });
    for (const q of passi) { const r = await ops.run(q); if (r.error) { setBusy(false); T_ALL.concat(T_MASTER).forEach(load); return; } }
    setBusy(false);
    T_ALL.concat(T_MASTER).forEach(load);
    ops.say('Scenario caricato: «' + (p.titolo || file.name) + '»');
  };
  return html`<div className="section panel" style=${{ borderLeft: '5px solid var(--inviato)' }}>
    <h3>Scenario come pacchetto</h3>
    <p className="hint">Un solo file con copione, comunicazioni previste, attori, punti dei piani, tappe, bivi, cronologia, deleghe, squadre e configurazione: per rigiocare lo scenario con un altro gruppo o portarlo in un altro portale. Contiene materiale riservato: conservalo come i documenti dello scenario e non pubblicarlo.</p>
    <div className="actions">
      <button id="btn-scarica-scenario" className="btn plain" onClick=${scarica}>Scarica lo scenario</button>
      <label className=${'btn plain' + (busy ? ' disabled' : '')} style=${{ cursor: 'pointer' }}>${busy ? 'Caricamento…' : 'Carica uno scenario'}
        <input id="file-scenario" type="file" accept="application/json,.json" style=${{ display: 'none' }} disabled=${busy} onChange=${carica}/></label>
    </div>
    <p className="hint" style=${{ marginTop: '6px' }}>Il caricamento è possibile solo a simulazione azzerata. Codici d'ingresso e partecipanti restano quelli attuali.</p>
  </div>`;
}

const lines = a => a.join('\n');
const unlines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const COLORI_SQUADRA = ['#3B2F8F', '#0B6F6A', '#9A3412', '#1D4ED8', '#7E22CE', '#B45309', '#BE185D', '#15803D'];
function Impostazioni({ d, cfg, ops, load }) {

  const caricaLogo = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';

  const [squadre, setSquadre] = useState(() => who.teams.map(t => ({
    id: t.id, nome: t.nome || '', colore: t.colore || '#5A6576', autorizza: !!t.autorizza, code: codeOf(t.id), ruoli: lines(cfg.ruoli[t.id] || []) })));
  const set = k => e => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const setSq = (i, k) => e => setSquadre(squadre.map((s, j) => j === i ? { ...s, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value } : s));
  const aggiungi = () => {
    const usati = new Set(squadre.map(s => s.id));
    const id = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(c => !usati.has(c)) || ('T' + (squadre.length + 1));
    setSquadre(squadre.concat([{ id, nome: 'Squadra ' + id, colore: COLORI_SQUADRA[squadre.length % COLORI_SQUADRA.length], autorizza: false, code: '', ruoli: '' }]));
  };
  const togli = i => {
    const s = squadre[i];
    const n = d.members.filter(m => m.team_id === s.id).length;
    if (n) { ops.say(s.nome + ' ha ' + n + ' partecipanti: spostali in un\'altra squadra prima di toglierla.', 'err'); return; }
    if (d.flows.some(x => x.from_team === s.id || x.to_team === s.id) || d.registro.some(r => r.team_id === s.id)) {
      ops.say(s.nome + ' ha già flussi o voci di registro: azzera la simulazione prima di toglierla.', 'err'); return;
    }
    setSquadre(squadre.filter((_, j) => j !== i));
  };
  const save = async () => {
    const nomi = squadre.map(s => s.nome.trim());
    if (!squadre.length) { ops.say('Serve almeno una squadra.', 'err'); return; }
    if (nomi.some(n => !n)) { ops.say('Ogni squadra deve avere un nome.', 'err'); return; }
    const codici = squadre.map(s => s.code.trim().toUpperCase()).filter(Boolean);
    if (new Set(codici).size !== codici.length) { ops.say('Due squadre hanno lo stesso codice: ogni codice deve essere diverso.', 'err'); return; }
    if (f.codiceOss.trim() && codici.includes(f.codiceOss.trim().toUpperCase())) { ops.say('Il codice degli osservatori deve essere diverso da quelli delle squadre.', 'err'); return; }
    const raw = d.campaign && d.campaign.config ? d.campaign.config : {};
    const config = normCfg({ ...raw, titolo: f.titolo, ruoli: Object.fromEntries(squadre.map(s => [s.id, unlines(s.ruoli)])), tipi_canale: unlines(f.tipi),
      destinatari: unlines(f.destinatari), voci: unlines(f.voci),
      fasi: unlines(f.fasi).map(l => { const [nome, tempo, dur] = l.split('|').map(x => x.trim()); return { nome, tempo: tempo || '', durata: parseInt(dur, 10) || 0 }; }),
      tipi_esterni: unlines(f.tipiEst), canali: unlines(f.canali), azienda: (f.azienda || '').trim(), monitor_parole: unlines(f.parole),
      logo: f.logo || '', colore: f.colore && f.colore.toLowerCase() !== '#152030' ? f.colore : '' });
    const tolte = d.teams.filter(t => !squadre.some(s => s.id === t.id)).map(t => t.id);
    const errs = [];
    const ops_ = [
      sb.from('campaign').update({ config }).eq('id', 1),
      sb.from('teams').upsert(squadre.map((s, i) => ({ id: s.id, nome: s.nome.trim(), colore: s.colore, autorizza: s.autorizza, ordine: i + 1 }))),
      sb.from('settings').update({ codice_osservatori: f.codiceOss.trim() }).eq('id', 1),
    ];
    // prima si liberano i codici cambiati, poi si scrivono quelli nuovi (il codice è unico tra le squadre)
    const senzaCodice = squadre.filter(s => !s.code.trim()).map(s => s.id);
    if (senzaCodice.length) ops_.push(sb.from('team_codes').delete().in('team_id', senzaCodice));
    for (const p of ops_) { const r = await ops.run(p); if (r.error) errs.push(r.error); }
    if (!errs.length && tolte.length) { const r = await ops.run(sb.from('teams').delete().in('id', tolte)); if (r.error) errs.push(r.error); }
    if (!errs.length) {
      const conCodice = squadre.filter(s => s.code.trim());
      if (conCodice.length) {
        const r0 = await ops.run(sb.from('team_codes').delete().in('team_id', conCodice.map(s => s.id)));
        if (r0.error) errs.push(r0.error);
        else { const r = await ops.run(sb.from('team_codes').insert(conCodice.map(s => ({ team_id: s.id, code: s.code.trim() })))); if (r.error) errs.push(r.error); }

    if ((window.prompt('Per confermare scrivi AZZERA') || '').trim().toUpperCase() !== 'AZZERA') return;
    // prima di cancellare, una copia completa della sessione finisce nei download
    exportSessione(d);
    const z = '00000000-0000-0000-0000-000000000000';
    for (const p of [sb.from('flows').delete().neq('id', z), sb.from('registro').delete().gte('id', 0), sb.from('fiducia').delete().gte('id', 0),
      sb.from('campaign_fasi').delete().gte('id', 0), sb.from('monitor').delete().gte('id', 0), sb.from('osservazioni').delete().gte('id', 0),
      sb.from('copione').update({ inviato_at: null }).not('inviato_at', 'is', null), sb.from('copione').update({ saltato_at: null }).not('saltato_at', 'is', null),
      sb.from('bivi').update({ scelta: null }).not('scelta', 'is', null),
      sb.from('tappe').update({ at: null }).not('at', 'is', null)]) { const r = await ops.run(p); if (r.error) return; }
    await ops.run(sb.rpc('set_fase', { p_fase: cfg.fasi[0].nome, p_tempo: cfg.fasi[0].tempo }));
    T_ALL.concat(T_MASTER).forEach(load);
    ops.say('Simulazione azzerata: la copia di sicurezza è nei download');
  };
  const team = (s, i) => html`<div key=${s.id} className="card" style=${{ '--c': s.colore }} data-team=${s.id}>
    <div className="grid2">
      <${Field} label="Nome della squadra"><input type="text" value=${s.nome} onChange=${setSq(i, 'nome')}/><//>
      <${Field} label="Codice per entrare" hint=${s.code.trim() ? null : 'Senza codice nessuno può entrare in questa squadra.'}><input type="text" value=${s.code} onChange=${setSq(i, 'code')}/><//>
    </div>
    <div className="actions"><label style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="color" value=${s.colore} onChange=${setSq(i, 'colore')}/> Colore</label>
      <label style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="checkbox" checked=${s.autorizza} onChange=${setSq(i, 'autorizza')}/> Autorizza le comunicazioni esterne</label>
      <span style=${{ flex: 1 }}></span>
      <button className="btn plain small" onClick=${() => togli(i)}>Togli la squadra</button></div>
    <${Field} label="Ruoli del piano (uno per riga)"><textarea value=${s.ruoli} onChange=${setSq(i, 'ruoli')}></textarea><//>

    <div className="grid2">
      <div className="field"><span className="lab">Logo del cliente</span>

          ${f.logo ? html`<img src=${f.logo} alt="Logo" style=${{ height: '40px', maxWidth: '160px', objectFit: 'contain', border: '1px solid var(--line)', borderRadius: '4px', padding: '2px', background: '#fff' }}/>` : null}
          <label className="btn plain small" style=${{ cursor: 'pointer' }}>${f.logo ? 'Cambia' : 'Carica un\'immagine'}<input id="logo-file" type="file" accept="image/*" style=${{ display: 'none' }} onChange=${caricaLogo}/></label>

      <${Field} label="Voci del facilitatore"><textarea value=${f.voci} onChange=${set('voci')}></textarea><//>

}

function App() {
  const [session, setSession] = useState(undefined);
  const [role, setRole] = useState(null);
  const [recupero, setRecupero] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession((data && data.session) || null));
    const { data } = sb.auth.onAuthStateChange((e, s) => { setSession(s || null); if (e === 'PASSWORD_RECOVERY') setRecupero(true); });
    return () => data.subscription.unsubscribe();
  }, []);
  const uid = session && session.user && session.user.id;
  const resolve = useCallback(async () => {
    if (!uid) { setRole(null); return; }
    const m = await sb.rpc('is_master');
    if (m.error) { setRole({ kind: 'error', msg: errMsg(m.error) }); return; }
    if (m.data === true) { setRole({ kind: 'master' }); return; }
    const r = await sb.from('members').select('*').eq('user_id', uid).maybeSingle();
    if (r.error) { setRole({ kind: 'error', msg: errMsg(r.error) }); return; }
    if (r.data) { setRole({ kind: 'member' }); return; }
    const o = await sb.from('osservatori').select('*').eq('user_id', uid).maybeSingle();
    setRole({ kind: !o.error && o.data ? 'observer' : 'join', nome: o.data && o.data.nome });
  }, [uid]);
  useEffect(() => { setRole(null); resolve(); }, [uid]);
  const logout = async () => { await sb.auth.signOut(); setSession(null); };

  if (!CONFIGURATO) return html`<div className="gate"><div className="gate-box doc"><h2>Manca la configurazione</h2>
    <p style=${{ marginTop: '8px' }}>In testa al file index.html vanno inseriti l'URL del progetto Supabase e la chiave publishable.</p></div></div>`;
  if (session === undefined) return html`<${Loading}/>`;
  if (!session) return html`<${Login}/>`;
  // arrivati dal link di recupero: prima si sceglie la nuova password
  if (recupero) return html`<div className="gate"><div className="gate-box"><div className="doc">
    <${NuovaPassword} titolo="Scegli la nuova password" onDone=${() => { setRecupero(false); history.replaceState(null, '', location.pathname); }}/></div></div></div>`;
  if (!role) return html`<${Loading}/>`;
  if (role.kind === 'error') return html`<div className="gate"><div className="gate-box doc"><h2>Qualcosa non va</h2><p style=${{ marginTop: '8px' }}>${role.msg}</p>
    <div className="actions"><button className="btn" onClick=${resolve}>Riprova</button><button className="btn plain" onClick=${logout}>Esci</button></div></div></div>`;
  if (role.kind === 'join') return html`<${Join} onDone=${resolve} onLogout=${logout}/>`;
  if (role.kind === 'master') return html`<${Regia} user=${session.user} onLogout=${logout}/>`;
  if (role.kind === 'observer') return html`<${ObserverHome} user=${session.user} nome=${role.nome} onLogout=${logout}/>`;
  return html`<${MemberHome} user=${session.user} onLogout=${logout}/>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
