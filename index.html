<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Esercitazione tabletop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#152030; --muted:#5A6576; --line:#D0D7E0; --soft:#E2E7ED; --hover:#F5F7F9; --selbg:#E6ECF4;
  --attesa:#A15F00; --ok:#2A7634; --no:#B3261E; --inviato:#1656AE; --chiuso:#717D8E;
  --voce:#FFF6E0; --r:6px;
  font-family:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color:var(--ink); background:var(--bg);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg)}
body{font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--inviato);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
h2{font-stretch:80%;font-size:24px;line-height:1.15}
h3{font-size:16px}
p{margin:0}
.hint{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.link{background:none;border:0;padding:0;color:var(--inviato);text-decoration:underline;font-weight:600}

/* banda della squadra */
.band{--team:#152030;background:var(--team);color:#fff;display:grid;grid-template-columns:1fr auto auto;gap:10px 28px;align-items:end;padding:16px 22px 14px}
.band-team{font-stretch:62%;font-weight:800;font-size:clamp(32px,5.4vw,54px);line-height:.88;letter-spacing:-.005em}
.band-sub{font-size:13px;opacity:.82;margin-top:7px}
.clock{text-align:right;min-width:0}
.clock .fase{display:block;font-stretch:72%;font-weight:700;font-size:21px;line-height:1.1}
.clock .tempo{display:block;font-size:13.5px;opacity:.85;margin-top:2px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-light{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:var(--r);padding:6px 11px;font-size:14px;text-align:left;line-height:1.2}
.btn-light:hover{background:rgba(255,255,255,.12)}
.btn-light small{display:block;opacity:.8;font-size:12px}
.btn-light[aria-pressed=true]{background:#fff;color:var(--team,#152030);border-color:#fff;font-weight:700}
.preview-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.6);border-radius:3px;padding:3px 8px}

/* schede */
.tabs{display:flex;gap:2px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--team,var(--ink))}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--no);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.notice{background:#FFF1D6;border-bottom:1px solid #EBD3A0;padding:9px 22px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* scrivania: elenco + dettaglio */
.work{display:grid;grid-template-columns:minmax(290px,390px) 1fr;min-height:calc(100vh - 150px)}
.list{border-right:1px solid var(--line);background:var(--paper);overflow:auto;max-height:calc(100vh - 150px)}
.list-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--soft);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:1}
.detail{overflow:auto;padding:22px 28px 60px;max-height:calc(100vh - 150px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.sec{font-size:13px;font-weight:700;color:var(--muted);padding:12px 16px 6px;background:var(--bg);border-bottom:1px solid var(--soft);display:flex;justify-content:space-between}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);background:none;padding:11px 34px 11px 18px;position:relative}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail,#98A2B0)}
.row:hover{background:var(--hover)}
.row[aria-current=true]{background:var(--selbg)}
.row .t{font-weight:600;display:block;line-height:1.3}
.row .m{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:5px}
.row .unread{width:9px;height:9px;border-radius:50%;background:var(--inviato);position:absolute;right:14px;top:15px}
.back{display:none;margin-bottom:12px}

/* timbri di stato */
.stamp{display:inline-block;border:1.5px solid currentColor;border-radius:3px;padding:0 6px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.5}
.st-in_attesa{color:var(--attesa)} .st-approvato{color:var(--ok)} .st-respinto{color:var(--no)}
.st-inviato{color:var(--inviato)} .st-chiuso{color:var(--chiuso)} .st-aperto{color:var(--ink)}
.placard{display:inline-block;background:var(--ink);color:#fff;font-stretch:75%;font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:2px;letter-spacing:.01em}
.tag{display:inline-block;background:var(--soft);border-radius:3px;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.tag.warn{background:#FCE8D2;color:#8A4B00}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chips label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff;font-size:13.5px;cursor:pointer}
.chips label.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips label input{position:absolute;opacity:0;pointer-events:none}
.chips label.ccn{background:#5A6576;border-color:#5A6576;border-style:dashed}
.chips label small{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.monitor{background:#0E141C;color:#E8EDF3;min-height:calc(100vh - 150px);padding:22px 28px 60px}
.monitor.full{position:fixed;inset:0;z-index:30;min-height:100vh;overflow:auto;padding:36px 48px}
.monitor-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.monitor-head h2{font-stretch:70%;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.monitor .item{border-left:5px solid #C78A12;background:#17202B;border-radius:0 6px 6px 0;padding:14px 18px;margin-bottom:12px;max-width:980px}
.monitor .item .src{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#F0B44C;display:flex;gap:12px;justify-content:space-between}
.monitor .item .src time{color:#8FA0B3;font-weight:600}
.monitor .item .x{font-size:20px;line-height:1.4;margin-top:6px}
.monitor.full .item .x{font-size:28px}
.monitor .item.new{animation:mon 1.4s ease-out}
@keyframes mon{from{background:#3A2C10}to{background:#17202B}}
.chips label:focus-within{outline:2px solid var(--inviato);outline-offset:2px}
.chips .grp{width:100%;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.mode{display:grid;gap:8px;margin-top:12px}
.mode label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:#fff}
.mode label.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode small{display:block;color:var(--muted);font-size:12.5px}
.panel.info{border-left:5px solid var(--attesa)}

/* fascicolo */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px 20px;max-width:780px}
.doc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.doc h2{margin:8px 0 6px}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.route .dot{width:10px;height:10px;border-radius:2px;background:var(--c)}
.route .arr{color:var(--muted)}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.meta dt{font-weight:600}
.meta dd{margin:0;color:var(--ink)}
.body{white-space:pre-wrap;line-height:1.6;border-top:1px solid var(--soft);padding-top:14px;margin-top:12px;max-width:72ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 16px;max-width:780px;margin-top:14px}
.panel h3{margin-bottom:4px}
.panel.decide{border-left:5px solid var(--attesa)}
.panel.send{border-left:5px solid var(--inviato)}
.panel.regia{border-left:5px solid var(--ink);background:#FAFBFC}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* moduli */
.field{display:block;margin-top:12px}
.field .lab{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.field .hint{display:block;margin-top:4px}
textarea,input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:#fff;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
textarea.big{min-height:220px}
input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 14px;font-weight:600;line-height:1.2}
.btn:hover{filter:brightness(1.15)}
.btn.plain{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.plain:hover{background:var(--hover);filter:none}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.no{background:#fff;color:var(--no);border-color:var(--no)}
.btn.send{background:var(--inviato);border-color:var(--inviato)}
.btn.small{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default;filter:none}

/* conversazione */
.thread{max-width:780px;margin-top:22px}
.thread>h3{margin-bottom:10px}
.msg{padding:10px 14px 11px;border-left:4px solid var(--mc,#98A2B0);background:var(--paper);margin-bottom:8px;border-radius:0 var(--r) var(--r) 0}
.msg.voce{background:var(--voce);--mc:#C78A12}
.msg .h{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.msg .h b{color:var(--ink);font-size:13.5px}
.msg .x{white-space:pre-wrap;line-height:1.55}
.composer{margin-top:12px}

/* registro */
.page{padding:22px 28px 60px;max-width:980px}
.reg{list-style:none;padding:0;margin:18px 0 0}
.reg li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.reg time{font-weight:700;font-size:17px;font-stretch:80%}
.reg .sim{display:block;font-size:12px;color:var(--muted)}
.reg .by{font-size:12.5px;color:var(--muted);margin-top:4px}
.x{white-space:pre-wrap}

/* regia */
.fasi{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fasi button{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 12px;text-align:left;font-weight:600}
.fasi button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.fasi button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.fasi button[aria-pressed=true] small{color:#C9D1DC}
.cards{display:grid;gap:10px;margin-top:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px;border-left:5px solid var(--c,#98A2B0)}
.card.done{opacity:.72}
.card .ch{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.card .ch .t{font-weight:700;font-size:15.5px}
.card .note{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.card .x{margin-top:6px;line-height:1.5}
.phase-h{font-stretch:75%;font-size:20px;margin:26px 0 4px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:130px}
.stat b{display:block;font-size:26px;font-stretch:75%;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 12px;align-items:center;margin-top:8px}
.score .opts{display:flex;gap:4px}
.score .opts button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;font-weight:700}
.score .opts button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.big-num{font-stretch:62%;font-weight:800;font-size:76px;line-height:.9}
.tbl-wrap{overflow-x:auto;margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-weight:700;background:var(--hover);white-space:nowrap}
td.n{white-space:nowrap}
.miss{color:var(--no);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.col h3{padding-bottom:6px;border-bottom:3px solid var(--c)}
.section{margin-top:30px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:12px}
.person{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}

/* accesso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-box{width:100%;max-width:420px}
.gate-title{font-stretch:62%;font-weight:800;font-size:52px;line-height:.9;margin-bottom:6px}
.gate-box .doc{margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-weight:600;max-width:calc(100vw - 32px);z-index:20;box-shadow:0 6px 24px rgba(21,32,48,.25)}
.toast.err{background:var(--no)}
.loading{padding:40px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(21,32,48,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--paper);border-radius:var(--r);padding:20px 22px;width:100%;max-width:440px}

@media (max-width:860px){
  .band{grid-template-columns:1fr;align-items:start}
  .clock{text-align:left}
  .who{justify-content:flex-start}
  .work{grid-template-columns:1fr}
  .list,.detail{max-height:none}
  .work.has-sel .list{display:none}
  .work:not(.has-sel) .detail{display:none}
  .back{display:inline-block}
  .detail,.page{padding:16px 14px 50px}
  .cols,.people,.grid2{grid-template-columns:1fr}
  .reg li{grid-template-columns:80px 1fr}
  .score{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://oldjwaslzahejdiedipe.supabase.co";
const SUPABASE_KEY = "sb_publishable_16eJTjeVDyDsGaZ3fPrPYw__w3IvLTP";
/* =====================================================================
   Portale tabletop – un solo file: React 18 + htm + Supabase
   ===================================================================== */
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);
const CONFIGURATO = !/IL-TUO-PROGETTO/.test(SUPABASE_URL) || window.__MOCK__;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- preferenze del dispositivo ---------- */
const LSP = 'tt:' + SUPABASE_URL.replace(/^https?:\/\//, '').split('.')[0] + ':';
function lsGet(k, d) { try { const v = localStorage.getItem(LSP + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LSP + k, JSON.stringify(v)); } catch (e) {} }

/* ---------- configurazione (campaign.config) ---------- */
const DEFAULT_CFG = {
  titolo: 'Esercitazione tabletop',
  ruoli: { A: [], B: [] },
  tipi_canale: ['Richiesta di autorizzazione', 'Richiesta di decisione', 'Aggiornamento'],
  comunicazioni: [],
  destinatari: [],
  voci: ['Facilitatore'],
  fasi: [{ nome: 'Avvio', tempo: '' }],
};
const strList = (v, d) => Array.isArray(v) ? v.map(x => String(x == null ? '' : x).trim()).filter(Boolean) : d;
function normCfg(c) {
  c = c && typeof c === 'object' ? c : {};
  const r = c.ruoli && typeof c.ruoli === 'object' ? c.ruoli : {};
  return {
    titolo: String(c.titolo || DEFAULT_CFG.titolo),
    ruoli: Object.fromEntries(Object.keys(r).map(k => [k, strList(r[k], [])])),
    tipi_canale: strList(c.tipi_canale, DEFAULT_CFG.tipi_canale),
    comunicazioni: Array.isArray(c.comunicazioni)
      ? c.comunicazioni.filter(x => x && x.tipo).map(x => ({
          tipo: String(x.tipo).trim(), destinatario: String(x.destinatario || '').trim(),
          termine: String(x.termine || '').trim(), fase: String(x.fase || '').trim() }))
      : [],
    // tipi mostrati alle squadre per le comunicazioni esterne: generici, per non suggerire quelle previste
    tipi_esterni: strList(c.tipi_esterni, []),
    canali: strList(c.canali, []),
    modelli: Array.isArray(c.modelli)
      ? c.modelli.filter(x => x && x.nome && x.testo).map(x => ({ nome: String(x.nome).trim(), oggetto: String(x.oggetto || '').trim(), testo: String(x.testo) }))
      : [],
    destinatari: strList(c.destinatari, []),
    voci: strList(c.voci, DEFAULT_CFG.voci).length ? strList(c.voci, DEFAULT_CFG.voci) : DEFAULT_CFG.voci,
    fasi: Array.isArray(c.fasi) && c.fasi.some(f => f && f.nome)
      ? c.fasi.filter(f => f && f.nome).map(f => ({ nome: String(f.nome).trim(), tempo: String(f.tempo || '').trim() }))
      : DEFAULT_CFG.fasi,
  };
}

/* ---------- utilità ---------- */
const pad = n => String(n).padStart(2, '0');
const ms = ts => ts ? new Date(ts).getTime() : 0;
function ora(ts) { if (!ts) return ''; const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function oraSec(ts) { if (!ts) return ''; const d = new Date(ts); return ora(ts) + ':' + pad(d.getSeconds()); }
function giornoOra(ts) { if (!ts) return ''; const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + ora(ts); }
function durata(a, b) {
  if (a == null || b == null || a === '' || b === '') return '';
  const m = Math.max(0, Math.round((ms(b) - ms(a)) / 60000));
  if (m < 1) return 'meno di 1 min';
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
}
const faseBreve = s => (s || '').split(' — ')[0];
const byTime = (a, b) => ms(a.created_at) - ms(b.created_at);
function errMsg(e) {
  const m = (e && e.message) || String(e || '');
  if (/relation .* does not exist|column .* does not exist|function .* does not exist|Could not find the function/i.test(m))
    return 'Il database non è aggiornato: esegui setup.sql nell\'SQL Editor di Supabase.';
  if (/JWT|session/i.test(m)) return 'Sessione scaduta: esci e rientra.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Connessione assente: controlla la rete e riprova.';
  if (/row-level security/i.test(m)) return 'Non hai il permesso per questa azione.';
  return m;
}
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csv(rows) {
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return '\ufeff' + rows.map(r => r.map(esc).join(';')).join('\r\n');
}
function beep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = beep.ctx || (beep.ctx = new C());
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(660, t + .12);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .42);
  } catch (e) {}
}

const STATI = {

  esterna: { in_attesa: 'Da autorizzare', approvato: 'Autorizzata, da inviare', respinto: 'Non autorizzata', inviato: 'Inviata', chiuso: 'Chiusa' },
  situazione: { aperto: 'Aperta', chiuso: 'Chiusa' },
};
const statoLabel = f => (STATI[f.kind] || {})[f.stato] || f.stato;
const KIND_LABEL = { canale: 'Tra le stanze', esterna: 'Comunicazione esterna', situazione: 'Situazione' };
const EVENTI = { aperto: 'Aperta', situazione: 'Situazione inviata', approvato: 'Approvata', autorizzato: 'Autorizzata',
  respinto: 'Respinta', inviato: 'Inviata al destinatario', chiuso: 'Chiusa' };
const CRITERI = [['tempestivita', 'Tempestività'], ['chiarezza', 'Chiarezza'], ['completezza', 'Completezza'],
  ['coerenza', 'Accuratezza e coerenza'], ['destinatario', 'Destinatario, canale, firma'], ['piano', 'Rispetto del piano']];
const DELEGHE = [['perimetro', 'Nel perimetro delle deleghe'], ['fuori_delega', 'Fuori delega'], ['firma_sbagliata', 'Firma sbagliata']];
// inviata senza passare dall'altra stanza: invio diretto o firmata in proprio dalla squadra che autorizza
const autonoma = f => f.kind === 'esterna' && (f.diretta || f.nota_decisione === 'Autorizzata in proprio');
const nonInformata = f => autonoma(f) && f.stato === 'inviato' && !f.informata_at;
// quanto un testo si discosta dal modello di partenza (0 = identico, 100 = tutto riscritto)
function scarto(a, b) {
  const w = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
  const A = w(a), B = new Set(w(b));
  if (!A.length && !B.size) return 0;
  const comuni = A.filter(x => B.has(x)).length;
  return Math.round(100 - (200 * comuni) / (A.length + B.size));
}

function makeWho(d) {
  const byId = {}; d.members.forEach(m => { byId[m.user_id] = m; });
  const team = id => d.teams.find(t => t.id === id);
  const teams = d.teams.slice().sort((a, b) => (a.ordine || 0) - (b.ordine || 0) || a.id.localeCompare(b.id));
  return {
    member: id => byId[id],
    name: id => (byId[id] && byId[id].nome) || 'Facilitatore',
    team,
    teams,
    ids: teams.map(t => t.id),
    others: id => teams.filter(t => t.id !== id),
    authorizers: id => teams.filter(t => t.autorizza && t.id !== id),
    teamName: id => (team(id) && team(id).nome) || (id ? 'Squadra ' + id : 'Regia'),
    teamColor: id => (team(id) && team(id).colore) || '#5A6576',
  };
}
function groupMsgs(list) {
  const g = {};
  list.slice().sort(byTime).forEach(m => { (g[m.flow_id] = g[m.flow_id] || []).push(m); });
  return g;
}
function activity(f, byFlow) {
  const m = byFlow[f.id] || [];
  return Math.max(ms(f.created_at), ms(f.decided_at), ms(f.inviato_at), ms(f.closed_at), m.length ? ms(m[m.length - 1].created_at) : 0);
}
function faseAt(fasi, ts) {
  let cur = '';
  fasi.slice().sort(byTime).forEach(x => { if (ms(x.created_at) <= ms(ts)) cur = x.fase; });
  return cur;
}

/* ---------- dati condivisi + tempo reale ---------- */
const T_ALL = ['campaign', 'campaign_fasi', 'teams', 'members', 'flows', 'messages', 'registro', 'monitor'];
const T_MASTER = ['settings', 'team_codes', 'copione', 'valutazioni', 'fiducia', 'flow_events', 'previste', 'attori', 'punti', 'tappe', 'bivi'];
const SINGLE = { campaign: 1, settings: 1 };

function useData(isMaster) {
  const [d, setD] = useState({ loaded: false, campaign: null, settings: null, team_codes: [], campaign_fasi: [], teams: [], members: [],
    flows: [], messages: [], registro: [], monitor: [], copione: [], valutazioni: [], fiducia: [], flow_events: [],
    previste: [], attori: [], punti: [], tappe: [], bivi: [] });
  const [err, setErr] = useState('');
  const load = useCallback(async t => {
    const { data, error } = await sb.from(t).select('*');
    if (error) { setErr(errMsg(error)); return; }
    setErr('');
    setD(p => ({ ...p, [t]: SINGLE[t] ? (data[0] || null) : data }));
  }, []);
  const loadAll = useCallback(async () => {
    await Promise.all((isMaster ? T_ALL.concat(T_MASTER) : T_ALL).map(load));
    setD(p => ({ ...p, loaded: true }));
  }, [isMaster, load]);
  useEffect(() => {
    loadAll();
    const timers = {};
    const later = t => {
      clearTimeout(timers[t]);
      timers[t] = setTimeout(() => {
        load(t);
        if (t === 'campaign') load('campaign_fasi');
        if (isMaster && t === 'flows') { load('flow_events'); load('copione'); }
      }, 200);
    };
    let ch = sb.channel('tt-' + Math.random().toString(36).slice(2));
    ['flows', 'messages', 'members', 'campaign', 'registro', 'teams', 'monitor'].forEach(t => {
      ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => later(t));
    });
    ch.subscribe();
    const vis = () => { if (document.visibilityState === 'visible') loadAll(); };
    document.addEventListener('visibilitychange', vis);
    const iv = setInterval(() => { ['flows', 'messages', 'campaign'].forEach(later); }, 30000);
    return () => {
      sb.removeChannel(ch); document.removeEventListener('visibilitychange', vis);
      clearInterval(iv); Object.values(timers).forEach(clearTimeout);
    };
  }, [isMaster, load, loadAll]);
  return { d, load, loadAll, err };
}

/* Ogni operazione: scrive, ricarica le tabelle toccate, mostra un messaggio leggibile. */
function useOps(load) {
  const [toast, setToast] = useState(null);
  const say = useCallback((msg, kind) => setToast({ msg, kind: kind || 'ok', id: Date.now() }), []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.kind === 'err' ? 6000 : 2600);
    return () => clearTimeout(t);
  }, [toast]);
  const run = useCallback(async (p, tables, okMsg) => {
    try {
      const { data, error } = await p;
      if (error) throw error;
      (tables || []).forEach(t => load(t));
      if (okMsg) say(okMsg);
      return { data, error: '' };
    } catch (e) {
      const m = errMsg(e); say(m, 'err'); (tables || []).forEach(t => load(t));
      return { data: null, error: m };
    }
  }, [load, say]);
  return { run, toast, say };
}

        ${f.diretta ? html`<dt>${decisioneLbl}</dt><dd><span className="tag warn">Nessuna: inviata direttamente</span></dd>` : null}
        ${autonoma(f) && f.stato === 'inviato' ? html`<dt>Informativa</dt><dd>${f.informata_at
          ? html`A ${who.teamName(f.to_team)} alle ${ora(f.informata_at)}${f.informativa_flow && hasFlow && hasFlow(f.informativa_flow) ? html` · <button className="link" onClick=${() => onOpen(f.informativa_flow)}>apri</button>` : null}`
          : html`<span className="miss">non ancora inviata all'altra stanza</span>`}</dd>` : null}
        ${f.inviato_at ? html`<dt>Inviata</dt><dd>da ${who.name(f.inviato_by)} alle ${ora(f.inviato_at)}</dd>` : null}
        ${f.closed_at ? html`<dt>Chiusa</dt><dd>da ${who.name(f.closed_by)} alle ${ora(f.closed_at)}</dd>` : null}
        ${f.rif && hasFlow && hasFlow(f.rif) ? html`<dt>Collegata a</dt><dd><button className="link" onClick=${() => onOpen(f.rif)}>apri il flusso precedente</button></dd>` : null}
      </dl>
      ${f.motivo ? html`<div className="body">${f.motivo}</div>` : null}
    </article>

    ${autonoma(f) && toMe && !mine && !isMaster ? html`<section className="panel info">
      <h3>Per conoscenza</h3>
      <p className="hint">${who.teamName(f.from_team)} l'ha inviata in autonomia a ${destText(f)} alle ${ora(f.inviato_at)} e vi ha mandato un'informativa. Non dovete decidere nulla: se serve, ratificate o chiedete una correzione.</p>
      ${part ? html`<div className="actions"><button id="btn-reply-team" className="btn plain" onClick=${() => onCompose({ kind: 'canale', prefill: { to: f.from_team, tipo: tipoAgg, titolo: 'Re: ' + f.titolo, rif: f.id, testo: '' } })}>Rispondi a ${who.teamName(f.from_team)}</button></div>` : null}
    </section>` : null}

    ${part && mine && nonInformata(f) ? html`<${InformativaForm} f=${f} who=${who} me=${me} ops=${ops} onDone=${id => onOpen && onOpen(id)}/>` : null}

    ${canDecide ? html`<section className="panel decide">
      <h3>${isExt ? 'Autorizzate questa comunicazione?' : 'Approvate questa richiesta?'}</h3>
      <p className="hint">La decisione resta agli atti con nome, ruolo e orario. Decide chi per primo risponde.</p>
      <${Field} label="Nota per l'altra squadra"><textarea id="decide-note" value=${nota} placeholder=${isExt ? 'Facoltativa. Se non autorizzate, spiegate cosa cambiare.' : 'Facoltativa'} onChange=${e => setNota(e.target.value)}></textarea><//>
      <div className="actions">
        <button id="btn-approve" className="btn ok" disabled=${busy} onClick=${() => act(sb.rpc('decide_flow', { p_id: f.id, p_esito: 'approvato', p_nota: nota }), isExt ? 'Autorizzata' : 'Approvata')}>${isExt ? 'Autorizza' : 'Approva'}</button>
        <button id="btn-reject" className="btn no" disabled=${busy} onClick=${() => act(sb.rpc('decide_flow', { p_id: f.id, p_esito: 'respinto', p_nota: nota }), isExt ? 'Non autorizzata' : 'Respinta')}>${isExt ? 'Non autorizzare' : 'Respingi'}</button>
      </div>
    </section>` : null}

    ${canSend ? html`<section className="panel send">
      <h3>Autorizzata: ora potete inviarla</h3>
      <p className="hint">Arriva a ${destText(f)} così com'è scritta e non si modifica più. Le risposte dei destinatari compaiono qui sotto.</p>
      <div className="actions"><button id="btn-send" className="btn send" disabled=${busy}
        onClick=${() => { if (window.confirm('Inviare la comunicazione a ' + destText(f) + '?')) act(sb.rpc('send_external', { p_id: f.id }), 'Inviata a ' + destText(f)); }}>Invia a ${destText(f)}</button></div>
    </section>` : null}

    ${f.stato === 'in_attesa' && mine && !isMaster ? html`<section className="panel">
      <p>In attesa della risposta di ${who.teamName(f.to_team)}.</p>
      ${canWithdraw ? html`<div className="actions"><button className="btn plain small" disabled=${busy}
        onClick=${() => { if (window.confirm('Ritirare questa richiesta?')) act(sb.rpc('close_flow', { p_id: f.id }), 'Ritirata'); }}>Ritira</button></div>` : null}
    </section>` : null}

    ${(canRetry || (part && (f.kind === 'situazione' || (isExt && f.stato === 'inviato' && mine && lastVoice)))) ? html`<div className="actions" style=${{ maxWidth: '780px' }}>
      ${canRetry ? html`<button id="btn-retry" className="btn plain" onClick=${() => onCompose({ kind: f.kind, prefill: { tipo: f.tipo, titolo: f.titolo, testo: f.motivo, destinatario: f.destinatario, ccn: f.ccn, canale: f.canale, modello: f.modello, rif: f.id } })}>Riproponi con modifiche</button>` : null}
      ${part && (f.kind === 'situazione' || (isExt && f.stato === 'inviato' && mine && lastVoice)) ? html`<button id="btn-forward" className="btn plain" onClick=${forward}>${portaLbl}</button>` : null}
    </div>` : null}

    <section className="thread">
      <h3>${f.kind === 'situazione' ? 'Conversazione con ' + f.voce : isExt ? (f.stato === 'inviato' ? 'Risposte del destinatario' : 'Discussione sul testo') : 'Conversazione tra le squadre'}</h3>
      ${msgs.map(m => html`<${Msg} key=${m.id} m=${m} who=${who} isMaster=${isMaster}/>`)}
      ${!msgs.length ? html`<p className="empty">${f.stato === 'in_attesa' ? 'Si potrà scrivere dopo la decisione.' : 'Nessun messaggio.'}</p>` : null}
      ${canPost ? html`<${Composer} id="post-text" onSend=${t => act(sb.rpc('post_message', { p_flow: f.id, p_testo: t }))}
        placeholder=${f.kind === 'situazione' ? 'Rispondi a ' + f.voce + '…' : 'Scrivi all\'altra squadra…'}/>` : null}
      ${part && isExt && f.stato === 'inviato' ? html`<p className="hint" style=${{ marginTop: '8px' }}>Per integrare o correggere serve una nuova comunicazione, da autorizzare di nuovo.</p>` : null}
      ${canClose ? html`<div className="actions"><button className="btn plain small" disabled=${busy}
        onClick=${() => { if (window.confirm('Chiudere questo flusso? Resterà leggibile ma non si potrà più scrivere.')) act(sb.rpc('close_flow', { p_id: f.id }), 'Chiuso'); }}>Chiudi il flusso</button></div>` : null}
    </section>

    ${isMaster ? html`<${VoiceComposer} f=${f} d=${d} cfg=${cfg} who=${who} ops=${ops}/>` : null}
    ${isMaster && (f.kind !== 'situazione' || f.richiesta) ? html`<${Valutazione} f=${f} d=${d} ops=${ops}/>` : null}
  </div>`;
}

/* Informativa scritta all'altra stanza su ciò che si è fatto in autonomia (modello del piano incidenti: cosa, quando, impatto). */
function InformativaForm({ f, who, me, ops, onDone }) {
  const targets = who.others(me.team);
  const def = (who.authorizers(me.team)[0] || targets[0] || {}).id || '';
  const [to, setTo] = useState(def);
  const [v, setV] = useState({ cosa: '', quando: '', impatto: '', perche: '', serve: '' });
  const [busy, setBusy] = useState(false);
  const set = k => e => setV({ ...v, [k]: e.target.value });
  const inviato = f ? '«' + f.titolo + '» a ' + destText(f) + (f.canale ? ', via ' + f.canale : '') + ', alle ' + ora(f.inviato_at) : '';
  const testo = [['Cosa', v.cosa], ['Quando', v.quando], ['Impatto', v.impatto], ['Cosa abbiamo inviato e a chi', inviato],
    ['Perché in autonomia', v.perche], ['Cosa serve ora', v.serve]]
    .filter(([, x]) => x && x.trim()).map(([k, x]) => k + ': ' + x.trim()).join('\n\n');
  const ok = to && v.cosa.trim() && v.perche.trim() && !busy;
  const send = async () => {
    setBusy(true);
    const r = await ops.run(sb.rpc('send_informativa', { p_flow: f ? f.id : null, p_to: to, p_titolo: 'Informativa: ' + (f ? f.titolo : v.cosa.trim().slice(0, 60)), p_testo: testo }),
      ['flows'], 'Informativa inviata a ' + who.teamName(to));
    setBusy(false);
    if (!r.error && onDone) onDone(r.data);
  };
  return html`<section className="panel info" id="informativa">
    <h3>Informativa all'altra stanza</h3>
    <p className="hint">L'avete inviata senza passare dall'altra stanza: resta segnata «non informata» finché non mandate un'informativa scritta.</p>
    ${targets.length > 1 ? html`<${Field} label="A quale squadra"><select id="inf-to" value=${to} onChange=${e => setTo(e.target.value)}>${targets.map(t => html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}</select><//>` : null}
    <div className="grid2">
      <${Field} label="Cosa è successo"><textarea id="inf-cosa" value=${v.cosa} onChange=${set('cosa')}></textarea><//>
      <${Field} label="Impatto"><textarea id="inf-impatto" value=${v.impatto} onChange=${set('impatto')}></textarea><//>
      <${Field} label="Quando"><input id="inf-quando" type="text" value=${v.quando} onChange=${set('quando')} placeholder="Per esempio: dalle 9:10, tempo simulato"/><//>
      <${Field} label="Perché in autonomia"><input id="inf-perche" type="text" value=${v.perche} onChange=${set('perche')}/><//>
    </div>
    <${Field} label="Cosa serve ora dall'altra stanza"><textarea id="inf-serve" value=${v.serve} onChange=${set('serve')}></textarea><//>
    ${inviato ? html`<p className="hint" style=${{ marginTop: '8px' }}>Si aggiunge da solo: cosa avete inviato e a chi, ${inviato}.</p>` : null}
    <div className="actions"><button id="inf-send" className="btn" disabled=${!ok} onClick=${send}>Invia l'informativa a ${who.teamName(to)}</button></div>
  </section>`;
}

function Msg({ m, who, isMaster }) {
  const isVoce = !!m.voce;
  return html`<div className=${'msg' + (isVoce ? ' voce' : '')} style=${isVoce ? null : { '--mc': who.teamColor(m.team_id) }}>
    <div className="h">
      ${isVoce ? html`<span className="placard">${m.voce}</span>` : html`<b>${who.name(m.author)}</b>${m.ruolo ? html`<span>${m.ruolo}</span>` : null}<span>${who.teamName(m.team_id)}</span>`}
      <time>${ora(m.created_at)}</time>
      ${isMaster && m.solo_team ? html`<span className="tag">visibile solo a ${who.teamName(m.solo_team)}</span>` : null}
    </div>
    <div className="x">${m.testo}</div>
  </div>`;
}

// abbinamento suggerito a una comunicazione prevista: stesso tipo, altrimenti un destinatario in comune
function guessPrevista(f, previste) {
  if (!previste || !previste.length || f.kind === 'situazione') return null;
  const byTipo = previste.find(p => p.tipo === f.tipo);
  if (byTipo) return byTipo.id;
  if (f.kind !== 'esterna') return /escalation/i.test(f.tipo || '') ? ((previste.find(p => /escalation/i.test(p.tipo)) || {}).id || null) : null;
  const dests = splitDest(f.destinatario).concat(splitDest(f.ccn)).map(x => x.toLowerCase().replace(/\s*\(.*\)$/, ''));
  const hit = previste.find(p => dests.some(x => x.length > 3 && p.destinatario.toLowerCase().includes(x)));
  return hit ? hit.id : null;
}
function VoiceComposer({ f, d, cfg, who, ops }) {
  const dests = f.kind === 'esterna' ? splitDest(f.destinatario).concat(splitDest(f.ccn)) : [];
  const defVoce = f.kind === 'situazione' ? f.voce : f.kind === 'esterna' ? (dests[0] || cfg.voci[0]) : cfg.voci[0];
  const defSolo = f.kind === 'esterna' ? (f.from_team || '') : '';
  const [voce, setVoce] = useState(defVoce);
  const [solo, setSolo] = useState(defSolo);
  useEffect(() => { setVoce(defVoce); setSolo(defSolo); }, [f.id]);
  // con più destinatari si risponde come ciascuno di loro, uno alla volta
  const voci = Array.from(new Set([defVoce].concat(dests, cfg.voci).filter(Boolean)));
  // rubrica degli attori: chi può scrivergli secondo i piani e come reagisce se riceve ciò che non dovrebbe
  const attore = ((d && d.attori) || []).find(a => a.nome === voce);
  const mittente = f.richiesta || f.kind !== 'situazione'
    ? who.name(f.opened_by) + (f.opened_ruolo ? ', ' + f.opened_ruolo : '') + ' — ' + who.teamName(f.from_team || f.to_team) : '';
  return html`<section className="panel regia">
    <h3>Rispondi come una voce</h3>
    <p className="hint">Il messaggio arriva con il cartello della voce scelta. ${f.kind === 'esterna' ? 'Ogni destinatario risponde per conto suo, in base a ciò che ha ricevuto e da chi. Un avviso vago genera domande; una notifica incompleta torna indietro con richieste di integrazione.' : ''}</p>
    ${mittente ? html`<p className="hint" style=${{ marginTop: '4px' }}>Scritto da: <b>${mittente}</b>${f.ccn ? ' · in copia nascosta: ' + f.ccn : ''}</p>` : null}
    ${attore ? html`<dl className="meta" style=${{ marginTop: '8px' }}>
      <dt>Chi può scrivergli</dt><dd>${attore.chi_puo}</dd>
      <dt>Se riceve ciò che non dovrebbe</dt><dd>${attore.se_sbagliato}</dd>
    </dl>` : null}
    <div className="grid2">
      <${Field} label="Voce"><select id="voice-select" value=${voce} onChange=${e => setVoce(e.target.value)}>${voci.map(v => html`<option key=${v}>${v}</option>`)}</select><//>
      ${f.kind !== 'situazione' ? html`<${Field} label="Chi lo legge"><select id="voice-solo" value=${solo} onChange=${e => setSolo(e.target.value)}>
        ${f.from_team && f.to_team ? html`<option value="">Entrambe le squadre</option>` : null}
        ${[f.from_team, f.to_team].filter(Boolean).map(t => html`<option key=${t} value=${t}>Solo ${who.teamName(t)}</option>`)}
      </select><//>` : html`<div></div>`}
    </div>
    <${Composer} id="voice-text" label=${'Invia come ' + voce} placeholder="Testo della risposta…"
      onSend=${t => ops.run(sb.rpc('voice_message', { p_flow: f.id, p_voce: voce, p_testo: t, p_solo_team: solo || null }), ['messages'], 'Inviato come ' + voce)}/>
  </section>`;
}

function Valutazione({ f, d, ops }) {
  const v = d.valutazioni.find(x => x.flow_id === f.id) || {};
  const [nota, setNota] = useState(v.nota || '');
  useEffect(() => { setNota(v.nota || ''); }, [f.id]);
  const save = patch => ops.run(sb.from('valutazioni').upsert({ flow_id: f.id, ...patch, updated_at: new Date().toISOString() }), ['valutazioni']);
  const vals = CRITERI.map(([k]) => v[k]).filter(x => x);
  const prev = v.prevista_id != null ? v.prevista_id : guessPrevista(f, d.previste);
  return html`<section className="panel regia" id="valutazione">
    <h3>Valutazione${vals.length ? ' — media ' + (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : ''}</h3>
    <p className="hint">Non visibile alle squadre. Da 1 a 5; un secondo clic sullo stesso valore lo toglie.</p>
    <div className="grid2">
      <${Field} label="Comunicazione prevista dallo scenario" hint=${v.prevista_id == null && prev ? 'Abbinamento suggerito: confermalo o cambialo.' : null}>
        <select id="val-prevista" value=${prev || ''} onChange=${e => save({ prevista_id: e.target.value ? Number(e.target.value) : null })}>
          <option value="">Nessuna</option>${d.previste.slice().sort((a, b) => a.ordine - b.ordine).map(p => html`<option key=${p.id} value=${p.id}>${p.ordine}. ${p.tipo}</option>`)}
        </select><//>
      <div className="field"><span className="lab">Verdetto sulle deleghe</span>
        <div className="seg" role="group" aria-label="Verdetto sulle deleghe">${DELEGHE.map(([k, l]) => html`<button key=${k} aria-pressed=${v.delega === k} onClick=${() => save({ delega: v.delega === k ? null : k })}>${l}</button>`)}</div>
      </div>
    </div>
    <div className="score">
      ${CRITERI.map(([k, lbl]) => html`<${React.Fragment} key=${k}><span>${lbl}</span><span className="opts">
        ${[1, 2, 3, 4, 5].map(n => html`<button key=${n} aria-pressed=${v[k] === n} aria-label=${lbl + ' ' + n}
          onClick=${() => save({ [k]: v[k] === n ? null : n })}>${n}</button>`)}
      </span><//>`)}
    </div>
    <${Field} label="Note per il debriefing"><textarea value=${nota} onChange=${e => setNota(e.target.value)} onBlur=${() => { if (nota !== (v.nota || '')) save({ nota }); }}></textarea><//>
  </section>`;
}

function Compose({ kind, prefill, cfg, me, who, ops, onDone, onCancel }) {
  prefill = prefill || {};
  const isExt = kind === 'esterna';
  const isVoce = kind === 'voce';   // richiesta a una voce interpretata dal facilitatore
  const tipi = isVoce ? [] : (isExt ? (cfg.tipi_esterni.length ? cfg.tipi_esterni : cfg.comunicazioni.map(c => c.tipo)) : cfg.tipi_canale).concat(['Altro']);
  // destinatari possibili: gli esterni e tutte le voci interpretate dal facilitatore (anche quelle sbagliate)
  const vociSim = cfg.voci.filter(v => v !== 'Facilitatore' && !cfg.destinatari.includes(v));
  const attori = cfg.destinatari.concat(vociSim);
  const vociScrivibili = cfg.voci.filter(v => v !== 'Facilitatore');
  // ogni attore scelto è destinatario in chiaro ('a') o in copia nascosta ('ccn')
  const pre = {}; splitDest(prefill.destinatario).forEach(x => { pre[x] = 'a'; }); splitDest(prefill.ccn).forEach(x => { pre[x] = 'ccn'; });
  const [tipo, setTipo] = useState(prefill.tipo || '');
  const [titolo, setTitolo] = useState(prefill.titolo || '');
  const [testo, setTesto] = useState(prefill.testo || '');
  const [sel, setSel] = useState(() => Object.fromEntries(Object.entries(pre).filter(([x]) => attori.includes(x))));
  const [destFree, setDestFree] = useState(Object.keys(pre).filter(x => !attori.includes(x) && pre[x] === 'a').join(', '));
  const [ccnFree, setCcnFree] = useState(Object.keys(pre).filter(x => !attori.includes(x) && pre[x] === 'ccn').join(', '));
  const [canale, setCanale] = useState(prefill.canale || '');
  const [modello, setModello] = useState(prefill.modello || '');
  const [voce, setVoce] = useState(prefill.voce || vociScrivibili[0] || '');
  const [busy, setBusy] = useState(false);
  const myTeam = who.team(me.team) || {};
  const selfAuth = isExt && myTeam.autorizza;
  // squadre a cui si può mandare: per le richieste tutte le altre, per le esterne quelle che autorizzano
  const targets = isVoce ? [] : isExt ? (selfAuth ? [] : who.authorizers(me.team)) : who.others(me.team);
  const [toTeam, setToTeam] = useState(prefill.to && targets.some(t => t.id === prefill.to) ? prefill.to : targets.length === 1 ? targets[0].id : '');
  const other = who.team(toTeam) || { nome: isExt ? 'la squadra che autorizza' : 'l\'altra squadra' };
  const noAuth = isExt && !selfAuth && !targets.length;
  // invio diretto, senza autorizzazione: poi serve l'informativa all'altra stanza
  const [modo, setModo] = useState(noAuth ? 'diretta' : 'autorizza');
  const diretta = isExt && modo === 'diretta';
  const cycle = x => setSel(s => { const n = { ...s }; if (!n[x]) n[x] = 'a'; else if (n[x] === 'a') n[x] = 'ccn'; else delete n[x]; return n; });
  const pickTipo = v => {
    if (!titolo || tipi.includes(titolo)) setTitolo(v === 'Altro' ? '' : v);
    setTipo(v);
  };
  const pickModello = nome => {
    const m = cfg.modelli.find(x => x.nome === nome);
    if (!m) { setModello(''); return; }
    if (testo.trim() && testo !== m.testo && !window.confirm('Sostituire il testo scritto finora con il modello?')) return;
    setModello(nome); setTesto(m.testo);
    if (!titolo.trim() && m.oggetto) setTitolo(m.oggetto);
  };
  const listA = Array.from(new Set(Object.keys(sel).filter(x => sel[x] === 'a').concat(splitDest(destFree))));
  const listC = Array.from(new Set(Object.keys(sel).filter(x => sel[x] === 'ccn').concat(splitDest(ccnFree)))).filter(x => !listA.includes(x));
  const destinatario = listA.join(', '), ccn = listC.join(', ');
  const nDest = listA.length + listC.length;
  const tutti = [destinatario, ccn ? 'Ccn: ' + ccn : ''].filter(Boolean).join(' · ');
  const ok = titolo.trim() && testo.trim() && (isVoce ? !!voce : (!isExt || nDest) && (diretta || ((selfAuth || toTeam) && !noAuth)));
  const submit = async () => {
    if (diretta && !window.confirm('Inviare subito a ' + tutti + ', senza autorizzazione? Non si potrà più modificare e resterà «non informata» finché non mandate l\'informativa.')) return;
    setBusy(true);
    let r;
    if (isVoce) {
      r = await ops.run(sb.rpc('ask_voice', { p_voce: voce, p_titolo: titolo, p_testo: testo }), ['flows'], 'Mandata a ' + voce);
    } else if (diretta) {
      r = await ops.run(sb.rpc('send_direct', { p_tipo: tipo, p_titolo: titolo, p_testo: testo, p_destinatario: destinatario,
        p_ccn: ccn || null, p_canale: canale || null, p_modello: modello || null, p_rif: prefill.rif || null }), ['flows'], 'Inviata a ' + tutti);
    } else {
      r = await ops.run(sb.rpc('open_flow', { p_kind: kind, p_tipo: tipo, p_titolo: titolo, p_testo: testo,
        p_destinatario: isExt ? destinatario : null, p_rif: prefill.rif || null, p_to: selfAuth ? null : toTeam,
        p_ccn: isExt ? (ccn || null) : null, p_canale: isExt ? (canale || null) : null, p_modello: isExt ? (modello || null) : null }), ['flows'],
        isExt ? (selfAuth ? 'Pronta: ora potete inviarla' : 'Mandata a ' + other.nome + ' per l\'autorizzazione') : 'Richiesta mandata a ' + other.nome);
    }
    setBusy(false);
    if (!r.error) onDone(r.data);
  };
  const chip = x => html`<label key=${x} className=${sel[x] === 'ccn' ? 'on ccn' : sel[x] ? 'on' : ''} title=${sel[x] === 'ccn' ? 'In copia nascosta' : sel[x] ? 'Destinatario in chiaro' : ''}>
    <input type="checkbox" checked=${!!sel[x]} onChange=${() => cycle(x)}/>${sel[x] === 'ccn' ? html`<small>Ccn</small>` : null}${x}</label>`;
  return html`<div className="doc" id="compose" style=${{ maxWidth: '780px' }}>
    <div className="doc-top"><span>${isVoce ? 'Nuova richiesta a una voce' : isExt ? 'Nuova comunicazione esterna' : 'Nuova richiesta a ' + other.nome}</span></div>
    <p className="hint" style=${{ marginTop: '6px' }}>${isVoce

function useSeen(key, flows, byFlow) {
  const [seen, setSeen] = useState(() => {
    const s = lsGet('seen:' + key, null); if (s) return s;
    const init = {}; flows.forEach(f => { init[f.id] = activity(f, byFlow); }); return init;
  });
  useEffect(() => { lsSet('seen:' + key, seen); }, [seen]);
  const unread = f => activity(f, byFlow) > (seen[f.id] || 0);
  const mark = f => { const a = activity(f, byFlow); if ((seen[f.id] || 0) < a) setSeen(s => ({ ...s, [f.id]: a })); };
  return { unread, mark };
}

function Room({ d, ops, me, onLogout, extra }) {
  const cfg = normCfg(d.campaign && d.campaign.config);
  const who = makeWho(d);

  const [profile, setProfile] = useState(false);

  const messages = d.messages.filter(m => !m.solo_team || m.solo_team === me.team);
  const byFlow = groupMsgs(messages);
  const seen = useSeen((me.preview ? 'p' : me.id) + ':' + me.team, flows, byFlow);
  const byKind = k => flows.filter(f => f.kind === k);
  const unreadIn = k => byKind(k).filter(seen.unread).length;
  const totalUnread = ['canale', 'esterna', 'situazione'].reduce((a, k) => a + unreadIn(k), 0);
  const prev = useRef(totalUnread);
  useEffect(() => {
    if (!me.preview && totalUnread > prev.current && lsGet('suono', true)) beep();
    prev.current = totalUnread;
  }, [totalUnread]);

  const selFlow = sel && flows.find(f => f.id === sel);
  const selAct = selFlow ? activity(selFlow, byFlow) : 0;
  useEffect(() => { if (selFlow) seen.mark(selFlow); }, [sel, selAct]);

  const open = id => {
    const f = flows.find(x => x.id === id); if (!f) return;

  const sectionOf = f => {

    if (f.kind === 'esterna' && f.stato === 'approvato' && f.from_team === me.team) return 1;

  const sections = [tab === 'esterna' ? 'Da autorizzare' : 'Da decidere', 'Autorizzate, da inviare', 'In corso', 'Concluse'];
  // monitor della stanza: post e notizie simulati
  const monItems = d.monitor.filter(m => m.team_id === me.team);
  const showMonitor = monItems.length > 0 || !!team.autorizza;
  const [monSeen, setMonSeen] = useState(() => lsGet('mon:' + me.team, 0));
  const monLast = monItems.reduce((a, m) => Math.max(a, ms(m.created_at)), 0);
  const monUnread = tab === 'monitor' ? 0 : monItems.filter(m => ms(m.created_at) > monSeen).length;
  useEffect(() => { if (tab === 'monitor' && monLast > monSeen) { setMonSeen(monLast); lsSet('mon:' + me.team, monLast); } }, [tab, monLast]);
  const prevMon = useRef(monItems.length);
  useEffect(() => {
    if (!me.preview && monItems.length > prevMon.current && lsGet('suono', true)) beep();
    prevMon.current = monItems.length;
  }, [monItems.length]);
  const daInformare = flows.filter(f => f.from_team === me.team && nonInformata(f));
  const tabs = [
    ['canale', 'Tra le stanze', unreadIn('canale')],
    ['esterna', 'Comunicazioni esterne', unreadIn('esterna')],
    ['situazione', 'Situazioni', unreadIn('situazione')],
    ['registro', 'Registro delle decisioni', 0],
  ].concat(showMonitor ? [['monitor', 'Monitor', monUnread]] : []);
  const tabOf = k => (k === 'voce' ? 'situazione' : k);
  const emptyText = {
    canale: 'Qui passano le richieste tra le due stanze. Scegline una dall\'elenco o aprine una nuova.',
    esterna: 'Qui si preparano le comunicazioni verso clienti, partner, autorità, assicurazione e stampa. Valgono solo se autorizzate per iscritto.',
    situazione: 'Qui arrivano i messaggi del SOC, dell\'IT Operations e degli esterni. Rispondi dentro la situazione o portala all\'altra squadra. Per una decisione tecnica, scrivi all\'Incident Manager con «Scrivi a una voce».',
  };

  return html`<div className="app">
    <${Band} color=${team.colore} title=${team.nome} sub=${me.preview ? 'Anteprima in sola lettura' : cfg.titolo} campaign=${d.campaign}>
      ${!me.preview ? html`<button className="btn-light" id="btn-profile" onClick=${() => setProfile(true)}>${me.nome}<small>${me.ruolo || 'Scegli il ruolo'}</small></button>
        <button className="btn-light" onClick=${onLogout}>Esci</button>` : extra || null}
    <//>
    ${!me.preview && !me.ruolo ? html`<div className="notice">Scegli il tuo ruolo del piano: comparirà accanto al tuo nome su richieste, decisioni e messaggi.
      <button className="btn small" onClick=${() => setProfile(true)}>Scegli il ruolo</button></div>` : null}
    ${daInformare.length && !me.preview ? html`<div className="notice">${daInformare.length === 1 ? 'Una comunicazione inviata in autonomia è ancora «non informata»' : daInformare.length + ' comunicazioni inviate in autonomia sono ancora «non informate»'}: mandate l'informativa all'altra stanza.
      <button className="btn small" onClick=${() => open(daInformare[0].id)}>Apri</button></div>` : null}
    <${Tabs} tabs=${tabs} value=${tab} color=${team.colore} onChange=${t => { setTab(t); setSel(null); setCompose(null); }}/>

    <div className=${'work' + (sel || compose ? ' has-sel' : '')}>
      <div className="list">

          ${me.preview ? html`<span></span>` : tab === 'situazione'

            : html`<button id="btn-new" className="btn small" onClick=${() => { setCompose({ kind: tab }); setSel(null); }}>
            ${tab === 'canale' ? '+ Nuova richiesta' : '+ Nuova comunicazione'}</button>`}
          <div className="seg" role="group" aria-label="Filtro">
            <button aria-pressed=${!mine} onClick=${() => setMine(false)}>Squadra</button>

          sectionOf=${sectionOf} sections=${sections} who=${who} myTeam=${me.team}/>
      </div>
      <div className="detail">
        ${compose ? html`<${Compose} key=${JSON.stringify(compose)} kind=${compose.kind} prefill=${compose.prefill} cfg=${cfg} me=${me} who=${who} ops=${ops}
            onCancel=${() => setCompose(null)} onDone=${id => { setCompose(null); setTab(tabOf(compose.kind)); setSel(id); }}/>`
          : selFlow ? html`<${FlowDetail} key=${selFlow.id} f=${selFlow} msgs=${byFlow[selFlow.id] || []} d=${d} who=${who} me=${me} ops=${ops} cfg=${cfg}
            onCompose=${c => { setTab(tabOf(c.kind)); setSel(null); setCompose(c); }} onOpen=${open} onBack=${() => setSel(null)} hasFlow=${id => flows.some(x => x.id === id)}/>`
          : html`<div className="doc" style=${{ maxWidth: '620px' }}><p>${emptyText[tab]}</p></div>`}
      </div>
    </div>`}
    ${profile ? html`<${Profile} me=${me} ruoli=${ruoli} ops=${ops} onClose=${() => setProfile(false)}/>` : null}
    <${Toast} t=${ops.toast}/>
  </div>`;
}

/* Monitor della stanza: post, articoli e titoli simulati che il facilitatore fa comparire. Non chiede risposte. */
function Monitor({ items }) {
  const [full, setFull] = useState(false);
  const list = items.slice().sort((a, b) => byTime(b, a));
  const toggle = () => {
    const next = !full; setFull(next);
    try {
      if (next && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      if (!next && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (e) {}
  };
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') setFull(false); };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  }, []);
  return html`<div className=${'monitor' + (full ? ' full' : '')} id="monitor">
    <div className="monitor-head">
      <h2>Notizie e social</h2>
      <button className="btn-light" onClick=${toggle}>${full ? 'Esci dallo schermo intero' : 'Schermo intero'}</button>
    </div>
    ${list.length ? list.map((m, i) => html`<div key=${m.id} className=${'item' + (i === 0 ? ' new' : '')}>
      <div className="src"><span>${m.fonte}</span><time>${ora(m.created_at)}</time></div>
      <div className="x">${m.testo}</div>
    </div>`) : html`<p style=${{ color: '#8FA0B3' }}>Per ora niente da segnalare.</p>`}
  </div>`;
}

  const [suono, setSuono] = useState(lsGet('suono', true));
  const ruolo = sel === '__altro' ? free.trim() : sel;
  const save = async () => {
    lsSet('suono', suono);
    const r = await ops.run(sb.rpc('set_ruolo', { p_ruolo: ruolo }), ['members'], 'Profilo aggiornato');

  return html`<${Modal} onClose=${onClose}>
