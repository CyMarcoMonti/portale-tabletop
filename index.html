function fiduciaSerie(items) {
  let v = 100;
  return items.slice().sort(byTime).map(x => { v = Math.max(0, Math.min(100, v + x.delta)); return { ...x, valore: v }; });
}
function FiduciaChart({ serie, fasi }) {
  const W = 680, H = 200, L = 34, R = 12, T = 12, B = 26;
  const pts = [{ valore: 100, created_at: null }].concat(serie);
  const n = pts.length;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1));
  const y = v => T + (100 - v) * (H - T - B) / 100;
  const poly = pts.map((p, i) => x(i) + ',' + y(p.valore)).join(' ');
  return html`<svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Andamento della fiducia dei clienti" style=${{ width: '100%', maxWidth: '760px', display: 'block' }}>
    ${[0, 50, 100].map(v => html`<g key=${v}><line x1=${L} x2=${W - R} y1=${y(v)} y2=${y(v)} stroke="#D0D7E0" stroke-dasharray=${v === 50 ? '3 4' : null}/>
      <text x=${L - 6} y=${y(v) + 4} textAnchor="end" fontSize="11" fill="#5A6576">${v}</text></g>`)}
    <polyline points=${poly} fill="none" stroke="#152030" strokeWidth="2.5" strokeLinejoin="round"/>
    ${pts.map((p, i) => html`<circle key=${i} cx=${x(i)} cy=${y(p.valore)} r="4" fill=${p.delta < 0 ? '#B3261E' : p.delta > 0 ? '#2A7634' : '#152030'}>
      <title>${p.created_at ? ora(p.created_at) + ' ' + (p.delta > 0 ? '+' : '') + p.delta + ': ' + p.motivo + (p.fase ? ' (' + p.fase + ')' : '') : 'Inizio: 100'}</title></circle>`)}
  </svg>`;
}

function Regia({ user, onLogout }) {
  const { d, load, err } = useData(true);
  const ops = useOps(load);
  const [tab, setTab] = useState(() => lsGet('rtab', 'sessione'));
  const [sel, setSel] = useState(null);
  const [filtro, setFiltro] = useState('gestire');
  const [prevTeam, setPrevTeam] = useState('A');
  const [vista, setVista] = useState(null);   // null = regia; id squadra = vista partecipanti a tutto schermo
  useEffect(() => { lsSet('rtab', tab); }, [tab]);
  if (!d.loaded) return html`<${Loading}/>`;
  const cfg = normCfg(d.campaign && d.campaign.config);
  const who = makeWho(d);
  const pt = who.ids.includes(prevTeam) ? prevTeam : who.ids[0];
  if (vista && who.team(vista)) return html`<div className="app">
    <${Room} key=${vista} d=${d} ops=${ops} me=${{ id: 'anteprima', team: vista, preview: true }} extra=${html`
      <span className="preview-tag">Vista partecipanti · sola lettura</span>
      ${who.ids.map(t => html`<button key=${t} className="btn-light" aria-pressed=${vista === t} onClick=${() => setVista(t)}>${who.teamName(t)}</button>`)}
      <button id="btn-back-regia" className="btn-light" onClick=${() => setVista(null)}>Torna alla regia</button>`}/>
  </div>`;
  const byFlow = groupMsgs(d.messages);
  const needsMe = f => {
    const ms_ = byFlow[f.id] || []; const last = ms_[ms_.length - 1];
    if (f.kind === 'esterna' && f.stato === 'inviato') return !ms_.some(m => m.voce && ms(m.created_at) >= ms(f.inviato_at));
    if (f.kind === 'situazione' && f.stato === 'aperto') return f.richiesta ? !(last && last.voce) : !!(last && !last.voce);
    return false;
  };
  const gestire = d.flows.filter(needsMe);
  const goFlow = id => { setTab('flussi'); setFiltro('tutti'); setSel(id); };
  const tabs = [['sessione', 'Sessione'], ['flussi', 'Flussi', gestire.length], ['copione', 'Copione'], ['fiducia', 'Fiducia'],
    ['debriefing', 'Debriefing'], ['anteprima', 'Vista squadre'], ['partecipanti', 'Partecipanti'], ['impostazioni', 'Impostazioni']];

  let body = null;
  if (tab === 'sessione') body = html`<${Sessione} d=${d} cfg=${cfg} who=${who} ops=${ops} gestire=${gestire} goFlow=${goFlow}/>`;
  else if (tab === 'flussi') {
    const filters = [['gestire', 'Da gestire'], ['esterna', 'Esterne'], ['canale', 'Tra le stanze'], ['situazione', 'Situazioni'], ['tutti', 'Tutti']];
    const list = d.flows.filter(f => filtro === 'tutti' ? true : filtro === 'gestire' ? needsMe(f) : f.kind === filtro);
    const selFlow = sel && d.flows.find(f => f.id === sel);
    body = html`<div className=${'work' + (selFlow ? ' has-sel' : '')}>
      <div className="list">
        <div className="list-head"><div className="seg" role="group" aria-label="Filtro">
          ${filters.map(([k, l]) => html`<button key=${k} aria-pressed=${filtro === k} onClick=${() => setFiltro(k)}>${l}</button>`)}
        </div></div>
        <${FlowList} flows=${list} byFlow=${byFlow} sel=${sel} onSel=${setSel} who=${who} myTeam=${null}
          sectionOf=${f => needsMe(f) ? 0 : f.stato === 'in_attesa' ? 1 : (f.stato === 'respinto' || f.stato === 'chiuso') ? 3 : 2}
          sections=${['Da gestire', 'In attesa di una squadra', 'In corso', 'Concluse']}/>
      </div>
      <div className="detail">${selFlow
        ? html`<${FlowDetail} key=${selFlow.id} f=${selFlow} msgs=${byFlow[selFlow.id] || []} d=${d} who=${who} me=${{ id: user.id }} ops=${ops} cfg=${cfg}
            isMaster=${true} onCompose=${() => {}} onOpen=${id => setSel(id)} onBack=${() => setSel(null)} hasFlow=${id => d.flows.some(x => x.id === id)}/>`
        : html`<div className="doc" style=${{ maxWidth: '620px' }}><p>«Da gestire» raccoglie le comunicazioni inviate a cui nessun destinatario ha ancora risposto, le richieste delle squadre a una voce (per esempio all'Incident Manager) e le situazioni in cui una squadra ha scritto all'ultima voce.</p></div>`}
      </div></div>`;
  }
  else if (tab === 'copione') body = html`<${Copione} d=${d} cfg=${cfg} who=${who} ops=${ops} goFlow=${goFlow}/>`;
  else if (tab === 'fiducia') body = html`<${Fiducia} d=${d} ops=${ops}/>`;
  else if (tab === 'debriefing') body = html`<${Debriefing} d=${d} cfg=${cfg} who=${who} goFlow=${goFlow} ops=${ops}/>`;
  else if (tab === 'anteprima') body = html`<div>
      <div className="list-head" style=${{ justifyContent: 'flex-start', background: 'var(--paper)' }}>
        <span className="hint">Vedi quello che vede la squadra, in sola lettura:</span>
        <div className="seg">${who.ids.map(t => html`<button key=${t} aria-pressed=${pt === t} onClick=${() => setPrevTeam(t)}>${who.teamName(t)}</button>`)}</div>
      </div>
      ${pt ? html`<${Room} key=${pt} d=${d} ops=${ops} me=${{ id: 'anteprima', team: pt, preview: true }}/>` : html`<p className="empty" style=${{ padding: '16px' }}>Nessuna squadra: aggiungine una da Impostazioni.</p>`}
    </div>`;
  else if (tab === 'partecipanti') body = html`<${Partecipanti} d=${d} cfg=${cfg} who=${who} ops=${ops}/>`;
  else if (tab === 'impostazioni') body = html`<${Impostazioni} d=${d} cfg=${cfg} ops=${ops} load=${load}/>`;

  return html`<div className="app">
    <${Band} color="#152030" title="Regia" sub=${cfg.titolo} campaign=${d.campaign}>
      <button id="btn-vista-partecipanti" className="btn-light" disabled=${!pt} onClick=${() => setVista(pt)}>Vista partecipanti<small>come la vede una squadra</small></button>
      <button className="btn-light" onClick=${onLogout}>Esci</button>
    <//>
    ${err ? html`<div className="notice" role="alert">${err}</div>` : null}
    <${Tabs} tabs=${tabs} value=${tab} color="#152030" onChange=${t => { setTab(t); setSel(null); }}/>
    ${body}
    <${Toast} t=${ops.toast}/>
  </div>`;
}

function Sessione({ d, cfg, who, ops, gestire, goFlow }) {
  const [tempo, setTempo] = useState((d.campaign && d.campaign.tempo_sim) || '');
  useEffect(() => { setTempo((d.campaign && d.campaign.tempo_sim) || ''); }, [d.campaign && d.campaign.tempo_sim]);
  const fase = (d.campaign && d.campaign.fase) || '';
  const setFase = (nome, t) => ops.run(sb.rpc('set_fase', { p_fase: nome, p_tempo: t }), ['campaign', 'campaign_fasi'], 'Ora in corso: ' + nome);
  const cnt = (k, pred) => d.flows.filter(f => f.kind === k && pred(f)).length;
  const storico = d.campaign_fasi.slice().sort(byTime);
  return html`<div className="page">
    <h2>Fase in corso</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Le squadre vedono subito fase e tempo simulato nella loro banda. Ogni cambio resta nello storico e segna gli eventi.</p>
    <div className="fasi">${cfg.fasi.map(f => html`<button key=${f.nome} aria-pressed=${fase === f.nome} onClick=${() => setFase(f.nome, f.tempo)}>
      ${f.nome}${f.tempo ? html`<small>${f.tempo}</small>` : null}</button>`)}</div>
    <div className="grid2" style=${{ maxWidth: '640px' }}>
      <${Field} label="Tempo simulato mostrato alle squadre" hint="Per esempio «Giorno 1, ore 11:30». Cambialo quando l'orologio della simulazione avanza.">
        <input id="tempo-sim" type="text" value=${tempo} onChange=${e => setTempo(e.target.value)}/><//>
      <div style=${{ alignSelf: 'end', paddingBottom: '22px' }}><button className="btn" onClick=${() => setFase(fase, tempo)}>Aggiorna il tempo</button></div>
    </div>

    <${Tappe} d=${d} ops=${ops}/>
    <${Bivi} d=${d} ops=${ops}/>

    <div className="section"><h2>Il quadro</h2>
      <div className="stats">
        <div className="stat"><b>${gestire.length}</b><span>da gestire in regia</span></div>
        <div className="stat"><b>${d.flows.filter(nonInformata).length}</b><span>inviate in autonomia senza informativa</span></div>
        <div className="stat"><b>${cnt('canale', f => f.stato === 'in_attesa')}</b><span>richieste in attesa</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'in_attesa')}</b><span>esterne da autorizzare</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'approvato')}</b><span>autorizzate non inviate</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'inviato' || f.inviato_at)}</b><span>esterne inviate</span></div>
        <div className="stat"><b>${d.members.length}</b><span>partecipanti</span></div>
      </div>
      ${gestire.length ? html`<div className="cards">${gestire.map(f => html`<button key=${f.id} className="row" style=${{ '--rail': railOf(f, who), background: 'var(--paper)', border: '1px solid var(--line)' }} onClick=${() => goFlow(f.id)}>
        <span className="t">${f.titolo}</span><span className="m">${routeOf(f, who, null)}<${Stamp} f=${f}/></span></button>`)}</div>` : null}
    </div>

    <div className="section"><h2>Storico delle fasi</h2>
      ${storico.length ? html`<div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Fase</th><th>Tempo simulato</th></tr></thead><tbody>
        ${storico.map(s => html`<tr key=${s.id}><td className="n">${oraSec(s.created_at)}</td><td>${s.fase}</td><td>${s.tempo_sim}</td></tr>`)}
      </tbody></table></div>` : html`<p className="empty">La sessione non è ancora partita: scegli la prima fase.</p>`}
    </div>
  </div>`;
}

/* Tappe del piano incidenti: il facilitatore le segna quando accadono; il debriefing ne misura le distanze. */
function Tappe({ d, ops }) {
  const tappe = d.tappe.slice().sort((a, b) => a.ordine - b.ordine);
  if (!tappe.length) return null;
  const set = (k, at) => ops.run(sb.from('tappe').update({ at }).eq('chiave', k), ['tappe'], at ? 'Tappa segnata' : 'Tappa azzerata');
  return html`<div className="section"><h2>Tappe del piano</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Segnale quando accadono: nel debriefing si leggono i tempi tra una tappa e l'altra.</p>
    <div className="tbl-wrap"><table><thead><tr><th>Tappa</th><th>Ora</th><th>Dalla tappa precedente</th><th></th></tr></thead><tbody>
      ${tappe.map((t, i) => { const p = tappe[i - 1]; return html`<tr key=${t.chiave}><td>${t.nome}</td><td className="n">${t.at ? oraSec(t.at) : '—'}</td>
        <td className="n">${t.at && p && p.at ? durata(p.at, t.at) : ''}</td>
        <td><span style=${{ display: 'flex', gap: '6px' }}>${t.at
          ? html`<button className="btn plain small" onClick=${() => { if (window.confirm('Azzerare «' + t.nome + '»?')) set(t.chiave, null); }}>Azzera</button>`
          : html`<button id=${'tappa-' + t.chiave} className="btn small" onClick=${() => set(t.chiave, new Date().toISOString())}>Segna adesso</button>`}</span></td></tr>`; })}
    </tbody></table></div>
  </div>`;
}

/* Bivi: la scelta guida quali versioni del copione inviare. */
function Bivi({ d, ops }) {
  const bivi = d.bivi.slice().sort((a, b) => a.numero - b.numero);
  if (!bivi.length) return null;
  const set = (n, scelta) => ops.run(sb.from('bivi').update({ scelta }).eq('numero', n), ['bivi']);
  const noInf = d.flows.filter(nonInformata).length;
  return html`<div className="section"><h2>Bivi</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Segna come si è chiuso ogni bivio: nel copione le versioni che non servono più si attenuano.</p>
    <div className="cards">${bivi.map(b => html`<div key=${b.numero} className="card" style=${{ '--c': b.scelta === 'si' ? 'var(--ok)' : b.scelta === 'no' ? 'var(--no)' : '#98A2B0' }}>
      <div className="ch"><span className="t">${b.numero}. ${b.titolo}</span>
        <div className="seg" role="group" aria-label=${'Bivio ' + b.numero}>
          ${[['si', 'Sì'], ['no', 'No']].map(([k, l]) => html`<button key=${k} aria-pressed=${b.scelta === k} onClick=${() => set(b.numero, b.scelta === k ? null : k)}>${l}</button>`)}
        </div>
        ${b.numero === 6 ? html`<span className=${'tag' + (noInf ? ' warn' : '')}>${noInf ? noInf + ' invii in autonomia senza informativa' : 'Tutti gli invii in autonomia sono stati riferiti'}</span>` : null}</div>
      <div className="note"><b>Sì:</b> ${b.si}</div>
      <div className="note"><b>No:</b> ${b.no}</div>
    </div>`)}</div>
  </div>`;
}

const EMPTY_SIT = { fase: '', ordine: 0, titolo: '', voce: '', team_id: '', testo: '', condizione: '', note: '', tipo: 'situazione' };
function SituazioneForm({ init, cfg, who, onSave, onSend, onCancel }) {
  const defTeam = (who.teams.find(t => !t.autorizza) || who.teams[0] || {}).id || '';
  const [s, setS] = useState({ ...EMPTY_SIT, team_id: defTeam, fase: cfg.fasi[0] ? cfg.fasi[0].nome : '', voce: cfg.voci[0], ...init });
  const set = k => e => setS({ ...s, [k]: e.target.value });
  const ok = s.titolo.trim() && s.testo.trim() && s.voce.trim();
  return html`<div className="card" id="sit-form" style=${{ '--c': who.teamColor(s.team_id) }}>
    <div className="grid2">
      <${Field} label="Fase"><select value=${s.fase} onChange=${set('fase')}>${cfg.fasi.map(f => html`<option key=${f.nome}>${f.nome}</option>`)}
        ${s.fase && !cfg.fasi.some(f => f.nome === s.fase) ? html`<option>${s.fase}</option>` : null}</select><//>
      <${Field} label="Arriva a"><select id="sit-team" value=${s.team_id} onChange=${set('team_id')}>${who.ids.map(t => html`<option key=${t} value=${t}>${who.teamName(t)}</option>`)}</select><//>
      <${Field} label="Voce"><input id="sit-voce" type="text" list="voci-list" value=${s.voce} onChange=${set('voce')}/>
        <datalist id="voci-list">${cfg.voci.map(v => html`<option key=${v} value=${v}/>`)}</datalist><//>
      <${Field} label="Ordine nella fase"><input type="number" value=${s.ordine} onChange=${e => setS({ ...s, ordine: parseInt(e.target.value, 10) || 0 })}/><//>
      <${Field} label="Tipo"><select id="sit-tipo" value=${s.tipo || 'situazione'} onChange=${set('tipo')}><option value="situazione">Situazione nel portale</option><option value="monitor">Voce del monitor (la voce è la fonte)</option></select><//>
    </div>
    <${Field} label="Titolo"><input id="sit-titolo" type="text" value=${s.titolo} onChange=${set('titolo')}/><//>
    <${Field} label="Testo che arriva alla squadra"><textarea id="sit-testo" className="big" value=${s.testo} onChange=${set('testo')}></textarea><//>
    <${Field} label="Condizione (bivio)" hint="Facoltativa: quando usare questa versione."><input type="text" value=${s.condizione} onChange=${set('condizione')}/><//>
    <${Field} label="Note di regia" hint="Le vedi solo tu."><textarea value=${s.note} onChange=${set('note')}></textarea><//>
    <div className="actions">
      ${onSave ? html`<button id="sit-save" className="btn" disabled=${!ok} onClick=${() => onSave(s)}>Salva nel copione</button>` : null}
      ${onSend ? html`<button id="sit-send" className="btn send" disabled=${!ok} onClick=${() => onSend(s)}>Invia ora</button>` : null}
      <button className="btn plain" onClick=${onCancel}>Annulla</button>
    </div>
  </div>`;
}

function Copione({ d, cfg, who, ops, goFlow }) {
  const [edit, setEdit] = useState(null);   // id | 'nuova'
  const sendSit = (s, copioneId) => ops.run(sb.rpc('send_situazione', { p_team: s.team_id, p_voce: s.voce, p_titolo: s.titolo, p_testo: s.testo, p_copione: copioneId || null }),
    ['flows', 'copione'], 'Inviata a ' + who.teamName(s.team_id));
  // le voci del monitor non sono flussi: compaiono sullo schermo della squadra
  const sendMon = async (s, copioneId) => {
    const r = await ops.run(sb.from('monitor').insert({ team_id: s.team_id, fonte: s.voce, testo: s.testo, fase: (d.campaign && d.campaign.fase) || '' }),
      ['monitor'], 'Sul monitor di ' + who.teamName(s.team_id));
    if (!r.error && copioneId) await ops.run(sb.from('copione').update({ inviato_at: new Date().toISOString() }).eq('id', copioneId), ['copione']);
    return r;
  };
  const send = (s, copioneId) => (s.tipo === 'monitor' ? sendMon(s, copioneId) : sendSit(s, copioneId));
  const scelta = n => ((d.bivi.find(b => b.numero === n) || {}).scelta) || null;
  const statoBivio = c => { if (!c.bivio || !c.ramo) return null; const sc = scelta(c.bivio); return !sc ? 'aperto' : sc === c.ramo ? 'attivo' : 'escluso'; };
  const save = async (s, id) => {
    const row = { fase: s.fase, ordine: s.ordine, titolo: s.titolo.trim(), voce: s.voce.trim(), team_id: s.team_id, testo: s.testo, condizione: s.condizione, note: s.note, tipo: s.tipo || 'situazione' };
    const r = await ops.run(id ? sb.from('copione').update(row).eq('id', id) : sb.from('copione').insert(row), ['copione'], 'Salvata');
    if (!r.error) setEdit(null);
  };
  const ordineFasi = cfg.fasi.map(f => f.nome);
  const fasi = Array.from(new Set(ordineFasi.concat(d.copione.map(c => c.fase))));
  const fase = (d.campaign && d.campaign.fase) || '';
  return html`<div className="page">
    <h2>Copione</h2>
    <p className="hint" style=${{ marginTop: '4px', maxWidth: '70ch' }}>Le situazioni preparate per ogni fase. «Invia ora» le fa arrivare solo alla squadra indicata, con il cartello della voce; «Mostra sul monitor» fa comparire post e notizie sullo schermo della stanza. Dove c'è un bivio, segna la scelta in Sessione: le versioni escluse si attenuano.</p>
    <div className="actions">
      <button id="btn-new-sit" className="btn" onClick=${() => setEdit('nuova')}>+ Nuova situazione o voce del monitor</button>
    </div>
    <${MonitorRegia} d=${d} who=${who} ops=${ops}/>
    ${edit === 'nuova' ? html`<div className="cards"><${SituazioneForm} cfg=${cfg} who=${who} init=${{ fase: fase || EMPTY_SIT.fase }}
      onSave=${s => save(s)} onSend=${async s => { const r = await send(s); if (!r.error) setEdit(null); }} onCancel=${() => setEdit(null)}/></div>` : null}
    ${fasi.map(fn => {
      const all = d.copione.filter(c => c.fase === fn).sort((a, b) => a.ordine - b.ordine || a.id - b.id);
      if (!all.length) return null;
      const card = c => { const sb_ = statoBivio(c); const isMon = c.tipo === 'monitor'; const fatto = isMon ? c.inviato_at : c.inviato_flow;
        return edit === c.id
          ? html`<${SituazioneForm} key=${c.id} init=${c} cfg=${cfg} who=${who} onSave=${s => save(s, c.id)} onCancel=${() => setEdit(null)}/>`
          : html`<div key=${c.id} className=${'card' + (fatto || sb_ === 'escluso' ? ' done' : '')} style=${{ '--c': isMon ? '#C78A12' : who.teamColor(c.team_id) }} data-copione=${c.id}>
            <div className="ch"><span className="t">${c.titolo}</span><span className="placard">${c.voce}</span><span>${isMon ? 'sul monitor di' : 'a'} ${who.teamName(c.team_id)}</span>
              ${c.condizione ? html`<span className=${'tag' + (sb_ === 'attivo' ? '' : sb_ === 'escluso' ? '' : ' warn')}>${c.condizione}${sb_ === 'attivo' ? ' · da usare' : sb_ === 'escluso' ? ' · esclusa' : ''}</span>` : null}</div>
            <div className="x">${c.testo}</div>
            ${c.note ? html`<div className="note">Regia: ${c.note}</div>` : null}
            <div className="actions">
              ${isMon
                ? (c.inviato_at
                  ? html`<span className="hint">Sul monitor dalle ${ora(c.inviato_at)}</span>
                    <button className="btn plain small" onClick=${() => { if (window.confirm('Mostrarla di nuovo?')) send(c, c.id); }}>Mostra di nuovo</button>`
                  : html`<button className="btn send small" onClick=${() => send(c, c.id)}>Mostra sul monitor</button>`)
                : c.inviato_flow
                ? html`<span className="hint">Inviata alle ${ora((d.flows.find(f => f.id === c.inviato_flow) || {}).created_at)}</span>
                  <button className="btn plain small" onClick=${() => goFlow(c.inviato_flow)}>Apri</button>
                  <button className="btn plain small" onClick=${() => { if (window.confirm('Inviarla di nuovo?')) send(c, c.id); }}>Invia di nuovo</button>`
                : html`<button className="btn send small" onClick=${() => send(c, c.id)}>Invia ora</button>`}
              <button className="btn plain small" onClick=${() => setEdit(c.id)}>Modifica</button>
              <button className="btn plain small" onClick=${() => { if (window.confirm('Eliminare «' + c.titolo + '» dal copione?')) ops.run(sb.from('copione').delete().eq('id', c.id), ['copione'], 'Eliminata'); }}>Elimina</button>
            </div>
          </div>`; };
      const sit = all.filter(c => c.tipo !== 'monitor'), mon = all.filter(c => c.tipo === 'monitor');
      return html`<section key=${fn}><h3 className="phase-h">${fn}${fn === fase ? ' (in corso)' : ''}</h3>
        ${sit.length ? html`<div className="cards">${sit.map(card)}</div>` : null}
        ${mon.length ? html`<h3 style=${{ marginTop: '16px' }}>Monitor della stanza</h3><div className="cards">${mon.map(card)}</div>` : null}
      </section>`;
    })}
  </div>`;
}

/* Post liberi sul monitor e ciò che è già comparso, con la possibilità di toglierlo. */
function MonitorRegia({ d, who, ops }) {
  const defTeam = (who.teams.find(t => t.autorizza) || who.teams[0] || {}).id || '';
  const [team, setTeam] = useState(defTeam);
  const [fonte, setFonte] = useState('');
  const [testo, setTesto] = useState('');
  const items = d.monitor.slice().sort((a, b) => byTime(b, a));
  const add = async () => {
    const r = await ops.run(sb.from('monitor').insert({ team_id: team, fonte: fonte.trim() || 'Social', testo: testo.trim(), fase: (d.campaign && d.campaign.fase) || '' }),
      ['monitor'], 'Sul monitor di ' + who.teamName(team));
    if (!r.error) { setTesto(''); }
  };
  return html`<details className="panel regia" style=${{ maxWidth: '980px' }}>
    <summary><b>Monitor delle stanze</b> <span className="hint">· ${items.length} voci mostrate · aggiungi un post fuori copione</span></summary>
    <div className="grid2">
      <${Field} label="Su quale monitor"><select id="mon-team" value=${team} onChange=${e => setTeam(e.target.value)}>${who.teams.map(t => html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}</select><//>
      <${Field} label="Fonte"><input id="mon-fonte" type="text" value=${fonte} placeholder="Per esempio: Social · automobilista" onChange=${e => setFonte(e.target.value)}/><//>
    </div>
    <${Field} label="Testo"><textarea id="mon-testo" value=${testo} onChange=${e => setTesto(e.target.value)}></textarea><//>
    <div className="actions"><button id="mon-add" className="btn send small" disabled=${!team || !testo.trim()} onClick=${add}>Mostra sul monitor</button></div>
    ${items.length ? html`<div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Monitor</th><th>Fonte</th><th>Testo</th><th></th></tr></thead><tbody>
      ${items.map(m => html`<tr key=${m.id}><td className="n">${ora(m.created_at)}</td><td>${who.teamName(m.team_id)}</td><td>${m.fonte}</td><td>${m.testo}</td>
        <td><button className="link" onClick=${() => { if (window.confirm('Togliere questa voce dal monitor?')) ops.run(sb.from('monitor').delete().eq('id', m.id), ['monitor'], 'Tolta dal monitor'); }}>Togli</button></td></tr>`)}
    </tbody></table></div>` : null}
  </details>`;
}

function Fiducia({ d, ops }) {
  const [motivo, setMotivo] = useState('');
  const [delta, setDelta] = useState('');
  const serie = fiduciaSerie(d.fiducia);
  const valore = serie.length ? serie[serie.length - 1].valore : 100;
  const fase = (d.campaign && d.campaign.fase) || '';
  const add = async n => {
    if (!n) return;
    const r = await ops.run(sb.from('fiducia').insert({ delta: n, motivo: motivo.trim(), fase }), ['fiducia'], 'Fiducia ' + (n > 0 ? '+' : '') + n);
    if (!r.error) { setMotivo(''); setDelta(''); }
  };
  return html`<div className="page">
    <h2>Fiducia dei clienti</h2>
    <p className="hint" style=${{ marginTop: '4px', maxWidth: '70ch' }}>Parte da 100 e si muove con la qualità delle comunicazioni e con gli impegni mantenuti. Le squadre non la vedono: se ne legge l'andamento nella discussione finale.</p>
    <div style=${{ display: 'flex', gap: '28px', alignItems: 'flex-end', flexWrap: 'wrap', marginTop: '16px' }}>
      <div><div className="big-num" id="fiducia-val">${valore}</div><span className="hint">su 100</span></div>
      <div style=${{ flex: '1', minWidth: '260px', maxWidth: '520px' }}>
        <${Field} label="Perché cambia"><input id="fiducia-motivo" type="text" value=${motivo} placeholder="Per esempio: avviso ai 41 clienti chiaro e puntuale" onChange=${e => setMotivo(e.target.value)}/><//>
        <div className="actions">
          ${[-10, -5, 5, 10].map(n => html`<button key=${n} className=${'btn small ' + (n < 0 ? 'no' : 'ok')} onClick=${() => add(n)}>${n > 0 ? '+' + n : n}</button>`)}
          <input type="number" style=${{ width: '90px' }} value=${delta} placeholder="±" onChange=${e => setDelta(e.target.value)}/>
          <button className="btn plain small" onClick=${() => add(parseInt(delta, 10) || 0)}>Applica</button>
        </div>
      </div>
    </div>
    <div className="section"><${FiduciaChart} serie=${serie}/></div>
    <div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Fase</th><th>Variazione</th><th>Valore</th><th>Motivo</th><th></th></tr></thead><tbody>
      ${serie.slice().reverse().map(x => html`<tr key=${x.id}><td className="n">${ora(x.created_at)}</td><td>${x.fase}</td><td className="n">${x.delta > 0 ? '+' : ''}${x.delta}</td><td>${x.valore}</td><td>${x.motivo}</td>
        <td><button className="link" onClick=${() => { if (window.confirm('Togliere questa variazione?')) ops.run(sb.from('fiducia').delete().eq('id', x.id), ['fiducia']); }}>Togli</button></td></tr>`)}
      ${!serie.length ? html`<tr><td colSpan="6" className="hint">Nessuna variazione.</td></tr>` : null}
    </tbody></table></div>
  </div>`;
}

function cronologia(d, who) {
  const flow = id => d.flows.find(f => f.id === id) || {};
  const rows = [];
  d.flow_events.forEach(e => { const f = flow(e.flow_id); rows.push({ t: e.created_at, fase: e.fase || faseAt(d.campaign_fasi, e.created_at), cosa: EVENTI[e.evento] || e.evento,
    squadra: e.team_id === 'regia' ? 'Regia' : who.teamName(e.team_id), chi: e.team_id === 'regia' && f.kind === 'situazione' ? f.voce : who.name(e.user_id),
    ruolo: (who.member(e.user_id) || {}).ruolo || '', flusso: f.titolo || '', verso: f.kind === 'esterna' ? destText(f) : '', tipo: KIND_LABEL[f.kind] || '',
    testo: e.evento === 'aperto' || e.evento === 'situazione' ? f.motivo : (e.nota || ''), team: e.team_id }); });
  d.messages.forEach(m => { const f = flow(m.flow_id); rows.push({ t: m.created_at, fase: faseAt(d.campaign_fasi, m.created_at), cosa: m.voce ? 'Risposta di una voce' : 'Messaggio',
    squadra: m.voce ? 'Regia' : who.teamName(m.team_id), chi: m.voce || who.name(m.author), ruolo: m.ruolo || '', flusso: f.titolo || '', verso: f.destinatario || '',
    tipo: KIND_LABEL[f.kind] || '', testo: m.testo, team: m.team_id || 'regia' }); });
  d.registro.forEach(r => rows.push({ t: r.created_at, fase: r.fase || '', cosa: 'Registro', squadra: who.teamName(r.team_id), chi: who.name(r.author), ruolo: r.ruolo || '',
    flusso: '', verso: '', tipo: 'Registro', testo: r.testo, team: r.team_id }));
  return rows.sort((a, b) => ms(a.t) - ms(b.t));
}

function Debriefing({ d, cfg, who, goFlow, ops }) {
  const [vedi, setVedi] = useState('tutto');
  const rows = cronologia(d, who);
  const serie = fiduciaSerie(d.fiducia);
  const media = v => { const xs = CRITERI.map(([k]) => v[k]).filter(Boolean); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
  const valutate = d.valutazioni.map(v => ({ v, f: d.flows.find(f => f.id === v.flow_id) })).filter(x => x.f).sort((a, b) => byTime(a.f, b.f));
  const conFase = ts => ts ? ora(ts) + ' ' + (faseBreve(faseAt(d.campaign_fasi, ts)) || '') : '';
  const valOf = f => d.valutazioni.find(v => v.flow_id === f.id) || {};
  // a quale comunicazione prevista corrisponde un flusso: quella scelta in valutazione, altrimenti il suggerimento
  const previstaOf = f => { const v = valOf(f); return v.prevista_id != null ? v.prevista_id : guessPrevista(f, d.previste); };
  const previste = d.previste.slice().sort((a, b) => a.ordine - b.ordine).map(c => {
    const fs = d.flows.filter(f => f.kind !== 'situazione' && previstaOf(f) === c.id).sort(byTime);
    const aut = fs.filter(f => f.decided_at && f.stato !== 'respinto').sort((a, b) => ms(a.decided_at) - ms(b.decided_at))[0];
    const inv = fs.filter(f => f.inviato_at).sort((a, b) => ms(a.inviato_at) - ms(b.inviato_at))[0];
    const vs = fs.map(f => d.valutazioni.find(v => v.flow_id === f.id)).filter(Boolean).map(media).filter(x => x != null);
    const deleghe = fs.map(f => valOf(f).delega).filter(Boolean);
    return { c, fs, prep: fs[0], aut, inv, deleghe, media: vs.length ? (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1) : '' };
  });
  const autonome = d.flows.filter(f => autonoma(f) && f.stato === 'inviato').sort(byTime);
  const conModello = d.flows.filter(f => f.modello).sort(byTime);
  const tappe = d.tappe.slice().sort((a, b) => a.ordine - b.ordine);
  const contaDeleghe = DELEGHE.map(([k, l]) => [l, d.valutazioni.filter(v => v.delega === k).length]);
  const delegaLbl = k => (DELEGHE.find(x => x[0] === k) || [])[1] || '';
  const persone = d.members.map(m => {
    const dec = d.flows.filter(f => f.decided_by === m.user_id && f.to_team);
    const tempi = dec.map(f => ms(f.decided_at) - ms(f.created_at));
    return { m, aperte: d.flows.filter(f => f.opened_by === m.user_id && f.kind !== 'situazione').length, decisioni: dec.length,
      invii: d.flows.filter(f => f.inviato_by === m.user_id).length, messaggi: d.messages.filter(x => x.author === m.user_id).length,
      registro: d.registro.filter(r => r.author === m.user_id).length,
      risposta: tempi.length ? durata(0, tempi.reduce((a, b) => a + b, 0) / tempi.length) : '' };
  });
  const exportCrono = () => download('cronologia.csv', csv([['Ora', 'Fase', 'Evento', 'Squadra', 'Chi', 'Ruolo', 'Tipo', 'Flusso', 'Destinatario', 'Testo']]
    .concat(rows.map(r => [oraSec(r.t), r.fase, r.cosa, r.squadra, r.chi, r.ruolo, r.tipo, r.flusso, r.verso, r.testo]))), 'text/csv;charset=utf-8');
  const exportVal = () => download('valutazioni.csv', csv([['Flusso', 'Tipo', 'Destinatario', 'Copia nascosta', 'Canale', 'Squadra', 'Preparata', 'Inviata', 'Senza autorizzazione', 'Informativa', 'Comunicazione prevista', 'Verdetto deleghe'].concat(CRITERI.map(c => c[1])).concat(['Media', 'Note'])]
    .concat(valutate.map(({ v, f }) => [f.titolo, f.tipo, f.destinatario || '', f.ccn || '', f.canale || '', who.teamName(f.from_team || f.to_team), oraSec(f.created_at), oraSec(f.inviato_at),
      f.diretta ? 'sì' : '', autonoma(f) ? (f.informata_at ? oraSec(f.informata_at) : 'non informata') : '',
      ((d.previste.find(p => p.id === previstaOf(f)) || {}).tipo) || '', delegaLbl(v.delega)]
      .concat(CRITERI.map(([k]) => v[k] || '')).concat([media(v) != null ? media(v).toFixed(1) : '', v.nota || ''])))), 'text/csv;charset=utf-8');
  const exportJson = () => download('sessione-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({
    esportato: new Date().toISOString(), campaign: d.campaign, campaign_fasi: d.campaign_fasi, teams: d.teams, members: d.members, flows: d.flows,
    messages: d.messages, registro: d.registro, flow_events: d.flow_events, valutazioni: d.valutazioni, fiducia: d.fiducia, copione: d.copione,
    monitor: d.monitor, previste: d.previste, tappe: d.tappe, bivi: d.bivi, punti: d.punti }, null, 2), 'application/json');
  const filt = rows.filter(r => vedi === 'tutto' || r.team === vedi || (vedi === 'regia' && r.team === 'regia'));
  return html`<div className="page" style=${{ maxWidth: '1200px' }}>
    <h2>Debriefing</h2>
    <div className="actions">
      <button className="btn plain small" onClick=${exportCrono}>Scarica la cronologia (CSV)</button>
      <button className="btn plain small" onClick=${exportVal}>Scarica le valutazioni (CSV)</button>
      <button className="btn plain small" onClick=${exportJson}>Scarica tutto (JSON)</button>
    </div>

    ${tappe.length ? html`<div className="section"><h3>Tempi del piano incidenti</h3>
      <div className="stats">${tappe.map((t, i) => html`<div key=${t.chiave} className="stat"><b>${t.at ? ora(t.at) : '—'}</b><span>${t.nome}${i && t.at && tappe[i - 1].at ? ' · ' + durata(tappe[i - 1].at, t.at) + ' dalla precedente' : ''}</span></div>`)}</div>
    </div>` : null}

    <div className="section"><h3>Comunicazioni previste dallo scenario</h3>
      <p className="hint">Per ciascuna: quando è stata preparata, autorizzata e inviata la prima volta, con la fase in cui è successo. L'abbinamento si corregge nella valutazione di ogni flusso.</p>
      <div className="tbl-wrap"><table><thead><tr><th>Comunicazione</th><th>Destinatario</th><th>Prepara</th><th>Autorizza e firma</th><th>Termine</th><th>Fase</th><th>Preparata</th><th>Autorizzata</th><th>Inviata</th><th>Versioni</th><th>Deleghe</th><th>Media</th></tr></thead><tbody>
        ${previste.map(p => html`<tr key=${p.c.id}><td>${p.c.ordine}. ${p.c.tipo}</td><td>${p.c.destinatario}</td><td>${p.c.prepara}</td><td>${p.c.autorizza}</td><td>${p.c.termine}</td><td>${p.c.fase}</td>
          <td className="n">${p.prep ? html`<button className="link" onClick=${() => goFlow(p.prep.id)}>${conFase(p.prep.created_at)}</button>` : html`<span className="miss">mai</span>`}</td>
          <td className="n">${p.aut && !p.aut.diretta ? conFase(p.aut.decided_at) : (p.inv && p.inv.diretta ? html`<span className="tag warn">senza autorizzazione</span>` : '')}</td>
          <td className="n">${p.inv ? conFase(p.inv.inviato_at) : (p.prep && p.prep.kind === 'esterna' ? html`<span className="miss">non inviata</span>` : '')}</td>
          <td>${p.fs.length || ''}</td><td>${p.deleghe.map(delegaLbl).join(', ')}</td><td>${p.media}</td></tr>`)}
        ${!previste.length ? html`<tr><td colSpan="12" className="hint">Nessuna comunicazione prevista caricata.</td></tr>` : null}
      </tbody></table></div>
    </div>

    <div className="section"><h3>Deleghe e informative</h3>
      <div className="stats">
        ${contaDeleghe.map(([l, n]) => html`<div key=${l} className="stat"><b>${n}</b><span>${l}</span></div>`)}
        <div className="stat"><b>${autonome.length}</b><span>invii in autonomia</span></div>
        <div className="stat"><b className=${autonome.some(f => !f.informata_at) ? 'miss' : ''}>${autonome.filter(f => !f.informata_at).length}</b><span>senza informativa all'altra stanza</span></div>
      </div>
      ${autonome.length ? html`<div className="tbl-wrap"><table><thead><tr><th>Inviata</th><th>Da</th><th>Comunicazione</th><th>A</th><th>Come</th><th>Informativa</th><th>Verdetto</th></tr></thead><tbody>
        ${autonome.map(f => html`<tr key=${f.id}><td className="n">${conFase(f.inviato_at)}</td><td>${who.teamName(f.from_team)}<br/><span className="hint">${who.name(f.inviato_by || f.opened_by)}</span></td>
          <td><button className="link" onClick=${() => goFlow(f.id)}>${f.titolo}</button></td><td>${destText(f)}</td>
          <td>${f.diretta ? html`<span className="tag warn">senza autorizzazione</span>` : 'firmata in proprio'}</td>
          <td className="n">${f.informata_at ? ora(f.informata_at) + ' (dopo ' + durata(f.inviato_at, f.informata_at) + ')' : html`<span className="miss">non informata</span>`}</td>
          <td>${delegaLbl(valOf(f).delega)}</td></tr>`)}
      </tbody></table></div>` : null}
    </div>

    ${conModello.length ? html`<div className="section"><h3>Modelli del Piano di gestione delle crisi</h3>
      <p className="hint">Quanto ogni testo si discosta dal modello di partenza: sotto il 15% è stato usato quasi così com'è.</p>
      <div className="tbl-wrap"><table><thead><tr><th>Comunicazione</th><th>A</th><th>Modello</th><th>Scarto</th></tr></thead><tbody>
        ${conModello.map(f => { const m = cfg.modelli.find(x => x.nome === f.modello); const s = m ? scarto(f.motivo, m.testo) : null;
          return html`<tr key=${f.id}><td><button className="link" onClick=${() => goFlow(f.id)}>${f.titolo}</button></td><td>${destText(f)}</td><td>${f.modello}</td>
            <td>${s == null ? '' : html`<span className=${'tag' + (s < 15 ? ' warn' : '')}>${s < 15 ? 'quasi identico' : 'adattato'} · ${s}%</span>`}</td></tr>`; })}
      </tbody></table></div>
    </div>` : null}

    <div className="section"><h3>Registri a confronto</h3>
      <div className="cols">${who.ids.map(t => html`<div key=${t} className="col" style=${{ '--c': who.teamColor(t) }}><h3>${who.teamName(t)}</h3>
        <ol className="reg" style=${{ marginTop: '0' }}>${d.registro.filter(r => r.team_id === t).sort(byTime).map(r => html`<li key=${r.id} style=${{ gridTemplateColumns: '70px 1fr' }}>
          <div><time>${ora(r.created_at)}</time><span className="sim">${r.tempo_sim || ''}</span></div>
          <div><div className="x">${r.testo}</div><div className="by">${who.name(r.author)}${r.ruolo ? ', ' + r.ruolo : ''}</div></div></li>`)}</ol>
        ${!d.registro.some(r => r.team_id === t) ? html`<p className="empty">Registro vuoto.</p>` : null}
      </div>`)}</div>
    </div>

    <div className="section"><h3>Fiducia dei clienti: ${serie.length ? serie[serie.length - 1].valore : 100}</h3><${FiduciaChart} serie=${serie}/></div>

    <div className="section"><h3>Valutazioni</h3>
      <div className="tbl-wrap"><table><thead><tr><th>Comunicazione</th><th>Destinatario</th><th>Deleghe</th>${CRITERI.map(c => html`<th key=${c[0]}>${c[1]}</th>`)}<th>Media</th><th>Note</th></tr></thead><tbody>
        ${valutate.map(({ v, f }) => html`<tr key=${f.id}><td><button className="link" onClick=${() => goFlow(f.id)}>${f.titolo}</button></td><td>${f.kind === 'esterna' ? destText(f) : f.kind === 'situazione' ? f.voce : who.teamName(f.to_team)}</td>
          <td>${delegaLbl(v.delega)}</td>${CRITERI.map(([k]) => html`<td key=${k}>${v[k] || ''}</td>`)}<td>${media(v) != null ? media(v).toFixed(1) : ''}</td><td>${v.nota}</td></tr>`)}
        ${!valutate.length ? html`<tr><td colSpan="11" className="hint">Nessuna valutazione: si danno dal dettaglio di ogni flusso.</td></tr>` : null}
      </tbody></table></div>
    </div>

    ${d.punti.length ? html`<div className="section"><h3>Punti dei piani messi alla prova</h3>
      <p className="hint">Per ogni punto due righe: cosa è successo in sala e una proposta di modifica. Si salvano quando esci dal campo.</p>
      <div className="cards">${d.punti.slice().sort((a, b) => a.ordine - b.ordine).map(p => html`<${PuntoPiano} key=${p.id} p=${p} ops=${ops}/>`)}</div>
    </div>` : null}

    <div className="section"><h3>Partecipazione</h3>
      <div className="tbl-wrap"><table><thead><tr><th>Persona</th><th>Squadra</th><th>Ruolo</th><th>Aperte</th><th>Decisioni</th><th>Tempo medio di decisione</th><th>Invii</th><th>Messaggi</th><th>Registro</th></tr></thead><tbody>
        ${persone.map(p => html`<tr key=${p.m.user_id}><td>${p.m.nome}</td><td>${who.teamName(p.m.team_id)}</td><td>${p.m.ruolo}</td><td>${p.aperte}</td><td>${p.decisioni}</td><td>${p.risposta}</td><td>${p.invii}</td><td>${p.messaggi}</td><td>${p.registro}</td></tr>`)}
      </tbody></table></div>
    </div>

    <div className="section"><h3>Cronologia completa</h3>
      <div className="seg" style=${{ marginTop: '8px' }}>${[['tutto', 'Tutto']].concat(who.teams.map(t => [t.id, t.nome]), [['regia', 'Voci']]).map(([k, l]) => html`<button key=${k} aria-pressed=${vedi === k} onClick=${() => setVedi(k)}>${l}</button>`)}</div>
      <div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Fase</th><th>Evento</th><th>Chi</th><th>Flusso</th><th>Testo</th></tr></thead><tbody>
        ${filt.map((r, i) => html`<tr key=${i}><td className="n">${oraSec(r.t)}</td><td>${r.fase}</td><td>${r.cosa}</td><td>${r.chi}${r.ruolo ? html`<br/><span className="hint">${r.ruolo}</span>` : null}<br/><span className="hint">${r.squadra}</span></td>
          <td>${r.flusso}${r.verso ? html`<br/><span className="hint">a ${r.verso}</span>` : null}</td><td className="x">${r.testo}</td></tr>`)}
      </tbody></table></div>
    </div>
  </div>`;
}

function PuntoPiano({ p, ops }) {
  const [a, setA] = useState(p.accaduto || '');
  const [b, setB] = useState(p.proposta || '');
  const save = patch => ops.run(sb.from('punti').update(patch).eq('id', p.id), ['punti']);
  return html`<div className="card" style=${{ '--c': '#152030' }}>
    <div className="ch"><span className="t">${p.ordine}. ${p.punto}</span><span className="tag">${p.dove}</span></div>
    <div className="note">${p.documenti}</div>
    <div className="grid2">
      <${Field} label="Cosa è successo in sala"><textarea value=${a} onChange=${e => setA(e.target.value)} onBlur=${() => { if (a !== (p.accaduto || '')) save({ accaduto: a }); }}></textarea><//>
      <${Field} label="Proposta di modifica"><textarea value=${b} onChange=${e => setB(e.target.value)} onBlur=${() => { if (b !== (p.proposta || '')) save({ proposta: b }); }}></textarea><//>
    </div>
  </div>`;
}

function Partecipanti({ d, cfg, who, ops }) {
  const upd = (id, patch, msg) => ops.run(sb.from('members').update(patch).eq('user_id', id), ['members'], msg);
  const codice = t => (d.team_codes.find(c => c.team_id === t) || {}).code;
  return html`<div className="page">
    <h2>Partecipanti</h2>
    <p className="hint" style=${{ marginTop: '4px' }}>Ognuno entra con il codice della propria squadra. Puoi spostare una persona o correggerne il ruolo.</p>
    <div className="people">${who.ids.map(t => html`<div key=${t} className="col" style=${{ '--c': who.teamColor(t) }}>
      <h3>${who.teamName(t)}</h3>
      <p className="hint">Codice: ${codice(t) ? html`<b>${codice(t)}</b>` : html`<span className="miss">nessuno, impostalo in Impostazioni</span>`}</p>
      ${d.members.filter(m => m.team_id === t).sort((a, b) => a.nome.localeCompare(b.nome)).map(m => html`<div key=${m.user_id} className="person">
        <b>${m.nome}</b>
        <select value=${m.ruolo} aria-label=${'Ruolo di ' + m.nome} onChange=${e => upd(m.user_id, { ruolo: e.target.value }, 'Ruolo aggiornato')}>
          <option value="">Nessun ruolo</option>${Array.from(new Set((cfg.ruoli[t] || []).concat(m.ruolo ? [m.ruolo] : []))).map(r => html`<option key=${r}>${r}</option>`)}
        </select>
        <span style=${{ display: 'flex', gap: '6px' }}>
          <select className="btn plain small" style=${{ width: 'auto' }} value="" aria-label=${'Sposta ' + m.nome}
            onChange=${e => { if (e.target.value) upd(m.user_id, { team_id: e.target.value, ruolo: '' }, 'Spostata in ' + who.teamName(e.target.value)); }}>
            <option value="">Sposta in…</option>${who.others(t).map(o => html`<option key=${o.id} value=${o.id}>${o.nome}</option>`)}
          </select>
          <button className="btn plain small" onClick=${() => { if (window.confirm('Togliere ' + m.nome + ' dalla simulazione? Potrà rientrare con il codice.')) ops.run(sb.from('members').delete().eq('user_id', m.user_id), ['members'], 'Tolta'); }}>Togli</button>
        </span>
      </div>`)}
      ${!d.members.some(m => m.team_id === t) ? html`<p className="empty">Nessuno ancora.</p>` : null}
    </div>`)}</div>
  </div>`;
}

const lines = a => a.join('\n');
const unlines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const COLORI_SQUADRA = ['#3B2F8F', '#0B6F6A', '#9A3412', '#1D4ED8', '#7E22CE', '#B45309', '#BE185D', '#15803D'];
function Impostazioni({ d, cfg, ops, load }) {
  const who = makeWho(d);
  const codeOf = id => (d.team_codes.find(c => c.team_id === id) || {}).code || '';
  const [f, setF] = useState(() => ({
    titolo: cfg.titolo,
    tipi: lines(cfg.tipi_canale), destinatari: lines(cfg.destinatari), voci: lines(cfg.voci),
    fasi: lines(cfg.fasi.map(x => x.nome + (x.tempo ? ' | ' + x.tempo : ''))),
    tipiEst: lines(cfg.tipi_esterni.length ? cfg.tipi_esterni : cfg.comunicazioni.map(c => c.tipo)), canali: lines(cfg.canali),
  }));
  const [squadre, setSquadre] = useState(() => who.teams.map(t => ({
    id: t.id, nome: t.nome || '', colore: t.colore || '#5A6576', autorizza: !!t.autorizza, code: codeOf(t.id), ruoli: lines(cfg.ruoli[t.id] || []) })));
  const set = k => e => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const setSq = (i, k) => e => setSquadre(squadre.map((s, j) => j === i ? { ...s, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value } : s));
  const aggiungi = () => {
    const usati = new Set(squadre.map(s => s.id));
    const id = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(c => !usati.has(c)) || ('T' + (squadre.length + 1));
    setSquadre(squadre.concat([{ id, nome: 'Squadra ' + id, colore: COLORI_SQUADRA[squadre.length % COLORI_SQUADRA.length], autorizza: false, code: '', ruoli: '' }]));
  };
  const togli = i => {
    const s = squadre[i];
    const n = d.members.filter(m => m.team_id === s.id).length;
    if (n) { ops.say(s.nome + ' ha ' + n + ' partecipanti: spostali in un\'altra squadra prima di toglierla.', 'err'); return; }
    if (d.flows.some(x => x.from_team === s.id || x.to_team === s.id) || d.registro.some(r => r.team_id === s.id)) {
      ops.say(s.nome + ' ha già flussi o voci di registro: azzera la simulazione prima di toglierla.', 'err'); return;
    }
    setSquadre(squadre.filter((_, j) => j !== i));
  };
  const save = async () => {
    const nomi = squadre.map(s => s.nome.trim());
    if (!squadre.length) { ops.say('Serve almeno una squadra.', 'err'); return; }
    if (nomi.some(n => !n)) { ops.say('Ogni squadra deve avere un nome.', 'err'); return; }
    const codici = squadre.map(s => s.code.trim().toUpperCase()).filter(Boolean);
    if (new Set(codici).size !== codici.length) { ops.say('Due squadre hanno lo stesso codice: ogni codice deve essere diverso.', 'err'); return; }
    const raw = d.campaign && d.campaign.config ? d.campaign.config : {};
    const config = normCfg({ ...raw, titolo: f.titolo, ruoli: Object.fromEntries(squadre.map(s => [s.id, unlines(s.ruoli)])), tipi_canale: unlines(f.tipi),
      destinatari: unlines(f.destinatari), voci: unlines(f.voci),
      fasi: unlines(f.fasi).map(l => { const [nome, tempo] = l.split('|').map(x => x.trim()); return { nome, tempo: tempo || '' }; }),
      tipi_esterni: unlines(f.tipiEst), canali: unlines(f.canali) });
    const tolte = d.teams.filter(t => !squadre.some(s => s.id === t.id)).map(t => t.id);
    const errs = [];
    const ops_ = [
      sb.from('campaign').update({ config }).eq('id', 1),
      sb.from('teams').upsert(squadre.map((s, i) => ({ id: s.id, nome: s.nome.trim(), colore: s.colore, autorizza: s.autorizza, ordine: i + 1 }))),
    ];
    // prima si liberano i codici cambiati, poi si scrivono quelli nuovi (il codice è unico tra le squadre)
    const senzaCodice = squadre.filter(s => !s.code.trim()).map(s => s.id);
    if (senzaCodice.length) ops_.push(sb.from('team_codes').delete().in('team_id', senzaCodice));
    for (const p of ops_) { const r = await ops.run(p); if (r.error) errs.push(r.error); }
    if (!errs.length && tolte.length) { const r = await ops.run(sb.from('teams').delete().in('id', tolte)); if (r.error) errs.push(r.error); }
    if (!errs.length) {
      const conCodice = squadre.filter(s => s.code.trim());
      if (conCodice.length) {
        const r0 = await ops.run(sb.from('team_codes').delete().in('team_id', conCodice.map(s => s.id)));
        if (r0.error) errs.push(r0.error);
        else { const r = await ops.run(sb.from('team_codes').insert(conCodice.map(s => ({ team_id: s.id, code: s.code.trim() })))); if (r.error) errs.push(r.error); }
      }
    }
    ['campaign', 'teams', 'team_codes', 'settings'].forEach(load);
    if (!errs.length) ops.say('Impostazioni salvate');
  };
  const azzera = async () => {
    if (!window.confirm('Azzerare la simulazione? Si cancellano flussi, messaggi, registri, valutazioni, fiducia e storico delle fasi. Partecipanti, copione e impostazioni restano.')) return;
    if ((window.prompt('Per confermare scrivi AZZERA') || '').trim().toUpperCase() !== 'AZZERA') return;
    const z = '00000000-0000-0000-0000-000000000000';
    for (const p of [sb.from('flows').delete().neq('id', z), sb.from('registro').delete().gte('id', 0), sb.from('fiducia').delete().gte('id', 0),
      sb.from('campaign_fasi').delete().gte('id', 0)]) { const r = await ops.run(p); if (r.error) return; }
    await ops.run(sb.rpc('set_fase', { p_fase: cfg.fasi[0].nome, p_tempo: cfg.fasi[0].tempo }));
    T_ALL.concat(T_MASTER).forEach(load);
    ops.say('Simulazione azzerata');
  };
  const team = (s, i) => html`<div key=${s.id} className="card" style=${{ '--c': s.colore }} data-team=${s.id}>
    <div className="grid2">
      <${Field} label="Nome della squadra"><input type="text" value=${s.nome} onChange=${setSq(i, 'nome')}/><//>
      <${Field} label="Codice per entrare" hint=${s.code.trim() ? null : 'Senza codice nessuno può entrare in questa squadra.'}><input type="text" value=${s.code} onChange=${setSq(i, 'code')}/><//>
    </div>
    <div className="actions"><label style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="color" value=${s.colore} onChange=${setSq(i, 'colore')}/> Colore</label>
      <label style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="checkbox" checked=${s.autorizza} onChange=${setSq(i, 'autorizza')}/> Autorizza le comunicazioni esterne</label>
      <span style=${{ flex: 1 }}></span>
      <button className="btn plain small" onClick=${() => togli(i)}>Togli la squadra</button></div>
    <${Field} label="Ruoli del piano (uno per riga)"><textarea value=${s.ruoli} onChange=${setSq(i, 'ruoli')}></textarea><//>
  </div>`;
  return html`<div className="page">
    <h2>Impostazioni</h2>
    <${Field} label="Titolo della simulazione"><input type="text" value=${f.titolo} onChange=${set('titolo')}/><//>
    <div className="section" style=${{ marginTop: '22px' }}><h3>Squadre · ${squadre.length}</h3></div>
    <div className="cards">${squadre.map(team)}</div>
    <div className="actions"><button id="btn-add-team" className="btn plain" onClick=${aggiungi}>+ Aggiungi una squadra</button></div>
    <p className="hint" style=${{ marginTop: '8px' }}>Le comunicazioni esterne le autorizza una squadra con «Autorizza»; quelle che scrive lei le firma da sola. Le richieste tra le stanze vanno alla squadra che sceglie chi scrive. Le modifiche valgono dopo «Salva le impostazioni». L'email del facilitatore si cambia solo dall'SQL.</p>
    <div className="grid2">
      <${Field} label="Tipi di richiesta tra le stanze"><textarea value=${f.tipi} onChange=${set('tipi')}></textarea><//>
      <${Field} label="Destinatari esterni"><textarea value=${f.destinatari} onChange=${set('destinatari')}></textarea><//>
      <${Field} label="Voci del facilitatore"><textarea value=${f.voci} onChange=${set('voci')}></textarea><//>
      <${Field} label="Fasi" hint="Una per riga: nome | tempo simulato"><textarea value=${f.fasi} onChange=${set('fasi')}></textarea><//>
    </div>
    <div className="grid2">
      <${Field} label="Tipi di comunicazione esterna" hint="Le squadre li scelgono quando scrivono all'esterno. Meglio generici: le comunicazioni previste dallo scenario restano riservate alla regia."><textarea value=${f.tipiEst} onChange=${set('tipiEst')}></textarea><//>
      <${Field} label="Canali" hint="Email, pagina di stato, messaggio nel gestionale…"><textarea value=${f.canali} onChange=${set('canali')}></textarea><//>
    </div>
    <div className="actions"><button id="save-settings" className="btn" onClick=${save}>Salva le impostazioni</button></div>
    <div className="section panel" style=${{ borderLeft: '5px solid var(--no)' }}>
      <h3>Nuova sessione</h3>
      <p className="hint">Prima di azzerare scarica tutto dal Debriefing.</p>
      <div className="actions"><button className="btn no" onClick=${azzera}>Azzera la simulazione</button></div>
    </div>
  </div>`;
}

/* =====================================================================
   Avvio
   ===================================================================== */
function MemberHome({ user, onLogout }) {
  const { d, load } = useData(false);
  const ops = useOps(load);
  if (!d.loaded) return html`<${Loading}/>`;
  const m = d.members.find(x => x.user_id === user.id);
  if (!m) return html`<div className="gate"><div className="gate-box doc"><p>Non fai più parte della simulazione. Chiedi al facilitatore il codice per rientrare.</p>
    <div className="actions"><button className="btn" onClick=${() => location.reload()}>Riprova</button><button className="btn plain" onClick=${onLogout}>Esci</button></div></div></div>`;
  return html`<${Room} d=${d} ops=${ops} me=${{ id: user.id, team: m.team_id, ruolo: m.ruolo, nome: m.nome }} onLogout=${onLogout}/>`;
}

function App() {
  const [session, setSession] = useState(undefined);
  const [role, setRole] = useState(null);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession((data && data.session) || null));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => data.subscription.unsubscribe();
  }, []);
  const uid = session && session.user && session.user.id;
  const resolve = useCallback(async () => {
    if (!uid) { setRole(null); return; }
    const m = await sb.rpc('is_master');
    if (m.error) { setRole({ kind: 'error', msg: errMsg(m.error) }); return; }
    if (m.data === true) { setRole({ kind: 'master' }); return; }
    const r = await sb.from('members').select('*').eq('user_id', uid).maybeSingle();
    if (r.error) { setRole({ kind: 'error', msg: errMsg(r.error) }); return; }
    setRole({ kind: r.data ? 'member' : 'join' });
  }, [uid]);
  useEffect(() => { setRole(null); resolve(); }, [uid]);
  const logout = async () => { await sb.auth.signOut(); setSession(null); };

  if (!CONFIGURATO) return html`<div className="gate"><div className="gate-box doc"><h2>Manca la configurazione</h2>
    <p style=${{ marginTop: '8px' }}>In testa al file index.html vanno inseriti l'URL del progetto Supabase e la chiave publishable.</p></div></div>`;
  if (session === undefined) return html`<${Loading}/>`;
  if (!session) return html`<${Login}/>`;
  if (!role) return html`<${Loading}/>`;
  if (role.kind === 'error') return html`<div className="gate"><div className="gate-box doc"><h2>Qualcosa non va</h2><p style=${{ marginTop: '8px' }}>${role.msg}</p>
    <div className="actions"><button className="btn" onClick=${resolve}>Riprova</button><button className="btn plain" onClick=${logout}>Esci</button></div></div></div>`;
  if (role.kind === 'join') return html`<${Join} onDone=${resolve} onLogout=${logout}/>`;
  if (role.kind === 'master') return html`<${Regia} user=${session.user} onLogout=${logout}/>`;
  return html`<${MemberHome} user=${session.user} onLogout=${logout}/>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
