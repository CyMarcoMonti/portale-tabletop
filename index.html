function routeOf(f, who, myTeam) {
  if (f.kind === 'situazione' && f.richiesta) return html`<span>${who.teamName(f.to_team)}</span><span className="arr">a</span><span className="placard">${f.voce}</span>`;
  if (f.kind === 'situazione') return html`<span className="placard">${f.voce}</span><span className="arr">a</span><span>${who.teamName(f.to_team)}</span>`;
  if (f.kind === 'esterna') return html`<span>${who.teamName(f.from_team)}</span><span className="arr">a</span><b>${destText(f)}</b>
    ${f.canale ? html`<span className="tag">${f.canale}</span>` : null}
    ${f.diretta ? html`<span className="tag warn">Senza autorizzazione</span>` : null}
    ${nonInformata(f) ? html`<span className="tag warn">Non informata</span>` : null}
    ${autonoma(f) && f.informata_at && f.to_team ? html`<span className="tag">${myTeam === f.to_team ? 'Per conoscenza' : 'Informata ' + who.teamName(f.to_team)}</span>` : null}`;
  if (f.kind === 'canale' && f.tipo === 'Informativa') return html`<span className="tag">Informativa</span><span>${myTeam && f.to_team === myTeam ? 'Da ' + who.teamName(f.from_team) : 'A ' + who.teamName(f.to_team)}</span>`;
  if (myTeam && f.to_team === myTeam) return html`<span>Da ${who.teamName(f.from_team)}</span>`;
  if (myTeam) return html`<span>A ${who.teamName(f.to_team)}</span>`;
  return html`<span>${who.teamName(f.from_team)}</span><span className="arr">a</span><span>${who.teamName(f.to_team)}</span>`;
}
function railOf(f, who) { return f.kind === 'situazione' ? '#152030' : who.teamColor(f.from_team); }

function FlowList({ flows, byFlow, sel, onSel, unread, sectionOf, sections, who, myTeam }) {
  const groups = sections.map(() => []);
  flows.forEach(f => { const s = sectionOf(f); if (s >= 0) groups[s].push(f); });
  groups.forEach(g => g.sort((a, b) => activity(b, byFlow) - activity(a, byFlow)));
  if (!flows.length) return html`<p className="empty" style=${{ padding: '16px' }}>Ancora niente qui.</p>`;
  return html`<div>${groups.map((g, i) => g.length ? html`<div key=${i}>
    <div className="sec"><span>${sections[i]}</span><span>${g.length}</span></div>
    ${g.map(f => html`<button key=${f.id} className="row" aria-current=${sel === f.id} style=${{ '--rail': railOf(f, who) }}
        data-flow=${f.id} onClick=${() => onSel(f.id)}>
      <span className="t"><${Icon} n=${f.kind}/>${f.titolo}</span>
      <span className="m">${routeOf(f, who, myTeam)}<${Stamp} f=${f}/><span>${ora(new Date(activity(f, byFlow)))}</span></span>
      ${unread && unread(f) ? html`<span className="unread" aria-label="Novità"></span>` : null}
    </button>`)}
  </div>` : null)}</div>`;
}

function FlowDetail({ f, msgs, d, who, me, ops, cfg, isMaster, onCompose, onOpen, onBack, hasFlow }) {
  const [nota, setNota] = useState('');
  const [busy, setBusy] = useState(false);
  useEffect(() => { setNota(''); }, [f.id]);
  const act = async (p, okMsg) => { setBusy(true); const r = await ops.run(p, ['flows', 'messages'], okMsg); setBusy(false); return r; };
  const ro = !!me.preview;
  const part = !ro && !isMaster;
  const mine = f.from_team === me.team, toMe = f.to_team === me.team;
  const isExt = f.kind === 'esterna';
  const canDecide = part && f.stato === 'in_attesa' && toMe;
  const canWithdraw = part && f.stato === 'in_attesa' && mine;
  const canSend = part && isExt && f.stato === 'approvato' && mine;
  const canPost = part && ['approvato', 'aperto'].includes(f.stato) && (mine || toMe);
  const canClose = !ro && (isMaster || mine || (toMe && !autonoma(f))) && ['approvato', 'aperto', 'inviato'].includes(f.stato);
  const modello = f.modello ? cfg.modelli.find(x => x.nome === f.modello) : null;
  const canRetry = part && f.stato === 'respinto' && mine;
  const lastVoice = msgs.slice().reverse().find(m => m.voce);
  const altre = who.others(me.team);
  const portaLbl = altre.length === 1 ? 'Porta a ' + altre[0].nome : 'Porta a un\'altra squadra';
  const tipoAgg = cfg.tipi_canale.find(t => /aggiorn/i.test(t)) || cfg.tipi_canale[0] || '';
  const tipoEsc = cfg.tipi_canale.find(t => /escalation/i.test(t)) || cfg.tipi_canale[0] || '';

  const forward = () => {
    if (f.kind === 'situazione') {
      onCompose({ kind: 'canale', prefill: { tipo: tipoEsc, titolo: f.titolo, rif: f.id,
        testo: f.voce + ' riferisce:\n«' + f.motivo + '»\n\n' } });
    } else if (lastVoice) {
      onCompose({ kind: 'canale', prefill: { tipo: tipoAgg, titolo: 'Risposta di ' + lastVoice.voce + ': ' + f.titolo, rif: f.id,
        testo: lastVoice.voce + ' ha risposto alle ' + ora(lastVoice.created_at) + ':\n«' + lastVoice.testo + '»\n\n' } });
    }
  };
  const decisioneLbl = isExt ? 'Autorizzazione' : 'Decisione';
  const persona = (id, ruolo) => who.name(id) + (ruolo ? ', ' + ruolo : '');

  return html`<div>
    ${onBack ? html`<button className="btn plain small back" onClick=${onBack}>Torna all'elenco</button>` : null}
    <article className="doc" id="flow-detail">
      <div className="doc-top"><span>${f.richiesta ? 'Richiesta a una voce' : KIND_LABEL[f.kind]}${f.tipo && f.kind !== 'situazione' ? ': ' + f.tipo : ''}</span><${Stamp} f=${f}/></div>
      <h2>${f.titolo}</h2>
      <div className="route">${routeOf(f, who, isMaster ? null : me.team)}</div>
      <dl className="meta">
        ${f.kind === 'situazione' && !f.richiesta
          ? html`<dt>Arrivata</dt><dd>${ora(f.created_at)}${f.tempo_sim ? ' — ' + f.tempo_sim : ''}</dd>`
          : html`<dt>${f.richiesta ? 'Chiesta da' : 'Aperta da'}</dt><dd>${persona(f.opened_by, f.opened_ruolo)} alle ${ora(f.created_at)}${f.tempo_sim ? ' — ' + f.tempo_sim : ''}</dd>`}
        ${isExt && f.canale ? html`<dt>Canale</dt><dd>${f.canale}</dd>` : null}
        ${isExt && f.ccn ? html`<dt>Copia nascosta</dt><dd>${f.ccn}</dd>` : null}
        ${f.modello ? html`<dt>Modello</dt><dd>Partita da «${f.modello}»${isMaster && modello ? html` <span className=${'tag' + (scarto(f.motivo, modello.testo) < 15 ? ' warn' : '')}>${scarto(f.motivo, modello.testo) < 15 ? 'usato quasi così com\'è' : 'adattato'} · scarto ${scarto(f.motivo, modello.testo)}%</span>` : null}</dd>` : null}
        ${f.decided_at && !f.diretta ? html`<dt>${decisioneLbl}</dt><dd>${f.stato === 'respinto' ? 'Respinta' : (isExt ? 'Autorizzata' : 'Approvata')} da ${persona(f.decided_by, f.decided_ruolo)} alle ${ora(f.decided_at)}${f.to_team && !autonoma(f) ? ' (dopo ' + durata(f.created_at, f.decided_at) + ')' : ''}</dd>` : null}
        ${f.nota_decisione ? html`<dt>Nota</dt><dd>${f.nota_decisione}</dd>` : null}
        ${f.diretta ? html`<dt>${decisioneLbl}</dt><dd><span className="tag warn">Nessuna: inviata direttamente</span></dd>` : null}
        ${autonoma(f) && f.stato === 'inviato' ? html`<dt>Informativa</dt><dd>${f.informata_at
          ? html`A ${who.teamName(f.to_team)} alle ${ora(f.informata_at)}${f.informativa_flow && hasFlow && hasFlow(f.informativa_flow) ? html` · <button className="link" onClick=${() => onOpen(f.informativa_flow)}>apri</button>` : null}`
          : html`<span className="miss">non ancora inviata all'altra stanza</span>`}</dd>` : null}
        ${f.inviato_at ? html`<dt>Inviata</dt><dd>da ${who.name(f.inviato_by)} alle ${ora(f.inviato_at)}</dd>` : null}
        ${f.closed_at ? html`<dt>Chiusa</dt><dd>da ${who.name(f.closed_by)} alle ${ora(f.closed_at)}</dd>` : null}
        ${f.rif && hasFlow && hasFlow(f.rif) ? html`<dt>Collegata a</dt><dd><button className="link" onClick=${() => onOpen(f.rif)}>apri il flusso precedente</button></dd>` : null}
      </dl>
      ${f.motivo ? html`<div className="body">${f.motivo}</div>` : null}
    </article>

    ${autonoma(f) && toMe && !mine && !isMaster ? html`<section className="panel info">
      <h3>Per conoscenza</h3>
      <p className="hint">${who.teamName(f.from_team)} l'ha inviata in autonomia a ${destText(f)} alle ${ora(f.inviato_at)} e vi ha mandato un'informativa. Non dovete decidere nulla: se serve, ratificate o chiedete una correzione.</p>
      ${part ? html`<div className="actions"><button id="btn-reply-team" className="btn plain" onClick=${() => onCompose({ kind: 'canale', prefill: { to: f.from_team, tipo: tipoAgg, titolo: 'Re: ' + f.titolo, rif: f.id, testo: '' } })}>Rispondi a ${who.teamName(f.from_team)}</button></div>` : null}
    </section>` : null}

    ${part && mine && nonInformata(f) ? html`<${InformativaForm} f=${f} who=${who} me=${me} ops=${ops} onDone=${id => onOpen && onOpen(id)}/>` : null}

    ${canDecide ? html`<section className="panel decide">
      <h3>${isExt ? 'Autorizzate questa comunicazione?' : 'Approvate questa richiesta?'}</h3>
      <p className="hint">La decisione resta agli atti con nome, ruolo e orario. Decide chi per primo risponde.</p>
      <${Field} label="Nota per l'altra squadra"><textarea id="decide-note" value=${nota} placeholder=${isExt ? 'Facoltativa. Se non autorizzate, spiegate cosa cambiare.' : 'Facoltativa'} onChange=${e => setNota(e.target.value)}></textarea><//>
      <div className="actions">
        <button id="btn-approve" className="btn ok" disabled=${busy} onClick=${() => act(sb.rpc('decide_flow', { p_id: f.id, p_esito: 'approvato', p_nota: nota }), isExt ? 'Autorizzata' : 'Approvata')}>${isExt ? 'Autorizza' : 'Approva'}</button>
        <button id="btn-reject" className="btn no" disabled=${busy} onClick=${() => act(sb.rpc('decide_flow', { p_id: f.id, p_esito: 'respinto', p_nota: nota }), isExt ? 'Non autorizzata' : 'Respinta')}>${isExt ? 'Non autorizzare' : 'Respingi'}</button>
      </div>
    </section>` : null}

    ${canSend ? html`<section className="panel send">
      <h3>Autorizzata: ora potete inviarla</h3>
      <p className="hint">Arriva a ${destText(f)} così com'è scritta e non si modifica più. Le risposte dei destinatari compaiono qui sotto.</p>
      <div className="actions"><button id="btn-send" className="btn send" disabled=${busy}
        onClick=${() => { if (window.confirm('Inviare la comunicazione a ' + destText(f) + '?')) act(sb.rpc('send_external', { p_id: f.id }), 'Inviata a ' + destText(f)); }}>Invia a ${destText(f)}</button></div>
    </section>` : null}

    ${f.stato === 'in_attesa' && mine && !isMaster ? html`<section className="panel">
      <p>In attesa della risposta di ${who.teamName(f.to_team)}.</p>
      ${canWithdraw ? html`<div className="actions"><button className="btn plain small" disabled=${busy}
        onClick=${() => { if (window.confirm('Ritirare questa richiesta?')) act(sb.rpc('close_flow', { p_id: f.id }), 'Ritirata'); }}>Ritira</button></div>` : null}
    </section>` : null}

    ${(canRetry || (part && (f.kind === 'situazione' || (isExt && f.stato === 'inviato' && mine && lastVoice)))) ? html`<div className="actions" style=${{ maxWidth: '780px' }}>
      ${canRetry ? html`<button id="btn-retry" className="btn plain" onClick=${() => onCompose({ kind: f.kind, prefill: { tipo: f.tipo, titolo: f.titolo, testo: f.motivo, destinatario: f.destinatario, ccn: f.ccn, canale: f.canale, modello: f.modello, rif: f.id } })}>Riproponi con modifiche</button>` : null}
      ${part && (f.kind === 'situazione' || (isExt && f.stato === 'inviato' && mine && lastVoice)) ? html`<button id="btn-forward" className="btn plain" onClick=${forward}>${portaLbl}</button>` : null}
    </div>` : null}

    <section className="thread">
      <h3>${f.kind === 'situazione' ? 'Conversazione con ' + f.voce : isExt ? (f.stato === 'inviato' ? 'Risposte del destinatario' : 'Discussione sul testo') : 'Conversazione tra le squadre'}</h3>
      ${msgs.map(m => html`<${Msg} key=${m.id} m=${m} who=${who} isMaster=${isMaster}/>`)}
      ${!msgs.length ? html`<p className="empty">${f.stato === 'in_attesa' ? 'Si potrà scrivere dopo la decisione.' : 'Nessun messaggio.'}</p>` : null}
      ${canPost ? html`<${Composer} id="post-text" onSend=${t => act(sb.rpc('post_message', { p_flow: f.id, p_testo: t }))}
        placeholder=${f.kind === 'situazione' ? 'Rispondi a ' + f.voce + '…' : 'Scrivi all\'altra squadra…'}/>` : null}
      ${part && isExt && f.stato === 'inviato' ? html`<p className="hint" style=${{ marginTop: '8px' }}>Per integrare o correggere serve una nuova comunicazione, da autorizzare di nuovo.</p>` : null}
      ${canClose ? html`<div className="actions"><button className="btn plain small" disabled=${busy}
        onClick=${() => { if (window.confirm('Chiudere questo flusso? Resterà leggibile ma non si potrà più scrivere.')) act(sb.rpc('close_flow', { p_id: f.id }), 'Chiuso'); }}>Chiudi il flusso</button></div>` : null}
    </section>

    ${isMaster ? html`<${VoiceComposer} f=${f} d=${d} cfg=${cfg} who=${who} ops=${ops}/>` : null}
    ${isMaster && (f.kind !== 'situazione' || f.richiesta) ? html`<${Valutazione} f=${f} d=${d} ops=${ops}/>` : null}
  </div>`;
}

/* Informativa scritta all'altra stanza su ciò che si è fatto in autonomia (modello del piano incidenti: cosa, quando, impatto). */
function InformativaForm({ f, who, me, ops, onDone }) {
  const targets = who.others(me.team);
  const def = (who.authorizers(me.team)[0] || targets[0] || {}).id || '';
  const [to, setTo] = useState(def);
  const [v, setV] = useState({ cosa: '', quando: '', impatto: '', perche: '', serve: '' });
  const [busy, setBusy] = useState(false);
  const set = k => e => setV({ ...v, [k]: e.target.value });
  const inviato = f ? '«' + f.titolo + '» a ' + destText(f) + (f.canale ? ', via ' + f.canale : '') + ', alle ' + ora(f.inviato_at) : '';
  const testo = [['Cosa', v.cosa], ['Quando', v.quando], ['Impatto', v.impatto], ['Cosa abbiamo inviato e a chi', inviato],
    ['Perché in autonomia', v.perche], ['Cosa serve ora', v.serve]]
    .filter(([, x]) => x && x.trim()).map(([k, x]) => k + ': ' + x.trim()).join('\n\n');
  const ok = to && v.cosa.trim() && v.perche.trim() && !busy;
  const send = async () => {
    setBusy(true);
    const r = await ops.run(sb.rpc('send_informativa', { p_flow: f ? f.id : null, p_to: to, p_titolo: 'Informativa: ' + (f ? f.titolo : v.cosa.trim().slice(0, 60)), p_testo: testo }),
      ['flows'], 'Informativa inviata a ' + who.teamName(to));
    setBusy(false);
    if (!r.error && onDone) onDone(r.data);
  };
  return html`<section className="panel info" id="informativa">
    <h3>Informativa all'altra stanza</h3>
    <p className="hint">L'avete inviata senza passare dall'altra stanza: resta segnata «non informata» finché non mandate un'informativa scritta.</p>
    ${targets.length > 1 ? html`<${Field} label="A quale squadra"><select id="inf-to" value=${to} onChange=${e => setTo(e.target.value)}>${targets.map(t => html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}</select><//>` : null}
    <div className="grid2">
      <${Field} label="Cosa è successo"><textarea id="inf-cosa" value=${v.cosa} onChange=${set('cosa')}></textarea><//>
      <${Field} label="Impatto"><textarea id="inf-impatto" value=${v.impatto} onChange=${set('impatto')}></textarea><//>
      <${Field} label="Quando"><input id="inf-quando" type="text" value=${v.quando} onChange=${set('quando')} placeholder="Per esempio: dalle 9:10, tempo simulato"/><//>
      <${Field} label="Perché in autonomia"><input id="inf-perche" type="text" value=${v.perche} onChange=${set('perche')}/><//>
    </div>
    <${Field} label="Cosa serve ora dall'altra stanza"><textarea id="inf-serve" value=${v.serve} onChange=${set('serve')}></textarea><//>
    ${inviato ? html`<p className="hint" style=${{ marginTop: '8px' }}>Si aggiunge da solo: cosa avete inviato e a chi, ${inviato}.</p>` : null}
    <div className="actions"><button id="inf-send" className="btn" disabled=${!ok} onClick=${send}>Invia l'informativa a ${who.teamName(to)}</button></div>
  </section>`;
}

function Msg({ m, who, isMaster }) {
  const isVoce = !!m.voce;
  return html`<div className=${'msg' + (isVoce ? ' voce' : '')} style=${isVoce ? null : { '--mc': who.teamColor(m.team_id) }}>
    <div className="h">
      ${isVoce ? html`<${Avatar} nome=${m.voce}/><span className="placard">${m.voce}</span>` : html`<b>${who.name(m.author)}</b>${m.ruolo ? html`<span>${m.ruolo}</span>` : null}<span>${who.teamName(m.team_id)}</span>`}
      <time>${ora(m.created_at)}</time>
      ${isMaster && m.solo_team ? html`<span className="tag">visibile solo a ${who.teamName(m.solo_team)}</span>` : null}
    </div>
    <div className="x">${m.testo}</div>
  </div>`;
}

// abbinamento suggerito a una comunicazione prevista: stesso tipo, altrimenti un destinatario in comune
function guessPrevista(f, previste) {
  if (!previste || !previste.length || f.kind === 'situazione') return null;
  const byTipo = previste.find(p => p.tipo === f.tipo);
  if (byTipo) return byTipo.id;
  if (f.kind !== 'esterna') return /escalation/i.test(f.tipo || '') ? ((previste.find(p => /escalation/i.test(p.tipo)) || {}).id || null) : null;
  const dests = splitDest(f.destinatario).concat(splitDest(f.ccn)).map(x => x.toLowerCase().replace(/\s*\(.*\)$/, ''));
  const hit = previste.find(p => dests.some(x => x.length > 3 && p.destinatario.toLowerCase().includes(x)));
  return hit ? hit.id : null;
}
function VoiceComposer({ f, d, cfg, who, ops }) {
  const dests = f.kind === 'esterna' ? splitDest(f.destinatario).concat(splitDest(f.ccn)) : [];
  const defVoce = f.kind === 'situazione' ? f.voce : f.kind === 'esterna' ? (dests[0] || cfg.voci[0]) : cfg.voci[0];
  const defSolo = f.kind === 'esterna' ? (f.from_team || '') : '';
  const [voce, setVoce] = useState(defVoce);
  const [solo, setSolo] = useState(defSolo);
  useEffect(() => { setVoce(defVoce); setSolo(defSolo); }, [f.id]);
  // con più destinatari si risponde come ciascuno di loro, uno alla volta
  const voci = Array.from(new Set([defVoce].concat(dests, cfg.voci).filter(Boolean)));
  // rubrica degli attori: chi può scrivergli secondo i piani e come reagisce se riceve ciò che non dovrebbe
  const attore = ((d && d.attori) || []).find(a => a.nome === voce);
  const mittente = f.richiesta || f.kind !== 'situazione'
    ? who.name(f.opened_by) + (f.opened_ruolo ? ', ' + f.opened_ruolo : '') + ' — ' + who.teamName(f.from_team || f.to_team) : '';
  return html`<section className="panel regia">
    <h3>Rispondi come una voce</h3>
    <p className="hint">Il messaggio arriva con il cartello della voce scelta. ${f.kind === 'esterna' ? 'Ogni destinatario risponde per conto suo, in base a ciò che ha ricevuto e da chi. Un avviso vago genera domande; una notifica incompleta torna indietro con richieste di integrazione.' : ''}</p>
    ${mittente ? html`<p className="hint" style=${{ marginTop: '4px' }}>Scritto da: <b>${mittente}</b>${f.ccn ? ' · in copia nascosta: ' + f.ccn : ''}</p>` : null}
    ${attore ? html`<dl className="meta" style=${{ marginTop: '8px' }}>
      <dt>Chi può scrivergli</dt><dd>${attore.chi_puo}</dd>
      <dt>Se riceve ciò che non dovrebbe</dt><dd>${attore.se_sbagliato}</dd>
    </dl>` : null}
    <div className="grid2">
      <${Field} label="Voce"><select id="voice-select" value=${voce} onChange=${e => setVoce(e.target.value)}>${voci.map(v => html`<option key=${v}>${v}</option>`)}</select><//>
      ${f.kind !== 'situazione' ? html`<${Field} label="Chi lo legge"><select id="voice-solo" value=${solo} onChange=${e => setSolo(e.target.value)}>
        ${f.from_team && f.to_team ? html`<option value="">Entrambe le squadre</option>` : null}
        ${[f.from_team, f.to_team].filter(Boolean).map(t => html`<option key=${t} value=${t}>Solo ${who.teamName(t)}</option>`)}
      </select><//>` : html`<div></div>`}
    </div>
    <${Composer} id="voice-text" label=${'Invia come ' + voce} placeholder="Testo della risposta…"
      onSend=${t => ops.run(sb.rpc('voice_message', { p_flow: f.id, p_voce: voce, p_testo: t, p_solo_team: solo || null }), ['messages'], 'Inviato come ' + voce)}/>
  </section>`;
}

function Valutazione({ f, d, ops }) {
  const v = d.valutazioni.find(x => x.flow_id === f.id) || {};
  const [nota, setNota] = useState(v.nota || '');
  useEffect(() => { setNota(v.nota || ''); }, [f.id]);
  const save = patch => ops.run(sb.from('valutazioni').upsert({ flow_id: f.id, ...patch, updated_at: new Date().toISOString() }), ['valutazioni']);
  const vals = CRITERI.map(([k]) => v[k]).filter(x => x);
  const prev = v.prevista_id != null ? v.prevista_id : guessPrevista(f, d.previste);
  return html`<section className="panel regia" id="valutazione">
    <h3>Valutazione${vals.length ? ' — media ' + (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : ''}</h3>
    <p className="hint">Non visibile alle squadre. Da 1 a 5; un secondo clic sullo stesso valore lo toglie.</p>
    <div className="grid2">
      <${Field} label="Comunicazione prevista dallo scenario" hint=${v.prevista_id == null && prev ? 'Abbinamento suggerito: confermalo o cambialo.' : null}>
        <select id="val-prevista" value=${prev || ''} onChange=${e => save({ prevista_id: e.target.value ? Number(e.target.value) : null })}>
          <option value="">Nessuna</option>${d.previste.slice().sort((a, b) => a.ordine - b.ordine).map(p => html`<option key=${p.id} value=${p.id}>${p.ordine}. ${p.tipo}</option>`)}
        </select><//>
      <div className="field"><span className="lab">Verdetto sulle deleghe</span>
        <div className="seg" role="group" aria-label="Verdetto sulle deleghe">${DELEGHE.map(([k, l]) => html`<button key=${k} aria-pressed=${v.delega === k} onClick=${() => save({ delega: v.delega === k ? null : k })}>${l}</button>`)}</div>
      </div>
    </div>
    ${d.deleghe && d.deleghe.length ? html`<details style=${{ marginTop: '8px' }}><summary className="hint" style=${{ cursor: 'pointer' }}>Consulta la matrice «Chi può comunicare cosa»</summary><${TabellaDeleghe} rows=${d.deleghe}/></details>` : null}
    <div className="score">
      ${CRITERI.map(([k, lbl]) => html`<${React.Fragment} key=${k}><span>${lbl}</span><span className="opts">
        ${[1, 2, 3, 4, 5].map(n => html`<button key=${n} aria-pressed=${v[k] === n} aria-label=${lbl + ' ' + n}
          onClick=${() => save({ [k]: v[k] === n ? null : n })}>${n}</button>`)}
      </span><//>`)}
    </div>
    <${Field} label="Note per il debriefing"><textarea value=${nota} onChange=${e => setNota(e.target.value)} onBlur=${() => { if (nota !== (v.nota || '')) save({ nota }); }}></textarea><//>
  </section>`;
}

function Compose({ kind, prefill, cfg, me, who, ops, onDone, onCancel }) {
  prefill = prefill || {};
  const isExt = kind === 'esterna';
  const isVoce = kind === 'voce';   // richiesta a una voce interpretata dal facilitatore
  const tipi = isVoce ? [] : (isExt ? (cfg.tipi_esterni.length ? cfg.tipi_esterni : cfg.comunicazioni.map(c => c.tipo)) : cfg.tipi_canale).concat(['Altro']);
  // destinatari possibili: gli esterni e tutte le voci interpretate dal facilitatore (anche quelle sbagliate)
  const vociSim = cfg.voci.filter(v => v !== 'Facilitatore' && !cfg.destinatari.includes(v));
  const attori = cfg.destinatari.concat(vociSim);
  const vociScrivibili = cfg.voci.filter(v => v !== 'Facilitatore');
  // ogni attore scelto è destinatario in chiaro ('a') o in copia nascosta ('ccn')
  const pre = {}; splitDest(prefill.destinatario).forEach(x => { pre[x] = 'a'; }); splitDest(prefill.ccn).forEach(x => { pre[x] = 'ccn'; });
  const [tipo, setTipo] = useState(prefill.tipo || '');
  const [titolo, setTitolo] = useState(prefill.titolo || '');
  const [testo, setTesto] = useState(prefill.testo || '');
  const [sel, setSel] = useState(() => Object.fromEntries(Object.entries(pre).filter(([x]) => attori.includes(x))));
  const [destFree, setDestFree] = useState(Object.keys(pre).filter(x => !attori.includes(x) && pre[x] === 'a').join(', '));
  const [ccnFree, setCcnFree] = useState(Object.keys(pre).filter(x => !attori.includes(x) && pre[x] === 'ccn').join(', '));
  const [canale, setCanale] = useState(prefill.canale || '');
  const [modello, setModello] = useState(prefill.modello || '');
  const [voce, setVoce] = useState(prefill.voce || vociScrivibili[0] || '');
  const [busy, setBusy] = useState(false);
  const myTeam = who.team(me.team) || {};
  const selfAuth = isExt && myTeam.autorizza;
  // squadre a cui si può mandare: per le richieste tutte le altre, per le esterne quelle che autorizzano
  const targets = isVoce ? [] : isExt ? (selfAuth ? [] : who.authorizers(me.team)) : who.others(me.team);
  const [toTeam, setToTeam] = useState(prefill.to && targets.some(t => t.id === prefill.to) ? prefill.to : targets.length === 1 ? targets[0].id : '');
  const other = who.team(toTeam) || { nome: isExt ? 'la squadra che autorizza' : 'l\'altra squadra' };
  const noAuth = isExt && !selfAuth && !targets.length;
  // invio diretto, senza autorizzazione: poi serve l'informativa all'altra stanza
  const [modo, setModo] = useState(noAuth ? 'diretta' : 'autorizza');
  const diretta = isExt && modo === 'diretta';
  const cycle = x => setSel(s => { const n = { ...s }; if (!n[x]) n[x] = 'a'; else if (n[x] === 'a') n[x] = 'ccn'; else delete n[x]; return n; });
  const pickTipo = v => {
    if (!titolo || tipi.includes(titolo)) setTitolo(v === 'Altro' ? '' : v);
    setTipo(v);
  };
  const pickModello = nome => {
    const m = cfg.modelli.find(x => x.nome === nome);
    if (!m) { setModello(''); return; }
    if (testo.trim() && testo !== m.testo && !window.confirm('Sostituire il testo scritto finora con il modello?')) return;
    setModello(nome); setTesto(m.testo);
    if (!titolo.trim() && m.oggetto) setTitolo(m.oggetto);
  };
  const listA = Array.from(new Set(Object.keys(sel).filter(x => sel[x] === 'a').concat(splitDest(destFree))));
  const listC = Array.from(new Set(Object.keys(sel).filter(x => sel[x] === 'ccn').concat(splitDest(ccnFree)))).filter(x => !listA.includes(x));
  const destinatario = listA.join(', '), ccn = listC.join(', ');
  const nDest = listA.length + listC.length;
  const tutti = [destinatario, ccn ? 'Ccn: ' + ccn : ''].filter(Boolean).join(' · ');
  const ok = titolo.trim() && testo.trim() && (isVoce ? !!voce : (!isExt || nDest) && (diretta || ((selfAuth || toTeam) && !noAuth)));
  const submit = async () => {
    if (diretta && !window.confirm('Inviare subito a ' + tutti + ', senza autorizzazione? Non si potrà più modificare e resterà «non informata» finché non mandate l\'informativa.')) return;
    setBusy(true);
    let r;
    if (isVoce) {
      r = await ops.run(sb.rpc('ask_voice', { p_voce: voce, p_titolo: titolo, p_testo: testo }), ['flows'], 'Mandata a ' + voce);
    } else if (diretta) {
      r = await ops.run(sb.rpc('send_direct', { p_tipo: tipo, p_titolo: titolo, p_testo: testo, p_destinatario: destinatario,
        p_ccn: ccn || null, p_canale: canale || null, p_modello: modello || null, p_rif: prefill.rif || null }), ['flows'], 'Inviata a ' + tutti);
    } else {
      r = await ops.run(sb.rpc('open_flow', { p_kind: kind, p_tipo: tipo, p_titolo: titolo, p_testo: testo,
        p_destinatario: isExt ? destinatario : null, p_rif: prefill.rif || null, p_to: selfAuth ? null : toTeam,
        p_ccn: isExt ? (ccn || null) : null, p_canale: isExt ? (canale || null) : null, p_modello: isExt ? (modello || null) : null }), ['flows'],
        isExt ? (selfAuth ? 'Pronta: ora potete inviarla' : 'Mandata a ' + other.nome + ' per l\'autorizzazione') : 'Richiesta mandata a ' + other.nome);
    }
    setBusy(false);
    if (!r.error) onDone(r.data);
  };
  const chip = x => html`<label key=${x} className=${sel[x] === 'ccn' ? 'on ccn' : sel[x] ? 'on' : ''} title=${sel[x] === 'ccn' ? 'In copia nascosta' : sel[x] ? 'Destinatario in chiaro' : ''}>
    <input type="checkbox" checked=${!!sel[x]} onChange=${() => cycle(x)}/>${sel[x] === 'ccn' ? html`<small>Ccn</small>` : null}${x}</label>`;
  return html`<div className="doc" id="compose" style=${{ maxWidth: '780px' }}>
    <div className="doc-top"><span>${isVoce ? 'Nuova richiesta a una voce' : isExt ? 'Nuova comunicazione esterna' : 'Nuova richiesta a ' + other.nome}</span></div>
    <p className="hint" style=${{ marginTop: '6px' }}>${isVoce
      ? 'Per le decisioni tecniche scrivete all\'Incident Manager; potete scrivere anche al SOC, a R&D, all\'IT Operations o al supporto cloud. Risponde il facilitatore con il cartello della voce.'
      : isExt ? 'Scrivetela come la leggerà il destinatario: ognuno risponde in base a ciò che ha ricevuto e da chi.'
      : (toTeam ? other.nome : 'La squadra che scegliete') + ' la riceve e decide se approvarla. Dopo la decisione potete scrivervi nel flusso.'}</p>
    ${isVoce ? html`<${Field} label="A chi"><select id="compose-voce" value=${voce} onChange=${e => setVoce(e.target.value)}>${vociScrivibili.map(v => html`<option key=${v}>${v}</option>`)}</select><//>` : null}
    ${isExt ? html`<div className="mode" role="radiogroup" aria-label="Come inviarla">
      <label className=${modo === 'autorizza' ? 'on' : ''}><input type="radio" name="modo" checked=${modo === 'autorizza'} disabled=${noAuth} onChange=${() => setModo('autorizza')}/>
        <span><b>${selfAuth ? 'Firmatela voi' : 'Chiedi l\'autorizzazione'}</b><small>${noAuth ? 'Nessuna squadra è impostata per autorizzare: avvisa il facilitatore.'
          : selfAuth ? 'Sarà autorizzata subito e la potrete inviare. Resta visibile solo alla vostra squadra.'
          : 'Prima di partire la deve autorizzare ' + other.nome + '.'}</small></span></label>
      <label className=${modo === 'diretta' ? 'on' : ''}><input id="compose-diretta" type="radio" name="modo" checked=${modo === 'diretta'} onChange=${() => setModo('diretta')}/>
        <span><b>Invia subito, senza autorizzazione</b><small>Per urgenze o compiti delegati. Parte subito, non si modifica più e resta agli atti come inviata senza autorizzazione.</small></span></label>
    </div>` : null}
    ${diretta ? html`<p className="hint" style=${{ marginTop: '8px' }}>Dopo l'invio resterà segnata «non informata» finché non mandate un'informativa scritta all'altra stanza: la trovate nel dettaglio della comunicazione.</p>` : null}
    ${!diretta && targets.length > 1 ? html`<${Field} label=${isExt ? 'Chi la autorizza' : 'A quale squadra'}>
      <select id="compose-to" value=${toTeam} onChange=${e => setToTeam(e.target.value)}>
        <option value="">Scegli…</option>${targets.map(t => html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}
      </select><//>` : null}
    ${!isVoce ? html`<div className="grid2">
      <${Field} label=${isExt ? 'Tipo di comunicazione' : 'Tipo di richiesta'}>
        <select id="compose-tipo" value=${tipo} onChange=${e => pickTipo(e.target.value)}>
          <option value="">Scegli…</option>${tipi.map(t => html`<option key=${t}>${t}</option>`)}
          ${tipo && !tipi.includes(tipo) ? html`<option>${tipo}</option>` : null}
        </select><//>
      ${isExt && cfg.canali.length ? html`<${Field} label="Canale">
        <select id="compose-canale" value=${canale} onChange=${e => setCanale(e.target.value)}>
          <option value="">Scegli…</option>${cfg.canali.map(c => html`<option key=${c}>${c}</option>`)}
        </select><//>` : html`<div></div>`}
    </div>` : null}
    ${isExt ? html`<div className="field" role="group" aria-label="Destinatari">
      <span className="lab">Destinatari${nDest ? ' · ' + listA.length + ' in chiaro' + (listC.length ? ', ' + listC.length + ' in copia nascosta' : '') : ''}</span>
      <span className="hint">Un clic: destinatario in chiaro. Due clic: copia nascosta. Tre: lo togli.</span>
      <div className="chips">
        <span className="grp">Esterni</span>${cfg.destinatari.map(chip)}
        ${vociSim.length ? html`<span className="grp">Altri attori simulati</span>${vociSim.map(chip)}` : null}
      </div>
      <div className="grid2" style=${{ marginTop: '8px' }}>
        <input id="compose-dest-altri" type="text" placeholder="Altri destinatari in chiaro, separati da virgola" value=${destFree} onChange=${e => setDestFree(e.target.value)}/>
        <input id="compose-ccn-altri" type="text" placeholder="Altri in copia nascosta, separati da virgola" value=${ccnFree} onChange=${e => setCcnFree(e.target.value)}/>
      </div>
    </div>` : null}
    ${isExt && cfg.modelli.length ? html`<${Field} label="Parti da un modello del Piano di gestione delle crisi" hint=${modello ? 'Potete usarlo così com\'è o adattarlo: la scelta resta tracciata.' : null}>
      <select id="compose-modello" value=${modello} onChange=${e => pickModello(e.target.value)}>
        <option value="">Nessun modello</option>${cfg.modelli.map(m => html`<option key=${m.nome}>${m.nome}</option>`)}
      </select><//>` : null}
    <${Field} label="Oggetto"><input id="compose-titolo" type="text" value=${titolo} onChange=${e => setTitolo(e.target.value)}/><//>
    <${Field} label=${isExt ? 'Testo della comunicazione' : 'Testo'}
      hint=${isExt ? 'Sarà letta per tempestività, chiarezza, completezza, coerenza e correttezza di destinatario e firma.' : null}>
      <textarea id="compose-testo" className=${isExt ? 'big' : ''} value=${testo} onChange=${e => setTesto(e.target.value)}></textarea><//>
    <div className="actions">
      <button id="compose-go" className="btn" disabled=${!ok || busy} onClick=${submit}>${isVoce ? 'Manda a ' + voce : isExt ? (diretta ? 'Invia subito' : selfAuth ? 'Salva e firma' : 'Manda per l\'autorizzazione') : 'Manda la richiesta'}</button>
      <button className="btn plain" onClick=${onCancel}>Annulla</button>
    </div>
  </div>`;
}

/* =====================================================================
   Stanza della squadra (anche anteprima del facilitatore)
   ===================================================================== */
function useSeen(key, flows, byFlow) {
  const [seen, setSeen] = useState(() => {
    const s = lsGet('seen:' + key, null); if (s) return s;
    const init = {}; flows.forEach(f => { init[f.id] = activity(f, byFlow); }); return init;
  });
  useEffect(() => { lsSet('seen:' + key, seen); }, [seen]);
  const unread = f => activity(f, byFlow) > (seen[f.id] || 0);
  const mark = f => { const a = activity(f, byFlow); if ((seen[f.id] || 0) < a) setSeen(s => ({ ...s, [f.id]: a })); };
  return { unread, mark };
}

function Room({ d, ops, me, onLogout, extra }) {
  const cfg = normCfg(d.campaign && d.campaign.config);
  const who = makeWho(d);
  const team = who.team(me.team) || { nome: '', colore: '#152030' };
  const [tab, setTab] = useState(() => lsGet('tab:' + me.team, 'canale'));
  const [sel, setSel] = useState(null);
  const [compose, setCompose] = useState(null);
  const [mine, setMine] = useState(false);
  const [profile, setProfile] = useState(false);
  const [schermo, setSchermo] = useState(false);
  const [guida, setGuida] = useState(() => !me.preview && !lsGet('guida:' + me.team, false));
  const chiudiGuida = () => { lsSet('guida:' + me.team, true); setGuida(false); };
  useEffect(() => { lsSet('tab:' + me.team, tab); }, [tab]);

  const flows = d.flows.filter(f => f.from_team === me.team || f.to_team === me.team);
  const messages = d.messages.filter(m => !m.solo_team || m.solo_team === me.team);
  const byFlow = groupMsgs(messages);
  const seen = useSeen((me.preview ? 'p' : me.id) + ':' + me.team, flows, byFlow);
  const byKind = k => flows.filter(f => f.kind === k);
  const unreadIn = k => byKind(k).filter(seen.unread).length;
  const totalUnread = ['canale', 'esterna', 'situazione'].reduce((a, k) => a + unreadIn(k), 0);
  const prev = useRef(totalUnread);
  useEffect(() => {
    if (!me.preview && totalUnread > prev.current && lsGet('suono', true)) beep();
    prev.current = totalUnread;
  }, [totalUnread]);

  const selFlow = sel && flows.find(f => f.id === sel);
  const selAct = selFlow ? activity(selFlow, byFlow) : 0;
  useEffect(() => { if (selFlow) seen.mark(selFlow); }, [sel, selAct]);

  const open = id => {
    const f = flows.find(x => x.id === id); if (!f) return;
    setTab(f.kind); setCompose(null); setSel(id);
  };
  const mineFilter = f => f.opened_by === me.id || f.decided_by === me.id || f.inviato_by === me.id ||
    (byFlow[f.id] || []).some(m => m.author === me.id);
  const list = (tab === 'registro' ? [] : byKind(tab)).filter(f => !mine || mineFilter(f));
  const sectionOf = f => {
    if (f.stato === 'in_attesa' && f.to_team === me.team) return 0;
    if (f.kind === 'esterna' && f.stato === 'approvato' && f.from_team === me.team) return 1;
    if (f.stato === 'respinto' || f.stato === 'chiuso') return 3;
    return 2;
  };
  const sections = [tab === 'esterna' ? 'Da autorizzare' : 'Da decidere', 'Autorizzate, da inviare', 'In corso', 'Concluse'];
  // monitor della stanza: post e notizie simulati
  const monItems = d.monitor.filter(m => m.team_id === me.team);
  const showMonitor = monItems.length > 0 || !!team.autorizza;
  const [monSeen, setMonSeen] = useState(() => lsGet('mon:' + me.team, 0));
  const monLast = monItems.reduce((a, m) => Math.max(a, ms(m.created_at)), 0);
  const monUnread = tab === 'monitor' ? 0 : monItems.filter(m => ms(m.created_at) > monSeen).length;
  useEffect(() => { if (tab === 'monitor' && monLast > monSeen) { setMonSeen(monLast); lsSet('mon:' + me.team, monLast); } }, [tab, monLast]);
  const prevMon = useRef(monItems.length);
  useEffect(() => {
    if (!me.preview && monItems.length > prevMon.current && lsGet('suono', true)) beep();
    prevMon.current = monItems.length;
  }, [monItems.length]);
  // il numero di novità anche nel titolo della scheda del browser
  useEffect(() => {
    if (me.preview) return;
    const n = totalUnread + monUnread;
    document.title = (n ? '(' + n + ') ' : '') + team.nome + ' · ' + cfg.titolo;
  }, [totalUnread, monUnread, team.nome, cfg.titolo]);
  // avviso in alto quando arriva qualcosa per la stanza: situazioni, richieste, comunicazioni da autorizzare
  const perMe = flows.filter(f => f.to_team === me.team && f.from_team !== me.team && !(f.kind === 'situazione' && f.richiesta));
  const arrivati = useRef(null);
  const [arrivo, setArrivo] = useState(null);
  useEffect(() => {
    const ids = perMe.map(f => f.id);
    if (arrivati.current && !me.preview) {
      const nuovo = perMe.filter(f => !arrivati.current.includes(f.id)).sort(byTime).pop();
      if (nuovo) setArrivo(nuovo);
    }
    arrivati.current = ids;
  }, [perMe.map(f => f.id).join()]);
  useEffect(() => { if (!arrivo) return; const t = setTimeout(() => setArrivo(null), 15000); return () => clearTimeout(t); }, [arrivo]);
  const arrivoLbl = f => f.kind === 'situazione' ? 'Nuova situazione' : f.kind === 'esterna' ? (autonoma(f) ? 'Per conoscenza da ' + who.teamName(f.from_team) : 'Da autorizzare')
    : f.tipo === 'Informativa' ? 'Informativa da ' + who.teamName(f.from_team) : 'Richiesta da ' + who.teamName(f.from_team);
  const daInformare = flows.filter(f => f.from_team === me.team && nonInformata(f));
  const tabs = [
    ['canale', 'Tra le stanze', unreadIn('canale'), 'canale'],
    ['esterna', 'Comunicazioni esterne', unreadIn('esterna'), 'esterna'],
    ['situazione', 'Situazioni', unreadIn('situazione'), 'situazione'],
    ['registro', team.autorizza ? 'Log delle decisioni' : 'Registro ufficiale', 0, 'registro'],
  ].concat(showMonitor ? [['monitor', 'Monitoraggio media', monUnread, 'monitor']] : []);
  const tabOf = k => (k === 'voce' ? 'situazione' : k);
  const emptyText = {
    canale: 'Qui passano le richieste tra le due stanze. Scegline una dall\'elenco o aprine una nuova.',
    esterna: 'Qui si preparano le comunicazioni verso clienti, partner, autorità, assicurazione e stampa. Valgono solo se autorizzate per iscritto.',
    situazione: 'Qui arrivano i messaggi del SOC, dell\'IT Operations e degli esterni. Rispondi dentro la situazione o portala all\'altra squadra. Per una decisione tecnica, scrivi all\'Incident Manager con «Scrivi a una voce».',
  };
  const ruoli = cfg.ruoli[me.team] || [];

  return html`<div className="app">
    <${Band} color=${team.colore} title=${team.nome} sub=${me.preview ? 'Anteprima in sola lettura' : cfg.titolo} campaign=${d.campaign} logo=${cfg.logo}>
      <button className="btn-light" id="btn-schermo" title="Vista a tutto schermo per la TV della stanza" onClick=${() => setSchermo(true)}><${Icon} n="schermo"/> Schermo</button>
      ${!me.preview ? html`<button className="btn-light" id="btn-guida" title="Come funziona" onClick=${() => setGuida(true)}><${Icon} n="guida"/></button>
        <button className="btn-light" id="btn-profile" onClick=${() => setProfile(true)}>${me.nome}<small>${me.ruolo || 'Scegli il ruolo'}</small></button>
        <button className="btn-light" onClick=${onLogout}>Esci</button>` : extra || null}
    <//>
    ${!me.preview && !me.ruolo ? html`<div className="notice">Scegli il tuo ruolo del piano: comparirà accanto al tuo nome su richieste, decisioni e messaggi.
      <button className="btn small" onClick=${() => setProfile(true)}>Scegli il ruolo</button></div>` : null}
    ${daInformare.length && !me.preview ? html`<div className="notice">${daInformare.length === 1 ? 'Una comunicazione inviata in autonomia è ancora «non informata»' : daInformare.length + ' comunicazioni inviate in autonomia sono ancora «non informate»'}: mandate l'informativa all'altra stanza.
      <button className="btn small" onClick=${() => open(daInformare[0].id)}>Apri</button></div>` : null}
    <${Tabs} tabs=${tabs} value=${tab} color=${team.colore} onChange=${t => { setTab(t); setSel(null); setCompose(null); }}/>
    ${tab === 'monitor' ? html`<${Monitor} items=${monItems} cfg=${cfg}/>` : tab === 'registro' ? html`<${Registro} d=${d} me=${me} who=${who} ops=${ops}/>` : html`
    <div className=${'work' + (sel || compose ? ' has-sel' : '')}>
      <div className="list">
        <div className="list-head">
          ${me.preview ? html`<span></span>` : tab === 'situazione'
            ? html`<button id="btn-new-voce" className="btn small" onClick=${() => { setCompose({ kind: 'voce' }); setSel(null); }}>+ Scrivi a una voce</button>`
            : html`<button id="btn-new" className="btn small" onClick=${() => { setCompose({ kind: tab }); setSel(null); }}>
            ${tab === 'canale' ? '+ Nuova richiesta' : '+ Nuova comunicazione'}</button>`}
          <div className="seg" role="group" aria-label="Filtro">
            <button aria-pressed=${!mine} onClick=${() => setMine(false)}>Squadra</button>
            <button id="btn-mine" aria-pressed=${mine} onClick=${() => setMine(true)}>Le mie</button>
          </div>
        </div>
        <${FlowList} flows=${list} byFlow=${byFlow} sel=${sel} onSel=${id => { setSel(id); setCompose(null); }} unread=${seen.unread}
          sectionOf=${sectionOf} sections=${sections} who=${who} myTeam=${me.team}/>
      </div>
      <div className="detail">
        ${compose ? html`<${Compose} key=${JSON.stringify(compose)} kind=${compose.kind} prefill=${compose.prefill} cfg=${cfg} me=${me} who=${who} ops=${ops}
            onCancel=${() => setCompose(null)} onDone=${id => { setCompose(null); setTab(tabOf(compose.kind)); setSel(id); }}/>`
          : selFlow ? html`<${FlowDetail} key=${selFlow.id} f=${selFlow} msgs=${byFlow[selFlow.id] || []} d=${d} who=${who} me=${me} ops=${ops} cfg=${cfg}
            onCompose=${c => { setTab(tabOf(c.kind)); setSel(null); setCompose(c); }} onOpen=${open} onBack=${() => setSel(null)} hasFlow=${id => flows.some(x => x.id === id)}/>`
          : html`<div className="doc empty-state" style=${{ maxWidth: '620px' }}><${Icon} n=${tab}/><p>${emptyText[tab]}</p></div>`}
      </div>
    </div>`}
    ${arrivo && !schermo ? html`<div className="arrivo" role="status">
      <span className="k">${arrivoLbl(arrivo)}</span>
      <span style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}>${arrivo.voce ? html`<${Avatar} nome=${arrivo.voce}/>` : html`<${Icon} n=${arrivo.kind}/>`}<span className="t">${arrivo.titolo}</span></span>
      <span className="actions" style=${{ marginTop: '2px' }}><button className="btn small" onClick=${() => { open(arrivo.id); setArrivo(null); }}>Apri</button>
        <button className="btn plain small" onClick=${() => setArrivo(null)}>Più tardi</button></span>
    </div>` : null}
    ${schermo ? html`<${Schermo} d=${d} team=${team} cfg=${cfg} who=${who} onClose=${() => setSchermo(false)}/>` : null}
    ${guida ? html`<${Guida} team=${team} who=${who} cfg=${cfg} showMonitor=${showMonitor} onClose=${chiudiGuida}/>` : null}
    ${profile ? html`<${Profile} me=${me} ruoli=${ruoli} ops=${ops} onClose=${() => setProfile(false)}/>` : null}
    <${Toast} t=${ops.toast}/>
  </div>`;
}

/* Monitoraggio media simulato: titoli, TG, post e forum che il facilitatore fa comparire.
   Lo strumento filtra i contenuti in cui viene citata l'azienda. Non chiede risposte. */
const CANALI_MEDIA = [['social', 'Social'], ['stampa', 'Stampa'], ['tv', 'TV'], ['istituzioni', 'Istituzioni'], ['forum', 'Forum e dark web']];
const TONI = [['negativo', 'Negativo'], ['neutro', 'Neutro'], ['positivo', 'Positivo']];
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const fmtPortata = n => n == null ? 'portata n.d.' : n >= 1000000 ? (n / 1000000).toFixed(1).replace('.', ',') + ' mln' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);
function Monitor({ items, cfg }) {
  const [full, setFull] = useState(false);
  const [solo, setSolo] = useState(() => lsGet('mon:solo', true));
  const [canale, setCanale] = useState('tutti');
  const [tono, setTono] = useState('tutti');
  const [q, setQ] = useState('');
  useEffect(() => { lsSet('mon:solo', solo); }, [solo]);
  const parole = (cfg && cfg.monitor_parole) || [];
  const re = parole.length ? new RegExp('(' + parole.map(reEsc).join('|') + ')', 'gi') : null;
  const menziona = m => !!re && (re.lastIndex = 0, re.test((m.testo || '') + ' ' + (m.fonte || '')));
  const all = items.slice().sort((a, b) => byTime(b, a));
  const menzioni = all.filter(menziona);
  const list = all.filter(m => (!solo || menziona(m)) && (canale === 'tutti' || (m.canale || 'social') === canale)
    && (tono === 'tutti' || (m.sentiment || 'neutro') === tono)
    && (!q.trim() || ((m.testo || '') + ' ' + (m.fonte || '')).toLowerCase().includes(q.trim().toLowerCase())));
  const neg = menzioni.filter(m => m.sentiment === 'negativo').length;
  const portata = menzioni.reduce((a, m) => a + (m.portata || 0), 0);
  const recenti = menzioni.filter(m => Date.now() - ms(m.created_at) < 30 * 60000).length;
  const mark = s => {
    if (!re) return s;
    return String(s || '').split(re).map((p, i) => i % 2 ? html`<mark key=${i}>${p}</mark>` : p);
  };
  const toggle = () => {
    const next = !full; setFull(next);
    try {
      if (next && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      if (!next && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (e) {}
  };
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') setFull(false); };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  }, []);
  return html`<div className=${'monitor' + (full ? ' full' : '')} id="monitor">
    <div className="monitor-head">
      <div><h2>Monitoraggio media</h2>
        <div className="mon-sub"><span className="live">In diretta</span> Parole monitorate: ${parole.length ? parole.map(p => html`<b key=${p}>${p}</b>`) : 'nessuna'} · contenuti simulati</div></div>
      <button className="btn-light" onClick=${toggle}>${full ? 'Esci dallo schermo intero' : 'Schermo intero'}</button>
    </div>
    <div className="mon-kpi">
      <div><b>${menzioni.length}</b><span>menzioni${cfg && cfg.azienda ? ' di ' + cfg.azienda : ''}</span></div>
      <div><b>${recenti}</b><span>nell'ultima mezz'ora</span></div>
      <div><b className=${menzioni.length && neg / menzioni.length >= 0.5 ? 'neg' : ''}>${menzioni.length ? Math.round(100 * neg / menzioni.length) : 0}%</b><span>con tono negativo</span></div>
      <div><b>${fmtPortata(portata)}</b><span>portata stimata delle menzioni</span></div>
      <div><b>${all.length - menzioni.length}</b><span>contenuti senza menzione</span></div>
    </div>
    <div className="mon-filters">
      <label className="mon-switch"><input id="mon-solo" type="checkbox" checked=${solo} onChange=${e => setSolo(e.target.checked)}/> Solo menzioni dell'azienda</label>
      <div className="mon-seg" role="group" aria-label="Canale">${[['tutti', 'Tutti i canali']].concat(CANALI_MEDIA).map(([k, l]) => html`<button key=${k} aria-pressed=${canale === k} onClick=${() => setCanale(k)}>${l}</button>`)}</div>
      <div className="mon-seg" role="group" aria-label="Tono">${[['tutti', 'Ogni tono']].concat(TONI).map(([k, l]) => html`<button key=${k} aria-pressed=${tono === k} onClick=${() => setTono(k)}>${l}</button>`)}</div>
      <input id="mon-q" type="text" className="mon-q" placeholder="Cerca nei contenuti" value=${q} onChange=${e => setQ(e.target.value)}/>
    </div>
    ${list.length ? list.map((m, i) => html`<${MediaCard} key=${m.id} m=${m} mark=${mark} isNew=${i === 0}/>`)
      : html`<p style=${{ color: '#8FA0B3' }}>${all.length ? 'Nessun contenuto con questi filtri.' : 'Per ora niente da segnalare.'}</p>`}
  </div>`;
}

/* Un contenuto dei media con l'aspetto del suo canale: post, ritaglio di giornale, sovrimpressione del TG, comunicato, forum. */
function MediaCard({ m, mark, isNew }) {
  const c = m.canale || 'social';
  const tx = mark ? mark(m.testo) : m.testo;
  const cls = 'media ' + c + ' ton-' + (m.sentiment || 'neutro') + (isNew ? ' new' : '');
  const meta = html`<span className="meta-r">${m.portata != null ? html`<span>${fmtPortata(m.portata)}</span>` : null}<time>${ora(m.created_at)}</time></span>`;
  if (c === 'stampa') return html`<article className=${cls}><div className="mh"><span className="mast">${m.fonte}</span>${meta}</div><div className="x">${tx}</div></article>`;
  if (c === 'tv') return html`<article className=${cls}><div className="bar"><span className="lbl">ULTIM'ORA</span><span className="src"><span>${m.fonte}</span>${meta}</span></div><div className="x">${tx}</div></article>`;
  if (c === 'istituzioni') return html`<article className=${cls}><div className="mh"><span className="lbl">COMUNICATO · ${m.fonte}</span>${meta}</div><div className="x">${tx}</div></article>`;
  if (c === 'forum') return html`<article className=${cls}><div className="mh"><span>${'> ' + m.fonte}</span>${meta}</div><div className="x">${tx}</div></article>`;
  return html`<article className=${cls}><div className="mh"><span className="hd"><${Avatar} nome=${m.fonte}/>${m.fonte}</span>${meta}</div><div className="x">${tx}</div></article>`;
}

/* Schermo della stanza: da proiettare sulla TV. Orologio della crisi, ultim'ora, media e ciò che arriva alla squadra. */
function Schermo({ d, team, cfg, who, onClose }) {
  const now = useNow(20000);
  const media = d.monitor.filter(m => m.team_id === team.id).sort((a, b) => byTime(b, a));
  const arrivi = d.flows.filter(f => f.to_team === team.id && f.from_team !== team.id && !(f.kind === 'situazione' && f.richiesta)).sort((a, b) => byTime(b, a)).slice(0, 7);
  const urgente = media.find(m => (m.canale === 'tv' || m.canale === 'stampa') && now - ms(m.created_at) < 20 * 60000);
  const attesa = d.flows.filter(f => f.to_team === team.id && f.stato === 'in_attesa').length;
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k);
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    return () => {
      document.removeEventListener('keydown', k);
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
    };
  }, []);
  const da = f => f.kind === 'situazione' ? f.voce : f.kind === 'esterna' && !autonoma(f) ? 'Da autorizzare · ' + who.teamName(f.from_team) : who.teamName(f.from_team);
  return html`<div className="schermo" style=${{ '--team': team.colore }} role="dialog" aria-label="Schermo della stanza">
    <button className="btn-light sch-close" onClick=${onClose}>Chiudi · Esc</button>
    <header className="sch-head">
      <div><div className="sch-team">${team.nome}</div><div className="hint" style=${{ color: '#8FA0B3', marginTop: '8px' }}>${cfg.titolo}${attesa ? ' · ' + attesa + ' in attesa di decisione' : ''}</div></div>
      <div className="sch-clock"><div className="f">${(d.campaign && d.campaign.fase) || ''}</div><div className="t">${(d.campaign && d.campaign.tempo_sim) || ora(now)}</div></div>
    </header>
    ${urgente ? html`<div className="sch-ticker"><span className="lbl">ULTIM'ORA</span><span className="tk">${urgente.fonte}: ${urgente.testo}</span></div>` : html`<div></div>`}
    <div className=${'sch-body' + (media.length ? '' : ' one')}>
      ${media.length ? html`<section className="sch-col"><h3>Dai media</h3>${media.slice(0, 8).map((m, i) => html`<${MediaCard} key=${m.id} m=${m} isNew=${i === 0}/>`)}</section>` : null}
      <section className="sch-col"><h3>Arrivato in stanza</h3>
        ${arrivi.length ? arrivi.map(f => html`<div key=${f.id} className="sch-arr" style=${{ '--c': f.kind === 'situazione' ? coloreDi(f.voce) : who.teamColor(f.from_team) }}>
          <div className="h">${f.kind === 'situazione' ? html`<${Avatar} nome=${f.voce}/>` : html`<${Icon} n=${f.kind}/>`}<span>${da(f)}</span><span>· ${ora(f.created_at)}</span></div>
          <div className="t">${f.titolo}</div></div>`) : html`<p style=${{ color: '#8FA0B3' }}>Ancora niente: la crisi sta per cominciare.</p>`}
      </section>
    </div>
  </div>`;
}

/* Guida al primo accesso: quattro schermate, poi si riapre dal punto interrogativo nella banda. */
function Guida({ team, who, cfg, showMonitor, onClose }) {
  const [i, setI] = useState(0);
  const altre = who.others(team.id).map(t => t.nome).join(', ') || 'l\'altra stanza';
  const autorizza = (who.authorizers(team.id)[0] || {}).nome;
  const passi = [
    ['Benvenuti in ' + team.nome, html`<p>Lavorate come in una crisi vera: quello che arriva qui è tutto ciò che sapete. Nessuna risposta è giusta in partenza, conta come decidete e come comunicate.</p>
      <p style=${{ marginTop: '8px' }}>Per prima cosa scegli il tuo <b>ruolo del piano</b> dal tuo nome, in alto a destra: comparirà su ogni messaggio e decisione.</p>`],
    ['Dove arrivano le cose', html`<ul style=${{ margin: '0', paddingLeft: '18px', lineHeight: 1.55 }}>
      <li><b>Situazioni</b>: messaggi di tecnici, clienti, autorità e altri attori. Rispondete dentro la situazione o portatela a ${altre}.</li>
      <li><b>Tra le stanze</b>: richieste, decisioni e informative con ${altre}.</li>
      ${showMonitor ? html`<li><b>Monitoraggio media</b>: titoli, TG e post che citano ${cfg.azienda || 'l\'azienda'}.</li>` : null}
      <li>Quando arriva qualcosa compare un avviso in alto e, se lo lasci attivo, un suono.</li></ul>`],
    ['Come comunicate all\'esterno', html`<p>In <b>Comunicazioni esterne</b> scrivete il testo come lo leggerà il destinatario: ognuno risponde in base a ciò che riceve e da chi.</p>
      <p style=${{ marginTop: '8px' }}>${team.autorizza ? 'Le vostre comunicazioni le firmate voi.' : 'Prima di partire le autorizza ' + (autorizza || 'la squadra che autorizza') + '.'} In caso di urgenza potete inviare subito, senza autorizzazione: poi va mandata un'informativa all'altra stanza.</p>`],
    ['Tenete traccia', html`<p>Nel <b>${team.autorizza ? 'Log delle decisioni' : 'Registro ufficiale'}</b> annotate cosa avete deciso, chi e perché: nella discussione finale i registri delle stanze si mettono uno accanto all'altro.</p>
      <p style=${{ marginTop: '8px' }}>Con <b>Schermo</b>, nella banda in alto, la stanza si proietta sulla TV: orologio della crisi, ultim'ora e ciò che arriva.</p>`],
  ];
  const [titolo, corpo] = passi[i];
  return html`<${Modal} onClose=${onClose}>
    <div className="guida-steps" aria-hidden="true">${passi.map((_, j) => html`<span key=${j} className=${j <= i ? 'on' : ''}></span>`)}</div>
    <h2>${titolo}</h2>
    <div style=${{ marginTop: '10px' }}>${corpo}</div>
    <div className="actions" style=${{ marginTop: '16px' }}>
      ${i < passi.length - 1 ? html`<button id="guida-avanti" className="btn" onClick=${() => setI(i + 1)}>Avanti</button>` : html`<button id="guida-fine" className="btn" onClick=${onClose}>Iniziamo</button>`}
      ${i > 0 ? html`<button className="btn plain" onClick=${() => setI(i - 1)}>Indietro</button>` : html`<button className="btn plain" onClick=${onClose}>Salta la guida</button>`}
    </div>
  <//>`;
}

function Profile({ me, ruoli, ops, onClose }) {
  const known = ruoli.includes(me.ruolo);
  const [sel, setSelR] = useState(me.ruolo ? (known ? me.ruolo : '__altro') : '');
  const [free, setFree] = useState(known ? '' : (me.ruolo || ''));
  const [suono, setSuono] = useState(lsGet('suono', true));
  const [pwd, setPwd] = useState(false);
  const ruolo = sel === '__altro' ? free.trim() : sel;
  if (pwd) return html`<${Modal} onClose=${onClose}><${NuovaPassword} titolo="Cambia password" onCancel=${() => setPwd(false)}
    onDone=${() => { setPwd(false); ops.say('Password cambiata'); }}/><//>`;
  const save = async () => {
    lsSet('suono', suono);
    const r = await ops.run(sb.rpc('set_ruolo', { p_ruolo: ruolo }), ['members'], 'Profilo aggiornato');
    if (!r.error) onClose();
  };
  return html`<${Modal} onClose=${onClose}>
    <h2>${me.nome}</h2>
    <${Field} label="Ruolo del piano" hint="I ruoli si assegnano in sala: scegli quello che ti è stato dato.">
      <select id="ruolo-select" value=${sel} onChange=${e => setSelR(e.target.value)}>
        <option value="">Nessuno</option>${ruoli.map(r => html`<option key=${r}>${r}</option>`)}<option value="__altro">Altro…</option>
      </select>
      ${sel === '__altro' ? html`<input type="text" style=${{ marginTop: '6px' }} value=${free} onChange=${e => setFree(e.target.value)} placeholder="Il tuo ruolo"/>` : null}
    <//>
    <label className="field" style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}>
      <input type="checkbox" checked=${suono} onChange=${e => setSuono(e.target.checked)}/> Suono quando arriva qualcosa di nuovo</label>
    <div className="actions"><button id="ruolo-save" className="btn" onClick=${save}>Salva</button><button className="btn plain" onClick=${onClose}>Annulla</button>
      <span style=${{ flex: 1 }}></span><button className="link" onClick=${() => setPwd(true)}>Cambia password</button></div>
  <//>`;
}

function Registro({ d, me, who, ops }) {
  const entries = d.registro.filter(r => r.team_id === me.team).sort((a, b) => byTime(b, a));
  // il Comitato tiene il Log delle decisioni (Scribe), la gestione operativa il Registro ufficiale dell'incidente
  const comitato = !!(who.team(me.team) || {}).autorizza;
  return html`<div className="page" id="registro">
    <h2>${comitato ? 'Log delle decisioni' : 'Registro ufficiale dell\'incidente'}</h2>
    <p className="hint" style=${{ marginTop: '4px', maxWidth: '68ch' }}>${comitato ? 'Lo tiene lo Scribe del Comitato di Crisi. ' : 'Lo apre e lo tiene la gestione operativa, a partire dalla dichiarazione dell\'incidente. '}Ogni voce resta agli atti con orario, tempo simulato e autore, e non si modifica. Nella discussione finale i registri delle squadre vengono messi uno accanto all'altro. Per correggere, aggiungi una nuova voce.</p>
    ${!me.preview ? html`<div style=${{ maxWidth: '780px' }}><${Composer} id="reg-text" label="Aggiungi al registro"

/* =====================================================================
   Regia del facilitatore
   ===================================================================== */
function fiduciaSerie(items) {
  let v = 100;
  return items.slice().sort(byTime).map(x => { v = Math.max(0, Math.min(100, v + x.delta)); return { ...x, valore: v }; });
}
function FiduciaChart({ serie, fasi }) {
  const W = 680, H = 200, L = 34, R = 12, T = 12, B = 26;
  const pts = [{ valore: 100, created_at: null }].concat(serie);
  const n = pts.length;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1));
  const y = v => T + (100 - v) * (H - T - B) / 100;
  const poly = pts.map((p, i) => x(i) + ',' + y(p.valore)).join(' ');
  return html`<svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Andamento della fiducia dei clienti" style=${{ width: '100%', maxWidth: '760px', display: 'block' }}>
    ${[0, 50, 100].map(v => html`<g key=${v}><line x1=${L} x2=${W - R} y1=${y(v)} y2=${y(v)} stroke="#D0D7E0" stroke-dasharray=${v === 50 ? '3 4' : null}/>
      <text x=${L - 6} y=${y(v) + 4} textAnchor="end" fontSize="11" fill="#5A6576">${v}</text></g>`)}
    <polyline points=${poly} fill="none" stroke="#152030" strokeWidth="2.5" strokeLinejoin="round"/>
    ${pts.map((p, i) => html`<circle key=${i} cx=${x(i)} cy=${y(p.valore)} r="4" fill=${p.delta < 0 ? '#B3261E' : p.delta > 0 ? '#2A7634' : '#152030'}>
      <title>${p.created_at ? ora(p.created_at) + ' ' + (p.delta > 0 ? '+' : '') + p.delta + ': ' + p.motivo + (p.fase ? ' (' + p.fase + ')' : '') : 'Inizio: 100'}</title></circle>`)}
  </svg>`;
}

function Regia({ user, onLogout }) {
  const { d, load, err } = useData('master');
  const ops = useOps(load);
  const [tab, setTab] = useState(() => lsGet('rtab', 'conduzione'));
  const [sel, setSel] = useState(null);

  const [prevTeam, setPrevTeam] = useState('A');

  useEffect(() => { lsSet('rtab', tab); }, [tab]);
  if (!d.loaded) return html`<${Loading}/>`;
  const cfg = normCfg(d.campaign && d.campaign.config);
  const who = makeWho(d);
  const pt = who.ids.includes(prevTeam) ? prevTeam : who.ids[0];
  if (vista && who.team(vista)) return html`<div className="app">
    <${Room} key=${vista} d=${d} ops=${ops} me=${{ id: 'anteprima', team: vista, preview: true }} extra=${html`
      <span className="preview-tag">Vista partecipanti · sola lettura</span>

    </div>`;
  else if (tab === 'partecipanti') body = html`<${Partecipanti} d=${d} cfg=${cfg} who=${who} ops=${ops}/>`;

  return html`<div className="app">
    <${Band} color=${colRegia} title="Regia" sub=${cfg.titolo} campaign=${d.campaign} logo=${cfg.logo}>
      <button id="btn-vista-partecipanti" className="btn-light" disabled=${!pt} onClick=${() => setVista(pt)}>Vista partecipanti<small>come la vede una squadra</small></button>
      <button id="btn-password" className="btn-light" onClick=${() => setPwd(true)}>${user.email}<small>Cambia password</small></button>
      <button className="btn-light" onClick=${onLogout}>Esci</button>
    <//>
    ${err ? html`<div className="notice" role="alert">${err}</div>` : null}
    <${Tabs} tabs=${tabs} value=${tab} color=${colRegia} onChange=${t => { setTab(t); setSel(null); }}/>

      onDone=${() => { setPwd(false); ops.say('Password cambiata'); }}/><//>` : null}
    <${Toast} t=${ops.toast}/>
  </div>`;
}

    <div className="section"><h2>Il quadro</h2>

        <div className="stat"><b>${cnt('canale', f => f.stato === 'in_attesa')}</b><span>richieste in attesa</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'in_attesa')}</b><span>esterne da autorizzare</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'approvato')}</b><span>autorizzate non inviate</span></div>
        <div className="stat"><b>${cnt('esterna', f => f.stato === 'inviato' || f.inviato_at)}</b><span>esterne inviate</span></div>
        <div className="stat"><b>${d.members.length}</b><span>partecipanti</span></div>
      </div>
      ${gestire.length ? html`<div className="cards">${gestire.map(f => html`<button key=${f.id} className="row" style=${{ '--rail': railOf(f, who), background: 'var(--paper)', border: '1px solid var(--line)' }} onClick=${() => goFlow(f.id)}>
        <span className="t">${f.titolo}</span><span className="m">${routeOf(f, who, null)}<${Stamp} f=${f}/></span></button>`)}</div>` : null}
    </div>

    <div className="section"><h2>Storico delle fasi</h2>
      ${storico.length ? html`<div className="tbl-wrap"><table><thead><tr><th>Ora</th><th>Fase</th><th>Tempo simulato</th></tr></thead><tbody>
        ${storico.map(s => html`<tr key=${s.id}><td className="n">${oraSec(s.created_at)}</td><td>${s.fase}</td><td>${s.tempo_sim}</td></tr>`)}
      </tbody></table></div>` : html`<p className="empty">La sessione non è ancora partita: scegli la prima fase.</p>`}
